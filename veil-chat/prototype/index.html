<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Veil</title>
<style>
  :root{
    --bg:#FAF8F2; --ink:#26251F; --dim:#9C968A; --line:#E8E3D6; --danger:#BF4A31;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:#EEE9DD;color:var(--ink);display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased}
  #app{position:relative;width:100%;max-width:430px;height:100dvh;max-height:920px;background:var(--bg);
    overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.5)}
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea{font-family:inherit;font-size:16px;color:inherit}
  ::placeholder{color:var(--dim)}
  #app{user-select:none;-webkit-user-select:none}
  input,textarea{user-select:text;-webkit-user-select:text}

  .screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);animation:fade .28s ease}
  .screen.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes rise{from{transform:translateY(100%)}to{transform:none}}

  .pad{padding:var(--s5)}
  .grow{flex:1;overflow-y:auto}
  .col{display:flex;flex-direction:column}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1}
  .dim{color:var(--dim)}
  .sp{flex:1}

  /* 타이포 */
  .wordmark{font-size:38px;font-weight:800;letter-spacing:.06em}
  .h-hero{font-size:26px;font-weight:800;line-height:1.35}
  .h-page{font-size:24px;font-weight:800}
  .h-q{font-size:20px;font-weight:700}
  .body{font-size:16px;line-height:1.6}
  .small{font-size:14px}
  .tiny{font-size:12px}

  /* 버튼 = 글씨만 */
  .cta{display:block;width:100%;text-align:center;font-size:19px;font-weight:700;padding:16px 0;color:var(--ink)}
  .cta:disabled{color:var(--dim);opacity:.5}
  .cta.sub{font-weight:500;color:var(--dim);font-size:16px}
  .cta.danger{color:var(--danger)}
  .link{color:var(--dim);font-size:15px;font-weight:500}

  /* 선택형 텍스트(관심사·옵션): 선택 시 밑줄 */
  .pick{color:var(--dim);font-size:17px;font-weight:500;padding:6px 0;background:none}
  .pick.on{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
  .wrap{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5)}

  /* 입력 = 밑줄 필드 */
  .field{width:100%;padding:12px 2px;background:none;border:0;border-bottom:1.5px solid var(--line);font-size:20px}
  .field:focus{outline:0;border-bottom-color:var(--ink)}
  .note{margin-top:var(--s2);font-size:13px}

  /* 상단바 */
  .top{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);padding-top:max(var(--s4),env(safe-area-inset-top))}
  .top .back{font-size:26px;line-height:1;color:var(--ink);margin-left:-4px}
  .top .t{font-size:18px;font-weight:700}
  .top .act{font-size:15px;color:var(--dim);font-weight:600}

  /* 하단 내비 = 글씨 */
  .nav{display:flex;justify-content:center;padding:var(--s4) 0 calc(var(--s4) + env(safe-area-inset-bottom))}
  .navrow{display:flex;align-items:center;justify-content:space-between;width:240px;max-width:calc(100% - 48px)}
  .nav a{color:var(--dim);font-size:17px;font-weight:500}
  .nav a.on{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
  .nav .dot{color:var(--dim)}
  .page{flex:1;overflow-y:auto;display:none;flex-direction:column}
  .page.on{display:flex}

  /* 목록 행 */
  .row{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) 0;border-top:1px solid var(--line);text-align:left;width:100%}
  .row:last-child{border-bottom:1px solid var(--line)}
  .row .nm{font-size:17px;font-weight:700}
  .row .meta{font-size:13px;color:var(--dim);margin-top:2px}

  /* 설정 메뉴 행 */
  .mrow{display:flex;align-items:center;width:100%;text-align:left;padding:18px 0;border-top:1px solid var(--line);font-size:17px;color:var(--ink)}
  .mrow:last-of-type{border-bottom:1px solid var(--line)}
  .mrow .arr{margin-left:auto;color:var(--dim);font-size:18px}
  .mrow.danger{color:var(--danger)}
  .mgroup{margin-top:var(--s6)}
  .mlabel{font-size:13px;color:var(--dim);font-weight:600;margin-bottom:2px}

  /* 채팅 */
  .timer{text-align:center;padding:10px;font-size:13px;color:var(--dim);border-bottom:1px solid var(--line)}
  .msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:var(--s2);padding:var(--s4) var(--s5)}
  .msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.45;word-break:break-word}
  .msg.them{align-self:flex-start;border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:5px}
  .msg.sys{align-self:center;max-width:92%;text-align:center;color:var(--dim);font-size:13px;padding:4px}
  .composer{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s5) calc(var(--s3) + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .composer input{flex:1;padding:10px 2px;background:none;border:0;border-bottom:1.5px solid var(--line)}
  .composer input:focus{outline:0;border-bottom-color:var(--ink)}
  .composer .send{font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap}
  .composer .send:disabled{color:var(--dim)}
  .decide{padding:var(--s4) var(--s5) calc(var(--s4) + env(safe-area-inset-bottom));border-top:1px solid var(--line);text-align:center}
  .decide .dtxt{font-size:14px;margin-bottom:var(--s3)}
  .decide .drow{display:flex;justify-content:center;gap:var(--s7)}
  .decide .dbtn{font-size:18px;font-weight:700;padding:4px 0}
  .decide .dbtn.no{color:var(--dim);font-weight:500}

  /* 시트 */
  .ovl{position:absolute;inset:0;background:rgba(20,18,12,.5);display:none;align-items:flex-end;z-index:40}
  .ovl.on{display:flex;animation:fade .2s}
  .sheet{width:100%;background:var(--bg);border-radius:22px 22px 0 0;padding:var(--s5) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom));animation:rise .26s ease}
  .sheet h3{font-size:20px;font-weight:800;margin-bottom:var(--s2)}
  .sheet .opt{display:block;width:100%;text-align:left;padding:16px 0;font-size:17px;border-top:1px solid var(--line)}
  .sheet .opt.danger{color:var(--danger)}

  /* 매칭 애니메이션 */
  .pulse{width:14px;height:14px;border-radius:50%;background:var(--ink);animation:pulse 1s infinite ease-in-out}
  @keyframes pulse{0%,100%{transform:scale(.6);opacity:.3}50%{transform:scale(1);opacity:1}}

  /* PIN 잠금 */
  .pin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--s5)}
  .pin h2{font-size:22px;font-weight:800}
  .pin .psub{color:var(--dim);font-size:14px;margin-top:var(--s2);text-align:center}
  .pin .dots{display:flex;gap:20px;margin:var(--s6) 0 var(--s2)}
  .pin .pdot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
  .pin .pdot.on{background:var(--ink)}
  .pin .perr{color:var(--danger);font-size:14px;height:20px;margin-bottom:var(--s2)}
  .keypad{display:grid;grid-template-columns:repeat(3,68px);gap:16px}
  .keypad button{font-size:26px;font-weight:600;padding:12px 0;color:var(--ink);background:none;border-radius:12px}
  .keypad button:active{background:var(--line)}
  .keypad .empty{visibility:hidden}
  /* 토스트 */
  .toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:90;white-space:nowrap;pointer-events:none}
  .toast.on{opacity:.96}
</style>
</head>
<body>
<div id="app">

  <!-- 인트로 -->
  <section id="s-intro" class="screen">
    <div class="center pad">
      <div class="wordmark">Veil</div>
      <p class="body dim" style="margin-top:var(--s4);max-width:260px">
        사진도, 나이도, 목소리도 없이<br><b style="color:var(--ink)">오직 글로만</b> 만나는 익명 대화
      </p>
    </div>
    <div class="pad">
      <button class="cta" onclick="startOnboarding()">시작하기</button>
    </div>
  </section>

  <!-- 온보딩 1: 닉네임 -->
  <section id="s-nick" class="screen">
    <div class="top"><button class="back" onclick="go('s-intro')">‹</button></div>
    <div class="grow pad">
      <h1 class="h-page">어떻게 불러드릴까요?</h1>
      <p class="dim body" style="margin-top:var(--s2)">언제든 바꿀 수 있어요.</p>
      <input id="nickInput" class="field" style="margin-top:var(--s6)" maxlength="20" placeholder="닉네임" oninput="checkNick()">
      <div id="nickNote" class="note dim">두 글자 이상 입력해주세요.</div>
      <button class="link" style="margin-top:var(--s4)" onclick="randomNick()">랜덤으로 정하기</button>
    </div>
    <div class="pad"><button id="nickNext" class="cta" disabled onclick="go('s-interest')">다음</button></div>
  </section>

  <!-- 온보딩 2: 관심사 -->
  <section id="s-interest" class="screen">
    <div class="top"><button class="back" onclick="go('s-nick')">‹</button></div>
    <div class="grow pad">
      <h1 class="h-page">무슨 얘기를 좋아하세요?</h1>
      <p id="intCount" class="dim body" style="margin-top:var(--s2)">한 개 이상 골라주세요.</p>
      <div id="intWrap" class="wrap" style="margin-top:var(--s6)"></div>
    </div>
    <div class="pad"><button id="intDone" class="cta" disabled onclick="openAbout()">다음</button></div>
  </section>

  <!-- 온보딩 3: 나에 대해 (선택) -->
  <section id="s-about" class="screen">
    <div class="top"><button class="back" onclick="go('s-interest')">‹</button></div>
    <div class="grow pad">
      <h1 class="h-page">나를 조금 더 알려주세요</h1>
      <p class="dim body" style="margin-top:var(--s2)">선택 사항이에요. 언제든 바꿀 수 있어요.</p>
      <div class="mlabel" style="margin-top:var(--s6)">MBTI</div>
      <div id="obMbti" class="wrap" style="margin-top:var(--s3)"></div>
      <div class="mlabel" style="margin-top:var(--s6)">채팅 유형</div>
      <div id="obType" class="wrap" style="margin-top:var(--s3)"></div>
    </div>
    <div class="pad"><button class="cta" onclick="finishOnboarding()">시작하기</button></div>
  </section>

  <!-- 메인 -->
  <section id="s-main" class="screen">
    <div id="pg-match" class="page on"></div>
    <div id="pg-list" class="page"></div>
    <div id="pg-set" class="page"></div>
    <div class="nav">
      <div class="navrow">
        <a id="nv-match" onclick="tab('match')">매칭</a>
        <span class="dot">·</span>
        <a id="nv-list" onclick="tab('list')">대화</a>
        <span class="dot">·</span>
        <a id="nv-set" onclick="tab('set')">설정</a>
      </div>
    </div>
  </section>

  <!-- 매칭 중 -->
  <section id="s-matching" class="screen">
    <div class="center">
      <div class="pulse"></div>
      <p class="body dim" style="margin-top:var(--s5)">대화 상대를 찾고 있어요…</p>
    </div>
    <div class="pad"><button class="cta sub" onclick="cancelMatch()">취소</button></div>
  </section>

  <!-- 채팅방 -->
  <section id="s-chat" class="screen">
    <div class="top">
      <button class="back" onclick="tab('list');go('s-main')">‹</button>
      <div class="t" id="chatNick">상대</div>
      <div class="sp"></div>
      <button class="act" onclick="openMenu()">관리</button>
    </div>
    <div class="timer" id="chatTimer"></div>
    <div class="msgs" id="chatMsgs"></div>
    <div class="composer" id="composer">
      <input id="chatInput" placeholder="메시지 입력" autocomplete="off"
        onkeydown="onKey(event)" oninput="toggleSend()">
      <button class="send" id="sendBtn" disabled onclick="sendMsg()">전송</button>
    </div>
    <div class="decide" id="chatDecide" style="display:none"></div>
  </section>

  <!-- 설정 하위 화면 -->
  <section id="s-sub" class="screen">
    <div class="top"><button class="back" onclick="tab('set');go('s-main')">‹</button><div class="t" id="subTitle"></div></div>
    <div class="grow pad" id="subBody" style="padding-top:0"></div>
  </section>

  <!-- PIN 잠금 화면 -->
  <section id="s-pin" class="screen">
    <div class="top"><button class="back" id="pinBack" onclick="pinCancel()">‹</button></div>
    <div class="pin">
      <h2 id="pinTitle">잠금</h2>
      <div class="psub" id="pinSub"></div>
      <div class="dots" id="pinDots"></div>
      <div class="perr" id="pinErr"></div>
      <div class="keypad" id="keypad"></div>
    </div>
  </section>

  <!-- 관리 시트 -->
  <div id="sheet" class="ovl" onclick="if(event.target===this)closeMenu()">
    <div class="sheet">
      <h3 id="sheetName">상대</h3>
      <p class="dim small" id="sheetSub"></p>
      <div style="margin-top:var(--s4)">
        <button class="opt" id="optFriend" onclick="befriend()">친구 추가 <span class="dim">· 시간제한 없이 대화</span></button>
        <button class="opt danger" onclick="leaveChat()">대화 나가기</button>
        <button class="opt danger" onclick="blockAndLeave()">차단하고 나가기 <span class="dim">· 다시 매칭 안 됨</span></button>
      </div>
      <button class="cta sub" style="margin-top:var(--s2)" onclick="closeMenu()">닫기</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script>
/* ---------- 상태 ---------- */
const KEY_P='veil2_profile', KEY_C='veil2_chats', KEY_B='veil2_blocks';
const DAY=24*60*60*1000, GRACE=12*60*60*1000;
const INTERESTS=['음악','영화','독서','여행','운동','요리','게임','사진','글쓰기','커피','반려동물','밤산책'];
const MBTIS=['ISTJ','ISFJ','INFJ','INTJ','ISTP','ISFP','INFP','INTP','ESTP','ESFP','ENFP','ENTP','ESTJ','ESFJ','ENFJ','ENTJ','모름'];
const CHATTYPES=['가벼운 수다','깊은 대화','고민 상담','취미 이야기','아무거나'];
const ADJ=['어수선한','분주한','경건한','쾌활한','활기찬','고요한','평온한','차분한','생동감 있는','역동적인','활발한','침착한','긴장감 있는','여유로운','북적이는','부산한','소란스러운','시끌벅적한','조용한','적막한','화기애애한','따뜻한','포근한','아늑한','산뜻한','상쾌한','신선한','밝은','경쾌한','유쾌한','즐거운','들뜬','설레는','흥겨운','열정적인','열렬한','치열한','격렬한','진지한','엄숙한','묵직한','신비로운','몽환적인','낭만적인','감성적인','웅장한','장엄한','웅성웅성한','분산된','질서정연한','미니멀한','클래식한','빈티지한','모던한','레트로한','세련된','고급스러운','자연스러운','드라마틱한','영화 같은','미래적인','동화 같은','환상적인','따사로운','청량한','음산한','을씨년스러운','황홀한','에너지가 넘치는','긴박한','여유가 흐르는','생기가 넘치는','활력이 넘치는','편안한','안정감 있는','반짝이는','빛나는','은은한','선명한','맑은','투명한','부드러운','단단한','유연한','묵묵한','든든한','씩씩한','당당한','자신감 있는','용감한','대담한','호기심 많은','엉뚱한','재치 있는','영리한','지혜로운','순수한','순박한','친근한','다정한','온화한','부지런한','성실한','꼼꼼한','자유로운','유유한','느긋한','반듯한','정갈한','말끔한','싱그러운','향기로운','달콤한','싱싱한','폭신한','포슬포슬한','촉촉한','반들반들한','반짝반짝한','출렁이는','흩날리는','피어나는','자라나는','스며드는','물드는'];
const NOUN=['책','의자','탁자','창문','문','시계','거울','화분','꽃','나무','돌','구름','별','달','태양','촛불','전구','랜턴','우산','모자','안경','신발','가방','열쇠','병','컵','접시','포크','숟가락','베개','담요','카메라','노트북','스마트폰','이어폰','스피커','피아노','기타','바이올린','풍선','연','종이비행기','퍼즐','블록','액자','편지','지도','나침반','망원경','돋보기','연필','볼펜','지우개','자','공책','노트','달력','캘린더','엽서','봉투','스티커','북마크','책갈피','돋보기안경','물병','텀블러','주전자','찻잔','머그컵','냄비','프라이팬','쟁반','바구니','상자','리본','단추','실타래','바늘','쿠션','소파','커튼','카펫','액자걸이','선반','책장','사다리','자전거','스케이트보드','킥보드','드론','망치','붓','물감','팔레트','이젤','화병','종','오르골','모래시계','체스말'];
function randomNickStr(){return ADJ[Math.floor(Math.random()*ADJ.length)]+' '+NOUN[Math.floor(Math.random()*NOUN.length)]}
const GREET=['안녕하세요, 반가워요.','안녕하세요! 오늘 하루 어땠어요?','반가워요 :) 무슨 얘기 나눠볼까요?','안녕하세요. 잘 지내셨어요?'];
const REPLY=['오 저도 그래요.','그 얘기 더 듣고 싶어요.','완전 공감돼요 :)','오늘따라 대화가 잘 통하네요.','그렇군요, 재밌네요.','저는 조금 다르게 생각해요, 왜냐면요…','좋은 하루 보내고 있어요?'];

let profile=load(KEY_P);            // {nick, interests[], noti:{msg,preview}}
let chats=load(KEY_C)||[];          // [{id,nick,interest,msgs,exp,friend,ended,ts}]
let blocks=load(KEY_B)||[];         // [nick]
let draftInterests=new Set(), draftMbti='', draftType='', editDraft=null, pinCtx=null;
let cur=null;                       // 현재 열린 chat
let ticker=null, matchTimer=null;
if(profile&&!profile.noti)profile.noti={msg:true,preview:true};
if(profile&&profile.penalty==null)profile.penalty=0;

function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY_P,JSON.stringify(profile));localStorage.setItem(KEY_C,JSON.stringify(chats));localStorage.setItem(KEY_B,JSON.stringify(blocks))}catch(e){}}
function uid(){return 'c'+(chats.reduce((m,c)=>Math.max(m,+c.id.slice(1)||0),0)+1)}

/* ---------- 화면 전환 ---------- */
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function tab(name){
  ['match','list','set'].forEach(n=>{
    document.getElementById('pg-'+n).classList.toggle('on',n===name);
    document.getElementById('nv-'+n).classList.toggle('on',n===name);
  });
  if(name==='match')renderMatch();
  if(name==='list')renderList();
  if(name==='set')renderSet();
}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1900)}

/* ---------- 온보딩 ---------- */
function startOnboarding(){draftInterests=new Set();draftMbti='';draftType='';buildInterests();updateIntState();document.getElementById('nickInput').value='';checkNick();go('s-nick');setTimeout(()=>document.getElementById('nickInput').focus(),300)}
function checkNick(){
  const v=document.getElementById('nickInput').value.trim();
  const ok=v.length>=2;
  document.getElementById('nickNext').disabled=!ok;
  document.getElementById('nickNote').textContent=ok?'좋아요.':'두 글자 이상 입력해주세요.';
}
function randomNick(){document.getElementById('nickInput').value=randomNickStr();checkNick()}
function buildInterests(){
  const w=document.getElementById('intWrap');w.innerHTML='';
  INTERESTS.forEach(x=>{
    const b=document.createElement('button');b.className='pick'+(draftInterests.has(x)?' on':'');b.textContent=x;
    b.onclick=()=>{draftInterests.has(x)?draftInterests.delete(x):draftInterests.add(x);buildInterests();updateIntState()};
    w.appendChild(b);
  });
}
function updateIntState(){
  const n=draftInterests.size;
  document.getElementById('intDone').disabled=n<1;
  document.getElementById('intCount').textContent=n<1?'한 개 이상 골라주세요.':n+'개 선택했어요.';
}
function openAbout(){buildAbout();go('s-about')}
function buildAbout(){
  const mw=document.getElementById('obMbti');mw.innerHTML='';
  MBTIS.forEach(x=>{const b=document.createElement('button');b.className='pick'+(draftMbti===x?' on':'');b.textContent=x;b.onclick=()=>{draftMbti=draftMbti===x?'':x;buildAbout()};mw.appendChild(b)});
  const tw=document.getElementById('obType');tw.innerHTML='';
  CHATTYPES.forEach(x=>{const b=document.createElement('button');b.className='pick'+(draftType===x?' on':'');b.textContent=x;b.onclick=()=>{draftType=draftType===x?'':x;buildAbout()};tw.appendChild(b)});
}
function finishOnboarding(){
  profile={nick:document.getElementById('nickInput').value.trim(),interests:[...draftInterests],mbti:draftMbti,chatType:draftType,noti:{msg:true,preview:true},penalty:0,matchLock:0};
  save();go('s-main');tab('match');
}

/* ---------- 매칭 탭 ---------- */
function activeChats(){return chats.filter(c=>!c.ended)}
function renderMatch(){
  const n=activeChats().length;
  document.getElementById('pg-match').innerHTML=`
    <div class="center pad">
      <h1 class="h-hero">새로운 사람과<br>대화해요</h1>
      <p class="dim body" style="margin-top:var(--s4)">관심사가 통하는 익명의 누군가와<br>지금 연결돼요.</p>
    </div>
    <div class="pad">
      <button class="cta" onclick="startMatch()">매칭 시작</button>
      <p class="dim tiny" style="text-align:center;margin-top:var(--s2)">진행 중인 대화 ${n}개</p>
    </div>`;
}
function startMatch(){
  if(profile.matchLock&&Date.now()<profile.matchLock){toast('패널티로 매칭이 제한됐어요 · 남은 '+remain(profile.matchLock));return}
  go('s-matching');matchTimer=setTimeout(doMatch,1800);
}
function addPenalty(){
  profile.penalty=(profile.penalty||0)+1;
  if(profile.penalty>=3){profile.penalty=0;profile.matchLock=Date.now()+DAY;save();toast('패널티 3점 · 24시간 매칭 제한')}
  else{save();toast('패널티 '+profile.penalty+'점이 부여됐어요')}
}
function cancelMatch(){clearTimeout(matchTimer);go('s-main')}
function doMatch(){
  let nick=randomNickStr(),t=0;while(blocks.includes(nick)&&t++<12)nick=randomNickStr();
  const shared=profile.interests[Math.floor(Math.random()*profile.interests.length)]||INTERESTS[0];
  const chat={id:uid(),nick,interest:shared,exp:Date.now()+DAY,friend:false,ended:false,ts:Date.now(),
    msgs:[{s:'sys',t:`매칭됐어요 · 관심사 ‘${shared}’가 통해요`},
          {s:'them',t:GREET[Math.floor(Math.random()*GREET.length)]}]};
  chats.unshift(chat);save();openChat(chat)
}

/* ---------- 대화 목록 ---------- */
function renderList(){
  const el=document.getElementById('pg-list');
  let h=`<div class="top"><div class="t">대화</div></div><div class="grow pad" style="padding-top:0">`;
  if(chats.length===0){
    h+=`<div class="center" style="min-height:60vh"><p class="dim body">아직 대화가 없어요.<br>매칭을 시작해보세요.</p></div>`;
  }else{
    chats.forEach((c,i)=>{
      const last=[...c.msgs].reverse().find(m=>m.s!=='sys');
      h+=`<button class="row" onclick="openChatById('${c.id}')">
        <div style="flex:1;min-width:0">
          <div class="nm">${esc(c.nick)}</div>
          <div class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last?esc(last.t):''}</div>
        </div>
        <div class="meta" style="text-align:right;white-space:nowrap">${statusLabel(c)}</div>
      </button>`;
    });
  }
  h+=`</div>`;el.innerHTML=h;
}
function statusLabel(c){
  const ph=phaseOf(c);
  if(ph==='ended')return '종료됨';
  if(ph==='friend')return '친구 · 무제한';
  if(ph==='decide')return '연장 결정 중';
  return remain(c.exp);
}

/* ---------- 설정 탭 (메뉴) ---------- */
function renderSet(){
  const friends=chats.filter(c=>c.friend&&!c.ended).length;
  const pen=profile.penalty||0, locked=profile.matchLock&&Date.now()<profile.matchLock;
  document.getElementById('pg-set').innerHTML=`
    <div class="top"><div class="t">설정</div></div>
    <div class="grow pad" style="padding-top:0">
      <div style="padding:var(--s5) 0 var(--s4)">
        <div class="mlabel">패널티</div>
        <div style="font-size:24px;font-weight:800;margin-top:2px">${pen}<span class="dim" style="font-size:16px;font-weight:500"> / 3</span></div>
        ${locked?`<div class="small" style="color:var(--danger);margin-top:6px">매칭 제한 중 · 남은 시간 ${remain(profile.matchLock)}</div>`:`<div class="dim small" style="margin-top:6px">대화를 그냥 나가면 1점 · 3점이면 24시간 매칭이 제한돼요</div>`}
      </div>
      <div class="mgroup" style="margin-top:var(--s4)">
        <button class="mrow" onclick="openSub('me')">내 정보<span class="dim" style="margin-left:8px">${esc(profile.nick)}</span><span class="arr">›</span></button>
        <button class="mrow" onclick="openSub('noti')">알림<span class="dim" style="margin-left:8px">${profile.noti.msg?'켜짐':'꺼짐'}</span><span class="arr">›</span></button>
        <button class="mrow" onclick="openSub('lock')">잠금<span class="dim" style="margin-left:8px">${profile.pin?'사용 중':'꺼짐'}</span><span class="arr">›</span></button>
        <button class="mrow" onclick="openSub('friends')">친구 목록<span class="dim" style="margin-left:8px">${friends}</span><span class="arr">›</span></button>
        <button class="mrow" onclick="openSub('blocks')">차단 목록<span class="dim" style="margin-left:8px">${blocks.length}</span><span class="arr">›</span></button>
        <button class="mrow" style="border-bottom:0" onclick="openSub('terms')">이용약관 · 개인정보<span class="arr">›</span></button>
      </div>
      <div class="mgroup">
        <button class="mrow" onclick="logout()">로그아웃</button>
        <button class="mrow danger" onclick="wipe()">계정 삭제<span class="dim" style="margin-left:8px">· 모든 정보 삭제</span></button>
      </div>
      <p class="dim tiny" style="text-align:center;margin-top:var(--s6)">Veil · 프로토타입</p>
    </div>`;
}
function logout(){go('s-intro')}
function wipe(){
  if(profile.pin){openPin({title:'계정 삭제',sub:'PIN을 입력하면 모든 정보가 삭제돼요',allowCancel:true,onDone:v=>{if(v!==profile.pin)return pinError('PIN이 일치하지 않아요');doWipe()}});}
  else{if(confirm('닉네임·대화가 모두 삭제되고 되돌릴 수 없어요. 삭제할까요?'))doWipe()}
}
function doWipe(){[KEY_P,KEY_C,KEY_B].forEach(k=>localStorage.removeItem(k));profile=null;chats=[];blocks=[];go('s-intro')}

/* ---------- PIN 잠금 ---------- */
function openPin(o){
  pinCtx=Object.assign({digits:''},o);
  document.getElementById('pinTitle').textContent=o.title;
  document.getElementById('pinSub').textContent=o.sub||'';
  document.getElementById('pinErr').textContent='';
  document.getElementById('pinBack').style.visibility=o.allowCancel?'visible':'hidden';
  document.getElementById('keypad').innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫']
    .map(n=>n===''?'<button class="empty"></button>':`<button onclick="pinKey('${n}')">${n}</button>`).join('');
  renderPin();go('s-pin');
}
function renderPin(){const d=pinCtx.digits.length;document.getElementById('pinDots').innerHTML=[0,1,2,3].map(i=>`<div class="pdot${i<d?' on':''}"></div>`).join('')}
function pinKey(n){
  if(n==='⌫'){pinCtx.digits=pinCtx.digits.slice(0,-1);document.getElementById('pinErr').textContent='';renderPin();return}
  if(pinCtx.digits.length>=4)return;
  pinCtx.digits+=n;document.getElementById('pinErr').textContent='';renderPin();
  if(pinCtx.digits.length===4){const v=pinCtx.digits;setTimeout(()=>pinCtx.onDone(v),130)}
}
function pinError(msg){pinCtx.digits='';document.getElementById('pinErr').textContent=msg;renderPin()}
function pinCancel(){if(pinCtx&&pinCtx.allowCancel){tab('set');go('s-main')}}
function lockApp(){openPin({title:'앱 잠금',sub:'PIN 4자리를 입력하세요',allowCancel:false,onDone:v=>{if(v===profile.pin){go('s-main');tab('match')}else pinError('PIN이 일치하지 않아요')}})}
function lockNow(){lockApp()}
function startSetPin(){openPin({title:'PIN 설정',sub:'새 PIN 4자리를 입력하세요',allowCancel:true,onDone:first=>{
  openPin({title:'PIN 확인',sub:'다시 한 번 입력하세요',allowCancel:true,onDone:second=>{
    if(second===first){profile.pin=first;save();toast('앱 잠금을 설정했어요');tab('set');go('s-main')}else pinError('PIN이 일치하지 않아요');
  }});
}})}
function startChangePin(){openPin({title:'현재 PIN',sub:'현재 PIN을 입력하세요',allowCancel:true,onDone:v=>{if(v!==profile.pin)return pinError('PIN이 일치하지 않아요');startSetPin()}})}
function disablePin(){openPin({title:'잠금 해제',sub:'현재 PIN을 입력하세요',allowCancel:true,onDone:v=>{if(v!==profile.pin)return pinError('PIN이 일치하지 않아요');profile.pin=null;save();toast('앱 잠금을 해제했어요');tab('set');go('s-main')}})}
function subLock(){
  const on=!!profile.pin;
  document.getElementById('subBody').innerHTML=`
    <div style="margin-top:var(--s5)">
      <div class="h-q">${on?'앱 잠금 사용 중':'앱 잠금 꺼짐'}</div>
      <p class="dim small" style="margin-top:var(--s2)">${on?'앱을 열 때 PIN 4자리를 입력해야 해요.':'PIN 4자리로 이 앱을 잠글 수 있어요.'}</p>
      <div class="mgroup" style="margin-top:var(--s5)">
        ${on?`<button class="mrow" onclick="lockNow()">지금 잠그기</button>
          <button class="mrow" onclick="startChangePin()">PIN 변경</button>
          <button class="mrow danger" onclick="disablePin()">잠금 해제</button>`
        :`<button class="mrow" onclick="startSetPin()">잠금 설정 · PIN 만들기</button>`}
      </div>
    </div>`;
}

/* ---------- 설정 하위 화면 ---------- */
function openSub(key){
  const T={me:'내 정보',noti:'알림',lock:'잠금',friends:'친구 목록',blocks:'차단 목록',terms:'이용약관 · 개인정보'}[key];
  document.getElementById('subTitle').textContent=T;
  if(key==='me')editDraft={nick:profile.nick,interests:[...profile.interests],mbti:profile.mbti||'',chatType:profile.chatType||''};
  ({me:subMe,noti:subNoti,lock:subLock,friends:subFriends,blocks:subBlocks,terms:subTerms})[key]();
  go('s-sub');
}
function editLocked(){return profile.editLockUntil&&Date.now()<profile.editLockUntil}
function daysLeft(ts){const ms=ts-Date.now();return ms>=DAY?Math.ceil(ms/DAY)+'일':Math.max(1,Math.ceil(ms/3600000))+'시간'}
function subMe(){
  const locked=editLocked(), el=document.getElementById('subBody');
  el.innerHTML=`
    <div class="mlabel" style="margin-top:var(--s4)">닉네임</div>
    <input id="setNick" class="field" maxlength="20" value="${esc(editDraft.nick)}" ${locked?'readonly':''} oninput="editDraft.nick=this.value">
    ${locked?'':`<button class="link" style="margin-top:var(--s3)" onclick="randomSetNick()">랜덤 만들기</button>`}
    <div class="mlabel" style="margin-top:var(--s6)">관심사</div>
    <div id="subInt" class="wrap" style="margin-top:var(--s3)"></div>
    <div class="mlabel" style="margin-top:var(--s6)">MBTI</div>
    <div id="subMbti" class="wrap" style="margin-top:var(--s3)"></div>
    <div class="mlabel" style="margin-top:var(--s6)">채팅 유형</div>
    <div id="subType" class="wrap" style="margin-top:var(--s3)"></div>
    ${locked
      ? `<p class="dim small" style="margin-top:var(--s6)">프로필은 마지막 수정 후 7일간 변경할 수 없어요.<br>약 ${daysLeft(profile.editLockUntil)} 뒤에 다시 바꿀 수 있어요.</p>`
      : `<p class="dim small" style="margin-top:var(--s6)">저장하면 프로필(닉네임·관심사·MBTI·채팅 유형)은 <b style="color:var(--ink)">7일 후에</b> 다시 변경할 수 있어요. 신중하게 확인해주세요.</p>
         <button class="cta" style="margin-top:var(--s3)" onclick="saveMe()">저장하기</button>`}`;
  const chip=(host,items,sel,on,pick)=>{const w=document.getElementById(host);items.forEach(x=>{const b=document.createElement('button');b.className='pick'+(sel(x)?' on':'');b.textContent=x;if(locked)b.style.opacity='.55';else b.onclick=on(x);w.appendChild(b)})};
  chip('subInt',INTERESTS,x=>editDraft.interests.includes(x),x=>()=>{toggleDraftInt(x);subMe()});
  chip('subMbti',MBTIS,x=>editDraft.mbti===x,x=>()=>{editDraft.mbti=editDraft.mbti===x?'':x;subMe()});
  chip('subType',CHATTYPES,x=>editDraft.chatType===x,x=>()=>{editDraft.chatType=editDraft.chatType===x?'':x;subMe()});
}
function toggleDraftInt(x){const i=editDraft.interests.indexOf(x);if(i>=0){if(editDraft.interests.length>1)editDraft.interests.splice(i,1);else toast('관심사는 최소 1개가 필요해요')}else editDraft.interests.push(x)}
function randomSetNick(){editDraft.nick=randomNickStr();const el=document.getElementById('setNick');if(el)el.value=editDraft.nick;toast('닉네임: '+editDraft.nick)}
function saveMe(){
  const nick=(editDraft.nick||'').trim();
  if(nick.length<2)return toast('닉네임은 두 글자 이상이어야 해요');
  if(editDraft.interests.length<1)return toast('관심사를 하나 이상 선택해주세요');
  if(!confirm('저장하면 7일 동안 프로필을 변경할 수 없어요.\n저장할까요?'))return;
  profile.nick=nick;profile.interests=[...editDraft.interests];profile.mbti=editDraft.mbti;profile.chatType=editDraft.chatType;
  profile.editLockUntil=Date.now()+7*DAY;save();
  toast('저장했어요');tab('set');go('s-main');
}
function subNoti(){
  document.getElementById('subBody').innerHTML=`
    <div class="mgroup" style="margin-top:var(--s2)">
      <button class="mrow" onclick="toggleNoti('msg')">새 메시지 알림<span class="arr" style="color:var(--ink);font-weight:700">${profile.noti.msg?'켜짐':'꺼짐'}</span></button>
      <button class="mrow" onclick="toggleNoti('preview')">알림 미리보기<span class="dim arr">${profile.noti.msg?'':'· 알림 꺼짐 '}</span><span style="color:var(--ink);font-weight:700;margin-left:8px">${profile.noti.msg&&profile.noti.preview?'켜짐':'꺼짐'}</span></button>
    </div>
    <p class="dim small" style="margin-top:var(--s4)">미리보기를 끄면 알림에 상대 이름만 표시되고 내용은 가려져요.</p>`;
}
function toggleNoti(k){
  if(k==='preview'&&!profile.noti.msg)return toast('먼저 새 메시지 알림을 켜주세요');
  profile.noti[k]=!profile.noti[k];save();subNoti();
}
function subFriends(){
  const fs=chats.filter(c=>c.friend&&!c.ended);
  const body=document.getElementById('subBody');
  if(fs.length===0){body.innerHTML=`<div class="center" style="min-height:50vh"><p class="dim body">아직 친구가 없어요.<br>대화 중 ‘친구 추가’로 만들 수 있어요.</p></div>`;return}
  body.innerHTML=`<div style="margin-top:var(--s3)">`+fs.map(c=>`<div class="row">
    <button style="flex:1;text-align:left;background:none;padding:0" onclick="openChatById('${c.id}')"><div class="nm">${esc(c.nick)}</div><div class="meta">친구 · 무제한</div></button>
    <button class="link" onclick="askBlock('${c.id}')">차단</button>
  </div>`).join('')+`</div>`;
}
function askBlock(id){
  const c=chats.find(x=>x.id===id);if(!c)return;
  if(confirm(c.nick+'님을 차단하시겠습니까?\n친구가 해제되고 대화가 종료돼요.')){
    if(!blocks.includes(c.nick))blocks.push(c.nick);
    c.friend=false;c.ended=true;c.msgs.push({s:'sys',t:'상대를 차단했어요'});
    save();subFriends();toast('차단했어요');
  }
}
function subBlocks(){
  let h='';
  if(blocks.length===0)h=`<div class="center" style="min-height:50vh"><p class="dim body">차단한 사용자가 없어요.</p></div>`;
  else h=blocks.map((n,i)=>`<div class="row"><div class="nm" style="flex:1">${esc(n)}</div><button class="link" onclick="unblock(${i})">차단 해제</button></div>`).join('');
  document.getElementById('subBody').innerHTML=`<div style="margin-top:var(--s3)">${h}</div>`;
}
function unblock(i){blocks.splice(i,1);save();subBlocks();toast('차단을 해제했어요')}
function subTerms(){
  document.getElementById('subBody').innerHTML=`
    <div class="body" style="margin-top:var(--s4);color:var(--dim)">
      <p><b style="color:var(--ink)">이용약관</b><br>Veil은 익명 텍스트 대화 서비스입니다. 사진·연락처 등 개인 식별 정보를 요구하지 않으며, 타인을 존중하는 대화를 원칙으로 합니다.</p>
      <p style="margin-top:var(--s4)"><b style="color:var(--ink)">개인정보 처리방침</b><br>닉네임·관심사·대화 내용은 이 기기에만 저장되며(프로토타입) 외부로 전송되지 않습니다. 계정 삭제 시 모두 지워집니다.</p>
      <p class="tiny" style="margin-top:var(--s5)">본 화면은 프로토타입 예시 문구입니다.</p>
    </div>`;
}

/* ---------- 채팅방 ---------- */
function phaseOf(c){
  if(c.ended)return 'ended';
  if(c.friend)return 'friend';
  if(c.exp&&Date.now()>=c.exp)return 'decide';   // 24시간 종료 → 연장 결정 단계
  return 'active';
}
function openChatById(id){const c=chats.find(x=>x.id===id);if(c)openChat(c)}
function openChat(c){
  cur=c;
  document.getElementById('chatNick').textContent=c.nick;
  document.getElementById('chatInput').value='';toggleSend();
  renderMsgs();refreshChat();
  clearInterval(ticker);ticker=setInterval(refreshChat,1000);
  go('s-chat');
}
function renderMsgs(){
  const el=document.getElementById('chatMsgs');
  el.innerHTML=cur.msgs.map(m=>`<div class="msg ${m.s}">${esc(m.t)}</div>`).join('');
  el.scrollTop=el.scrollHeight;
}
function remain(exp){
  let s=Math.max(0,Math.floor((exp-Date.now())/1000));
  const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function timerText(c){
  const ph=phaseOf(c);
  if(ph==='friend')return '친구 · 시간제한 없음';
  if(ph==='ended')return '종료된 대화예요';
  if(ph==='decide')return '24시간이 끝났어요 · 결정 '+remain(c.decideBy);
  return '남은 시간 '+remain(c.exp);
}
/* 매초 호출: 상태 전이 + 화면 갱신 */
function refreshChat(){
  if(!cur)return;
  const ph=phaseOf(cur);
  if(ph==='decide'&&!cur.decidePhase){       // 결정 단계 최초 진입
    cur.decidePhase=true;cur.decideBy=cur.exp+GRACE;
    cur.msgs.push({s:'sys',t:'24시간이 끝났어요 · 이어가려면 두 분 모두 연장을 선택해야 해요'});
    save();renderMsgs();
  }
  if(ph==='decide'&&cur.decideBy&&Date.now()>cur.decideBy){endChat('grace');return}
  document.getElementById('chatTimer').textContent=timerText(cur);
  const comp=document.getElementById('composer'), dec=document.getElementById('chatDecide');
  if(ph==='decide'){comp.style.display='none';dec.style.display='block';renderDecide()}
  else if(ph==='ended'){comp.style.display='none';dec.style.display='none'}
  else{comp.style.display='flex';dec.style.display='none'}
}
function renderDecide(){
  const dec=document.getElementById('chatDecide');
  const ext=cur.ext||0;
  if(cur.friendReq){
    dec.innerHTML=`<div class="dtxt dim">친구 신청을 보냈어요 · 상대의 수락을 기다리는 중…</div>`;
  }else if(cur.myExtend===true){
    dec.innerHTML=`<div class="dtxt dim">연장을 신청했어요 · 상대의 응답을 기다리는 중…</div>`;
  }else if(ext>=3){
    dec.innerHTML=`<div class="dtxt">세 번 연장했어요 · 이제 친구가 될 수 있어요 <span class="dim">· 결정 ${remain(cur.decideBy)}</span></div>
      <div class="drow"><button class="dbtn" onclick="befriend()">친구 추가</button><button class="dbtn no" onclick="chooseExtend(false)">종료하기</button></div>`;
  }else{
    dec.innerHTML=`<div class="dtxt">대화를 더 이어갈까요? <span class="dim">· ${ext}/3 연장 · 결정 ${remain(cur.decideBy)}</span></div>
      <div class="drow"><button class="dbtn" onclick="chooseExtend(true)">연장하기</button><button class="dbtn no" onclick="chooseExtend(false)">종료하기</button></div>`;
  }
}
/* 연장 결정 — 양쪽 모두 동의해야 이어짐 */
function chooseExtend(yes){
  cur.myExtend=yes;save();
  if(!yes){endChat('declineSelf');return}
  renderDecide();
  const id=cur.id;
  setTimeout(()=>partnerDecision(id),1400+Math.random()*1600);
}
function partnerDecision(id){
  const c=chats.find(x=>x.id===id);
  if(!c||c.ended||phaseOf(c)!=='decide'||c.myExtend!==true)return;
  if(true){                                  // AI 목업: 상대(AI)는 항상 연장에 동의
    c.exp=Date.now()+DAY;c.decidePhase=false;c.decideBy=null;c.myExtend=null;c.ext=(c.ext||0)+1;
    c.msgs.push({s:'sys',t:'두 분 모두 동의해 24시간이 연장됐어요'});save();
    if(cur&&cur.id===c.id){renderMsgs();refreshChat();toast('연장됐어요')}
  }else{                                       // 상대는 원하지 않음
    c.ended=true;c.msgs.push({s:'sys',t:'상대가 연장을 원하지 않아 대화가 종료됐어요'});save();
    if(cur&&cur.id===c.id){renderMsgs();refreshChat()}
  }
}
function onKey(e){if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();sendMsg()}}
function toggleSend(){document.getElementById('sendBtn').disabled=!document.getElementById('chatInput').value.trim()}
function sendMsg(){
  const ph=phaseOf(cur);if(ph!=='active'&&ph!=='friend')return;
  const i=document.getElementById('chatInput');const t=i.value.trim();if(!t)return;
  cur.msgs.push({s:'me',t});i.value='';toggleSend();save();renderMsgs();
  setTimeout(()=>{const p=cur&&phaseOf(cur);if(p==='active'||p==='friend'){cur.msgs.push({s:'them',t:REPLY[Math.floor(Math.random()*REPLY.length)]});save();renderMsgs()}},900);
}

/* ---------- 관리 시트 ---------- */
function openMenu(){
  document.getElementById('sheetName').textContent=cur.nick;
  document.getElementById('sheetSub').textContent=timerText(cur);
  document.getElementById('optFriend').style.display=(phaseOf(cur)==='active'&&!cur.friendReq&&(cur.ext||0)>=3)?'block':'none';
  document.getElementById('sheet').classList.add('on');
}
function closeMenu(){document.getElementById('sheet').classList.remove('on')}
/* 친구 추가 — 양쪽 모두 동의해야 성립 (신청 → 상대 수락) */
function befriend(){
  cur.friendReq=true;cur.msgs.push({s:'sys',t:'친구 신청을 보냈어요 · 상대의 수락을 기다려요'});
  save();renderMsgs();refreshChat();closeMenu();toast('친구 신청을 보냈어요');
  const id=cur.id;setTimeout(()=>friendDecision(id),1400+Math.random()*1600);
}
function friendDecision(id){
  const c=chats.find(x=>x.id===id);
  if(!c||c.ended||c.friend||!c.friendReq)return;
  c.friendReq=false;
  if(true){                                  // AI 목업: 상대(AI)는 항상 친구 신청을 수락
    c.friend=true;c.exp=null;c.decidePhase=false;c.myExtend=null;
    c.msgs.push({s:'sys',t:'친구가 됐어요 · 이제 시간제한 없이 대화해요'});
  }else{                                       // 상대가 거절 → 대화는 그대로 이어짐
    c.msgs.push({s:'sys',t:'상대가 친구 신청을 받지 않았어요'});
  }
  save();
  if(cur&&cur.id===c.id){renderMsgs();refreshChat();if(c.friend)toast('친구가 됐어요')}
}
function leaveChat(){closeMenu();if(confirm('그냥 나가면 패널티 1점이 부여돼요.\n패널티가 3점이 되면 24시간 동안 매칭할 수 없어요.\n나가시겠어요?')){addPenalty();endChat('leave');tab('list');go('s-main')}}
function blockAndLeave(){closeMenu();if(confirm(cur.nick+'님을 차단할까요? 다시 매칭되지 않아요.')){if(!blocks.includes(cur.nick))blocks.push(cur.nick);endChat('leave');tab('list');go('s-main');toast('차단했어요')}}
function endChat(reason){
  cur.ended=true;cur.friend=false;
  const M={grace:'시간 내에 연장하지 않아 대화가 종료됐어요',declineSelf:'연장하지 않아 대화가 종료됐어요',leave:'대화를 나갔어요'};
  cur.msgs.push({s:'sys',t:M[reason]||'대화가 종료됐어요'});
  save();clearInterval(ticker);
  if(document.getElementById('s-chat').classList.contains('active')){renderMsgs();refreshChat()}
}

/* ---------- 유틸 ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ---------- 부팅 ---------- */
(function boot(){
  buildInterests();updateIntState();
  if(profile&&profile.nick){ if(profile.pin){lockApp()}else{go('s-main');tab('match')} }else{go('s-intro')}
})();
</script>

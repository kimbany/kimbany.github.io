<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E0C0B" />
  <title>Taste OS — 당신은 계속 변하고 있습니다</title>
  <meta name="description" content="취향은 단순한 선호가 아니라, 당신이라는 사람의 분위기입니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&family=Noto+Serif+KR:wght@300;400&display=swap" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- Light orbs (z-1) -->
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>
  <div class="orb orb-4" aria-hidden="true"></div>

  <!-- Dust field (z-3, filled by JS) -->
  <div class="dust-field" aria-hidden="true"></div>

  <!-- Sigil (z-50) -->
  <div class="sigil" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
      <path d="M12 3.5 A 8.5 8.5 0 1 0 20.4 11.2" />
    </svg>
  </div>

  <!-- Vignette (z-10) -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- Main hero (z-5) -->
  <main class="hero">
    <div class="hero-inner">

      <h1 class="headline" data-reveal="climax">
        당신은 계속<br />
        변하고 있습니다.
      </h1>

      <hr class="hairline" data-reveal="hairline" />

      <p class="sub-headline" data-reveal="sub">
        취향은 단순한 선호가 아니라,<br />
        당신이라는 사람의 분위기입니다.
      </p>

      <button type="button" class="beacon" data-reveal="beacon" aria-label="나의 분위기 탐색하기">
        <span class="dash">───</span>
        <span class="beacon-label">나의 분위기 탐색하기</span>
        <span class="dash">───</span>
      </button>

      <p class="wordmark" data-reveal="wordmark">Taste OS</p>

    </div>
  </main>

  <!-- Grain (z-100) -->
  <div class="grain" aria-hidden="true"></div>

  <script src="./script.js"></script>
</body>
</html>

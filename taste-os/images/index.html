<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E0C0B" />
  <title>Taste OS — 마음에 머문 장면들</title>
  <meta name="description" content="당신이 오래 바라본 이미지들 속에는 당신만의 분위기가 숨어 있습니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&family=Noto+Serif+KR:wght@300;400&display=swap" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="atmo-cold">

  <!-- Ambient layers -->
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>
  <div class="orb orb-4" aria-hidden="true"></div>

  <div class="dust-field" aria-hidden="true"></div>

  <div class="sigil" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
      <path d="M12 3.5 A 8.5 8.5 0 1 0 20.4 11.2" />
    </svg>
  </div>

  <!-- Hidden file input -->
  <input type="file" class="file-input" accept="image/*" multiple />

  <!-- ============================================================
       STATE A — INTRO
       ============================================================ -->
  <main class="intro" data-phase="active">
    <div class="intro-inner">

      <h1 class="intro-headline" data-reveal="headline">
        괜히 자꾸 저장하게 되는<br />
        장면들이 있나요?
      </h1>

      <hr class="hairline" data-reveal="hairline" />

      <div class="intro-sub">
        <p class="sub-line" data-reveal="sub-1">당신이 오래 바라본 이미지들 속에는</p>
        <p class="sub-line" data-reveal="sub-2">당신만의 분위기가 숨어 있습니다.</p>
      </div>

      <button class="beacon" type="button" data-reveal="cta" data-action="start">
        <span class="dash">────</span>
        <span class="beacon-label">시작하기</span>
        <span class="dash">────</span>
      </button>

    </div>
  </main>

  <!-- ============================================================
       STATE B — CANVAS
       ============================================================ -->
  <main class="canvas-state" data-phase="hidden">

    <header class="canvas-header">
      <p class="canvas-prompt">괜히 자꾸 저장하게 되는 장면들이 있나요?</p>
      <button class="add-button" type="button" data-action="add">
        <span>+</span>
        <span class="add-label">두기</span>
      </button>
    </header>

    <div class="canvas-stage">
      <p class="empty-hint" data-empty-hint>
        마음에 머문 장면들을 두어보세요.<br />
        <span class="mist sm">어디든 드래그하거나, 클립보드에서 붙여넣거나, +를 눌러요.</span>
      </p>
      <div class="image-layer" data-image-layer>
        <!-- Filled by JS -->
      </div>
    </div>

    <footer class="canvas-footer">
      <p class="counter" data-counter></p>
      <button class="beacon ceremonial cta-forward" type="button" data-action="forward" data-state="hidden">
        <span class="dash">────</span>
        <span class="beacon-label">다음 분위기로 넘어가기</span>
        <span class="dash">────</span>
      </button>
    </footer>

  </main>

  <!-- Drag indicator (full page warm glow) -->
  <div class="drag-glow" aria-hidden="true"></div>

  <!-- ============================================================
       STATE C — FORWARD THRESHOLD BEAT
       ============================================================ -->
  <div class="forward-beat" data-phase="hidden" aria-hidden="true">
    <p class="beat-line" data-line="0">여기까지 잘 두었어요.</p>
    <p class="beat-line" data-line="1">이제, 다음으로.</p>
  </div>

  <!-- Grain (always on top) -->
  <div class="grain" aria-hidden="true"></div>

  <script src="./script.js"></script>
</body>
</html>

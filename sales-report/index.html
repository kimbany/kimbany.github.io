<!--

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

    <button id="badge-unmatched" class="hidden text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100">

<!-- ===== 토스트 ===== -->
<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl text-sm font-semibold shadow-lg"></div>

<script>
/* ============================================================================
 * 매출 통합 대시보드 — Phase 1~2 (개발 뼈대 + 셋팅 CRUD)
 *
 *  - 이 파일은 단일 HTML 로 동작합니다.
 *  - 데이터 계층(DB)은 Firestore 와 동일한 사고방식(컬렉션/문서ID)으로 설계했고,
 *    지금은 localStorage 로 동작하는 "로컬 모드" 어댑터를 씁니다.
 *    나중에 firebaseConfig 를 채우면 같은 인터페이스로 Firestore 로 교체됩니다.
 * ==========================================================================*/
(function () {
'use strict';

/* ---------------------------------------------------------------- 공통 유틸 */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (tag, attrs={}, html) => {
  const n = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') n.className = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  }
  if (html != null) n.innerHTML = html;
  return n;
};
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const comma = (n) => (Math.round(Number(n)||0)).toLocaleString('ko-KR');
const won   = (n) => comma(n) + '원';
// 짧은 랜덤 ID (Firestore auto-id 대용). prefix 로 컬렉션 구분.
let _seq = 0;
function genId(prefix) {
  _seq = (_seq + 1) % 100000;
  const rand = Math.floor(performance.now()*1000).toString(36) + _seq.toString(36);
  return (prefix ? prefix + '_' : '') + rand;
}

function toast(msg, type='ok') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl text-sm font-semibold shadow-lg ' +
    (type==='err' ? 'bg-rose-600 text-white' : type==='warn' ? 'bg-amber-500 text-white' : 'bg-slate-800 text-white');
  t.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hidden'), 2400);
}

/* ------------------------------------------------------- 문자열 정규화(6-2) */
const NOISE = ['정품','무료배송','당일발송','산지직송','특가','본사직영','best','신상','히트','1+1','사은품증정'];
function normalizeName(s) {
  let x = String(s||'').toLowerCase();
  x = x.replace(/\[[^\]]*\]/g, ' ').replace(/\([^)]*\)/g, ' ');   // 대괄호·소괄호 내용 제거
  NOISE.forEach(w => { x = x.split(w).join(' '); });
  x = x.replace(/킬로그램|킬로|kg/g, 'kg').replace(/그램/g, 'g');   // 단위 표기 통일
  x = x.replace(/[^\p{L}\p{N}]+/gu, '');                          // 공백·특수문자 제거
  return x;
}
/* ------------------------------------------------------- 옵션 숫자·단위(6-3) */
function extractSpec(s) {
  const m = String(s||'').match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|l|개입|개|입|과|봉|팩|미)/i);
  if (!m) return null;
  let unit = m[2].toLowerCase();
  if (unit === '개입' || unit === '개' || unit === '입' || unit === '과' || unit === '봉' || unit === '팩' || unit === '미') unit = 'ea';
  return { num: parseFloat(m[1]), unit };
}
function sameSpec(a, b) {
  if (!a && !b) return true;
  if (!a || !b) return false;
  return a.num === b.num && a.unit === b.unit;
}

/* ============================================================================
 * DB 어댑터 — localStorage 로컬 모드 (Firestore 호환 인터페이스)
 *   컬렉션: channels, brands, products, productItems, channelMappings,
 *           uploads, sales, dailyStats
 *   각 문서는 { id, ... } 형태. put 은 upsert, del 은 완전 삭제.
 *   ※ 상품/규격/채널은 삭제 대신 active:false 소프트 삭제를 권장(스펙 7).
 * ==========================================================================*/
const STORE_KEY = 'saleshub:v2';
const COLLECTIONS = ['channels','brands','products','productItems','channelMappings','uploads','sales','dailyStats'];

const LocalDB = (function () {
  let cache = null;
  function raw() {
    if (cache) return cache;
    try { cache = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch (e) { cache = {}; }
    COLLECTIONS.forEach(c => { if (!cache[c]) cache[c] = {}; });
    return cache;
  }
  function flush() { localStorage.setItem(STORE_KEY, JSON.stringify(cache)); }
  return {
    mode: 'local',
    list(coll)      { return Object.values(raw()[coll] || {}); },
    get(coll, id)   { return (raw()[coll] || {})[id] || null; },
    put(coll, doc)  {
      const db = raw();
      if (!doc.id) doc.id = genId(coll.slice(0,4));
      doc.updatedAt = Date.now();
      if (!db[coll][doc.id]) doc.createdAt = Date.now();
      db[coll][doc.id] = { ...db[coll][doc.id], ...doc };
      flush();
      return db[coll][doc.id];
    },
    del(coll, id)   { const db = raw(); delete db[coll][id]; flush(); },
    clearAll()      { cache = {}; COLLECTIONS.forEach(c => cache[c]={}); flush(); },
    exportAll()     { return JSON.stringify(raw(), null, 2); },
    importAll(json) {
      const obj = JSON.parse(json);
      cache = {};
      COLLECTIONS.forEach(c => { cache[c] = obj[c] || {}; });
      flush();
    }
  };
})();

// firebaseConfig 가 채워지면 여기서 FirestoreDB 로 교체 (Phase 후속).
const DB = LocalDB;
window.__DB = DB;   // 콘솔 디버깅용

/* ============================================================ 탭/서브탭 네비 */
let curTab = 'main', curSub = 'channel';

function goTab(name) {
  curTab = name;
  $$('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  $$('.tab-panel').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== name));
  if (name === 'settings') renderSub(curSub);
  else if (name === 'main') renderMain();
  else if (name === 'sales') renderSales();
  else if (name === 'upload') renderUpload();
}
window.goTab = goTab;

function renderSub(name) {
  curSub = name;
  $$('.subtab').forEach(b => b.classList.toggle('active', b.dataset.sub === name));
  $$('.sub-panel').forEach(p => p.classList.toggle('hidden', p.dataset.subPanel !== name));
  const map = { channel: renderChannels, brand: renderBrands, product: renderProducts, match: renderMatch, etc: renderEtc };
  (map[name] || (()=>{}))();
}

/* ============================================================ 모달 헬퍼 */
function openModal(html) {
  $('#modal-card').innerHTML = html;
  $('#modal').classList.remove('hidden');
}
function closeModal() { $('#modal').classList.add('hidden'); }
window.closeModal = closeModal;
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// 공통 폼 UI 조각
const F = {
  wrap: (title, bodyHtml, footHtml) => `
    <div class="p-5 border-b border-slate-100 flex items-center justify-between">
      <h3 class="font-bold">${esc(title)}</h3>
      <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
    </div>
    <div class="p-5 space-y-4 max-h-[65vh] overflow-y-auto">${bodyHtml}</div>
    <div class="p-4 border-t border-slate-100 flex justify-end gap-2">${footHtml}</div>`,
  text: (id, label, val='', ph='', extra='') => `
    <div><label class="block text-xs font-semibold text-slate-500 mb-1.5">${esc(label)}</label>
    <input id="${id}" ${extra} value="${esc(val)}" placeholder="${esc(ph)}"
      class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg"></div>`,
  num: (id, label, val='', ph='') => `
    <div><label class="block text-xs font-semibold text-slate-500 mb-1.5">${esc(label)}</label>
    <input id="${id}" type="number" value="${val===''?'':esc(val)}" placeholder="${esc(ph)}"
      class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg"></div>`,
  sel: (id, label, options, val='') => `
    <div><label class="block text-xs font-semibold text-slate-500 mb-1.5">${esc(label)}</label>
    <select id="${id}" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white">
      ${options.map(o => `<option value="${esc(o.v)}" ${o.v===val?'selected':''}>${esc(o.t)}</option>`).join('')}
    </select></div>`,
  toggle: (id, label, on=true) => `
    <label class="flex items-center justify-between cursor-pointer">
      <span class="text-xs font-semibold text-slate-500">${esc(label)}</span>
      <input id="${id}" type="checkbox" ${on?'checked':''} class="w-4 h-4 accent-brand"></label>`,
  btnPrimary: (label, onclick) => `<button onclick="${onclick}" class="px-4 py-2 text-sm font-semibold rounded-lg bg-brand text-white hover:bg-brand-dark">${esc(label)}</button>`,
  btnGhost: (label, onclick) => `<button onclick="${onclick}" class="px-4 py-2 text-sm font-semibold rounded-lg bg-white text-slate-500 border border-slate-200 hover:bg-slate-50">${esc(label)}</button>`,
};

// 공통: 빈 상태 카드
function emptyCard(icon, title, desc, btnLabel, btnOnclick) {
  return `<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center">
    <div class="text-3xl mb-2">${icon}</div>
    <h3 class="font-bold text-sm mb-1">${esc(title)}</h3>
    <p class="text-sm text-slate-500 mb-4">${desc}</p>
    ${btnLabel ? F.btnPrimary(btnLabel, btnOnclick) : ''}</div>`;
}
// 섹션 헤더(제목 + 추가버튼)
function sectionHead(title, sub, btnLabel, btnOnclick) {
  return `<div class="flex items-center justify-between mb-4 flex-wrap gap-2">
    <div><h2 class="font-bold">${esc(title)}</h2>${sub?`<p class="text-xs text-slate-400 mt-0.5">${esc(sub)}</p>`:''}</div>
    ${btnLabel ? `<button onclick="${btnOnclick}" class="px-3.5 py-2 text-sm font-semibold rounded-lg bg-brand text-white hover:bg-brand-dark">${esc(btnLabel)}</button>` : ''}
  </div>`;
}

/* ============================================================================
 * (a) 채널 관리
 * ==========================================================================*/
const DATE_BASIS = [
  { v:'orderDate', t:'주문일' }, { v:'payDate', t:'결제일' }, { v:'shipDate', t:'발송일' },
];
const COLMAP_FIELDS = [
  ['orderNo','주문번호'], ['orderDate','주문일(기준일)'], ['productCode','상품코드'], ['productName','상품명'],
  ['optionCode','옵션코드'], ['optionName','옵션명'], ['qty','수량'], ['amount','판매금액'], ['status','주문상태'],
];

function renderChannels() {
  const box = $('[data-sub-panel="channel"]');
  const list = DB.list('channels');
  let html = sectionHead('채널 관리', '쿠팡 · 스마트스토어 등 판매 채널과 엑셀 컬럼 매핑을 등록합니다.', '+ 채널 추가', 'openChannelForm()');

  if (!list.length) {
    html += emptyCard('🛒', '등록된 채널이 없습니다', '먼저 매출 엑셀을 내려받는 채널을 등록하세요.', '+ 채널 추가', 'openChannelForm()');
    box.innerHTML = html; return;
  }
  html += '<div class="grid gap-3">';
  list.forEach(ch => {
    const mapped = COLMAP_FIELDS.filter(([k]) => (ch.columnMap||{})[k]).length;
    const warnName = (!ch.hasProductCode || !ch.hasOptionCode);
    html += `<div class="bg-white rounded-2xl border border-slate-200 p-4">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="font-bold">${esc(ch.name)}</span>
        <span class="text-xs text-slate-400">${esc(ch.code||'-')}</span>
        ${ch.active===false ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-400">사용안함</span>' : '<span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-600">사용중</span>'}
        ${warnName ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-700">⚠ 이름 기반 매칭</span>' : ''}
        <div class="ml-auto flex gap-1.5">
          <button onclick="openChannelForm('${ch.id}')" class="text-xs font-semibold text-brand px-2 py-1 rounded hover:bg-brand-soft">수정</button>
          <button onclick="delChannel('${ch.id}')" class="text-xs font-semibold text-rose-500 px-2 py-1 rounded hover:bg-rose-50">삭제</button>
        </div>
      </div>
      <div class="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500">
        <span>기준일: <b class="text-slate-700">${esc((DATE_BASIS.find(d=>d.v===ch.dateBasis)||{}).t || '주문일')}</b></span>
        <span>컬럼 매핑: <b class="text-slate-700">${mapped}/9</b></span>
        <span>상품코드 ${ch.hasProductCode?'✅':'❌'} · 옵션코드 ${ch.hasOptionCode?'✅':'❌'}</span>
        <span>취소상태: ${(ch.cancelStatuses||[]).map(esc).join(', ')||'-'}</span>
      </div></div>`;
  });
  html += '</div>';
  box.innerHTML = html;
}

function openChannelForm(id) {
  const ch = id ? DB.get('channels', id) : { columnMap:{}, hasProductCode:true, hasOptionCode:true, active:true, dateBasis:'orderDate', cancelStatuses:[] };
  const cm = ch.columnMap || {};
  const body = `
    ${F.text('ch-name','채널명', ch.name||'', '예: 쿠팡')}

function saveChannel(id) {
  const name = $('#ch-name').value.trim();
  if (!name) { toast('채널명을 입력하세요','err'); return; }
  const columnMap = {};
  COLMAP_FIELDS.forEach(([k]) => { const v = $('#cm-'+k).value.trim(); if (v) columnMap[k] = v; });

}
window.saveChannel = saveChannel;

function delChannel(id) {
  const ch = DB.get('channels', id);
  const mapped = DB.list('channelMappings').filter(m => m.channelId === id).length;
  if (!confirm(`채널 "${ch?.name}" 을(를) 삭제할까요?` + (mapped ? `\n연결된 매칭 ${mapped}건도 함께 사라집니다.` : ''))) return;
  DB.list('channelMappings').filter(m => m.channelId === id).forEach(m => DB.del('channelMappings', m.id));

window.openBrandForm = openBrandForm;

function saveBrand(id) {

function delBrand(id) {

const UNIT_TYPES = [{v:'g',t:'g (무게)'},{v:'ml',t:'ml (부피)'},{v:'ea',t:'ea (개수)'}];

function renderProducts() {
  const box = $('[data-sub-panel="product"]');
  const brands = DB.list('brands').filter(b => b.active!==false);
  const products = DB.list('products');
  let html = sectionHead('상품 관리', '브랜드 › 상품 › 규격(집계 최소 단위) 2단계로 등록합니다.',
    brands.length ? '+ 상품 추가' : '', brands.length ? 'openProductForm()' : '');

  if (!brands.length) {
    html += emptyCard('📦', '먼저 브랜드가 필요합니다', '상품은 브랜드에 속합니다. 브랜드 관리에서 먼저 등록하세요.', '브랜드 관리로', "renderSub('brand')");
    box.innerHTML = html; return;
  }
  if (!products.length) {
    html += emptyCard('📦', '등록된 상품이 없습니다', '청송 꿀사과 같은 상품을 등록하고 그 아래 규격(1kg/3kg)을 추가하세요.', '+ 상품 추가', 'openProductForm()');
    box.innerHTML = html; return;
  }

  // 브랜드별 그룹핑
  html += '<div class="space-y-5">';
  brands.forEach(brand => {
    const prods = products.filter(p => p.brandId === brand.id);
    if (!prods.length) return;
    html += `<div><h3 class="text-xs font-bold text-slate-400 mb-2">${esc(brand.name)}</h3><div class="grid gap-3">`;
    prods.forEach(p => {
      const items = DB.list('productItems').filter(it => it.productId === p.id).sort((a,b)=>(a.unitValue||0)-(b.unitValue||0));
      html += `<div class="bg-white rounded-2xl border border-slate-200 overflow-hidden ${p.active===false?'opacity-60':''}">
        <div class="p-4 flex items-center gap-2 border-b border-slate-100">
          <span class="font-bold">${esc(p.name)}</span>
          ${p.active===false?'<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-400">사용안함</span>':''}
          <span class="text-xs text-slate-400">규격 ${items.length}개</span>
          <div class="ml-auto flex gap-1.5">
            <button onclick="openItemForm('${p.id}')" class="text-xs font-semibold text-brand px-2 py-1 rounded hover:bg-brand-soft">+ 규격</button>
            <button onclick="openProductForm('${p.id}')" class="text-xs font-semibold text-slate-500 px-2 py-1 rounded hover:bg-slate-100">수정</button>
            <button onclick="delProduct('${p.id}')" class="text-xs font-semibold text-rose-500 px-2 py-1 rounded hover:bg-rose-50">삭제</button>
          </div>
        </div>`;
      if (items.length) {
        html += '<table class="w-full text-sm"><tbody>';
        items.forEach(it => {
          html += `<tr class="border-b border-slate-50 ${it.active===false?'opacity-50':''}">
            <td class="px-4 py-2 font-semibold">${esc(it.spec)}</td>
            <td class="px-2 py-2 text-xs text-slate-400">${esc(it.sku||'-')}</td>
            <td class="px-2 py-2 text-xs text-slate-500 text-right">${it.unitValue?comma(it.unitValue)+esc(it.unitType||''):'-'}</td>
            <td class="px-2 py-2 text-right num">${it.price?won(it.price):'<span class="text-slate-300">-</span>'}</td>
            <td class="px-4 py-2 text-right whitespace-nowrap">
              <button onclick="openItemForm('${p.id}','${it.id}')" class="text-xs text-brand font-semibold mr-1">수정</button>
              <button onclick="delItem('${it.id}')" class="text-xs text-rose-400 font-semibold">삭제</button>
            </td></tr>`;
        });
        html += '</tbody></table>';
      } else {
        html += `<div class="px-4 py-3 text-xs text-slate-400">규격이 없습니다. <button onclick="openItemForm('${p.id}')" class="text-brand font-semibold">+ 규격 추가</button></div>`;
      }
      html += '</div>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  box.innerHTML = html;
}

function openProductForm(id) {
  const p = id ? DB.get('products', id) : { active:true };
  const brands = DB.list('brands').filter(b => b.active!==false);
  const body = `
    ${F.sel('pr-brand','브랜드', brands.map(b=>({v:b.id,t:b.name})), p.brandId||'')}
    ${F.text('pr-name','상품명', p.name||'', '예: 청송 꿀사과')}
    ${F.toggle('pr-active','사용 여부', p.active!==false)}
    <p class="text-[11px] text-slate-400">상품을 저장한 뒤 카드에서 규격(1kg/3kg 등)을 추가할 수 있습니다.</p>`;
  openModal(F.wrap(id?'상품 수정':'상품 추가', body, F.btnGhost('취소','closeModal()')+F.btnPrimary('저장',`saveProduct('${id||''}')`)));
}
window.openProductForm = openProductForm;

function saveProduct(id) {
  const brandId = $('#pr-brand').value;
  const name = $('#pr-name').value.trim();
  if (!brandId) { toast('브랜드를 선택하세요','err'); return; }
  if (!name) { toast('상품명을 입력하세요','err'); return; }
  DB.put('products', { id:id||undefined, brandId, name, active:$('#pr-active').checked });
  closeModal(); renderProducts(); toast('저장했습니다');
}
window.saveProduct = saveProduct;

function delProduct(id) {
  const p = DB.get('products', id);
  const items = DB.list('productItems').filter(it => it.productId === id);
  if (!confirm(`상품 "${p?.name}" 과(와) 규격 ${items.length}개를 삭제할까요?\n(과거 매출이 참조 중이면 "사용안함"을 권장)`)) return;
  items.forEach(it => DB.del('productItems', it.id));
  DB.del('products', id);
  renderProducts(); toast('삭제했습니다');
}
window.delProduct = delProduct;

function openItemForm(productId, itemId) {
  const it = itemId ? DB.get('productItems', itemId) : { active:true, unitType:'g' };
  const p = DB.get('products', productId);
  const body = `
    <p class="text-xs text-slate-400">상품 <b class="text-slate-600">${esc(p?.name||'')}</b> 의 규격</p>
    ${F.text('it-spec','규격명', it.spec||'', '예: 3kg / 12개입')}
    ${F.text('it-sku','SKU', it.sku||'', '예: MF-APPLE-3KG')}
    <div class="grid grid-cols-2 gap-3">
      ${F.sel('it-utype','단위 타입', UNIT_TYPES, it.unitType||'g')}
      ${F.num('it-uval','단위 값', it.unitValue!=null?it.unitValue:'', '예: 3000')}
    </div>
    ${F.num('it-price','정가(원)', it.price!=null?it.price:'', '예: 39000')}
    ${F.toggle('it-active','사용 여부', it.active!==false)}`;
  openModal(F.wrap(itemId?'규격 수정':'규격 추가', body, F.btnGhost('취소','closeModal()')+F.btnPrimary('저장',`saveItem('${productId}','${itemId||''}')`)));
}
window.openItemForm = openItemForm;

function saveItem(productId, itemId) {
  const spec = $('#it-spec').value.trim();
  if (!spec) { toast('규격명을 입력하세요','err'); return; }
  const p = DB.get('products', productId);
  DB.put('productItems', {
    id: itemId||undefined,
    productId, brandId: p?.brandId || '',
    spec,
    sku: $('#it-sku').value.trim(),
    unitType: $('#it-utype').value,
    unitValue: $('#it-uval').value!==''? Number($('#it-uval').value) : null,
    price: $('#it-price').value!==''? Number($('#it-price').value) : null,
    active: $('#it-active').checked,
  });
  closeModal(); renderProducts(); toast('저장했습니다');
}
window.saveItem = saveItem;

function delItem(id) {
  const it = DB.get('productItems', id);
  if (!confirm(`규격 "${it?.spec}" 을(를) 삭제할까요?`)) return;
  DB.del('productItems', id);
  renderProducts(); toast('삭제했습니다');
}
window.delItem = delItem;

function renderMatch() {
  const box = $('[data-sub-panel="match"]');
  const maps = DB.list('channelMappings');
  let html = sectionHead('매칭 관리', '채널 상품·옵션 ↔ 내 상품 규격 연결을 관리합니다. (트리 뷰·재매칭은 Phase 6)');

    html += emptyCard('🔗', '아직 매칭 데이터가 없습니다',
      '데이터 입력에서 채널 엑셀을 업로드하면 여기에 채널 상품↔내 규격 매핑이 쌓입니다.', '', '');
  } else {
    // 채널별 그룹으로 간단 리스트(읽기 전용 프리뷰)
    const channels = DB.list('channels');
    html += '<div class="space-y-4">';
    channels.forEach(ch => {
      const rows = maps.filter(m => m.channelId === ch.id);
      if (!rows.length) return;
      html += `<div class="bg-white rounded-2xl border border-slate-200 p-4">
        <h3 class="font-bold text-sm mb-2">${esc(ch.name)}</h3>
        <div class="space-y-1 text-xs">`;
      rows.forEach(m => {
        const it = DB.get('productItems', m.productItemId);
        const badge = m.status==='review' ? '<span class="text-amber-600">⚠ 이름변경</span>'
          : m.status==='ignored' ? '<span class="text-slate-400">무시됨</span>'
          : it ? '<span class="text-emerald-600">✅</span>' : '<span class="text-rose-500">❌ 미매칭</span>';
        html += `<div class="flex items-center gap-2 py-1 border-b border-slate-50">
          <span class="text-slate-400">${esc(m.channelProductCode||'')}/${esc(m.channelOptionCode||'')}</span>
          <span>${esc(m.snapOptionName||m.lastSeenOptionName||'')}</span>
          <span class="ml-auto">${it?esc(it.spec):''} ${badge}</span></div>`;
      });
      html += '</div></div>';
    });
    html += '</div>';
  }
  box.innerHTML = html;
}

// 결정적 ID (재업로드해도 같은 상품/규격이 중복 생성되지 않도록)
function hashId(prefix, str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return prefix + '_' + (h >>> 0).toString(36);
}
function parseNum(v) {
  const s = String(v==null?'':v).replace(/[^0-9.\-]/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

/* -------------------------------------------------- 파일 읽기 (CSV/XLSX) */
function decodeBuf(buf) {
  let s = new TextDecoder('utf-8').decode(buf);
  if (s.indexOf('�') >= 0) { try { s = new TextDecoder('euc-kr').decode(buf); } catch (e) {} }
  return s;
}
function parseCsvText(txt) {
  const lines = txt.replace(/\r\n?/g, '\n').split('\n').filter(l => l.trim() !== '');
  return lines.map(line => {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) { if (c === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out.map(s => s.trim());
  });
}
function readFileRows(file) {
  return new Promise((res, rej) => {
    const name = (file.name || '').toLowerCase();
    const r = new FileReader();
    r.onerror = () => rej(new Error('파일을 읽지 못했습니다'));
    if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
      if (typeof XLSX === 'undefined') { rej(new Error('엑셀(xlsx) 파싱 모듈을 불러오지 못했습니다. 인터넷 연결 후 다시 시도하거나 CSV로 올려주세요.')); return; }
      r.onload = () => { try {
        const wb = XLSX.read(new Uint8Array(r.result), { type:'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        res(XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' }));
      } catch (e) { rej(e); } };
      r.readAsArrayBuffer(file);
    } else {
      r.onload = () => { try { res(parseCsvText(decodeBuf(r.result))); } catch (e) { rej(e); } };
      r.readAsArrayBuffer(file);
    }
  });
}

/* -------------------------------------------------- 카페24 파서 */
function cafe24ColIndex(headers) {
  const norm = headers.map(h => String(h).replace(/\s/g, ''));
  const eq = v => norm.indexOf(v);
  const sw = v => norm.findIndex(x => x.indexOf(v) === 0);
  return {
    orderDateTime: eq('주문일시'),
    orderNo:       eq('주문번호'),
    itemOrderNo:   eq('품목별주문번호'),
    buyerName:     eq('주문자명'),
    productCode:   eq('상품코드'),
    optionCode:    eq('상품품목코드'),
    productName:   sw('상품명'),
    optionName:    eq('상품옵션'),
    qty:           eq('수량'),
    cancelFlag:    eq('취소구분'),
    listPrice:     eq('소비자가격'),
    addDiscount:   eq('상품별추가할인금액'),
    orderGross:    eq('총상품구매금액'),
    orderTotal:    eq('총결제금액'),
    netAmount:     eq('품목별결제금액'),
    unitSalePrice: eq('옵션+판매가'),
    usedPoints:    sw('사용한적립금액'),
    coupon:        sw('쿠폰할인금액'),
    shipping:      norm.findIndex(x => x.indexOf('총배송비') === 0 && x.indexOf('첫품목') >= 0),
  };
}
function cleanOption(raw) {
  let s = String(raw || '').trim();
  if (!s) return '기본';
  if (s.indexOf('=') >= 0) s = s.split('=').pop().trim();   // "수량/중량=1.5kg (9-10입)" → "1.5kg (9-10입)"
  return s || '기본';
}
function parseCafe24(matrix) {
  if (!matrix || !matrix.length) throw new Error('빈 파일입니다');
  // 헤더 행 = '주문번호' 를 포함한 첫 행
  let hi = matrix.findIndex(r => r.some(c => String(c).replace(/\s/g,'') === '주문번호'));
  if (hi < 0) hi = 0;
  const col = cafe24ColIndex(matrix[hi]);
  const required = ['orderNo','itemOrderNo','productCode','qty','netAmount','orderTotal'];
  const missing = required.filter(k => col[k] < 0);
  if (missing.length) throw new Error('카페24 양식이 아닌 것 같습니다. 찾지 못한 열: ' + missing.join(', '));

  const get = (r, k) => col[k] >= 0 ? (r[col[k]] || '') : '';
  const items = [];
  for (let i = hi + 1; i < matrix.length; i++) {
    const r = matrix[i];
    if (!r || !String(get(r,'itemOrderNo')).trim()) continue;
    const dt = String(get(r,'orderDateTime')).trim();
    const date = (dt.match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/) || [])
      .slice(1).map((x,ix)=> ix===0?x:('0'+x).slice(-2)).join('-') || dt.slice(0,10);
    const cancelFlag = String(get(r,'cancelFlag')).trim();
    const qty = parseNum(get(r,'qty')) || 1;
    const unitSalePrice = parseNum(get(r,'unitSalePrice'));   // 옵션+판매가 (1개 판매가)
    const orderGross = parseNum(get(r,'orderGross'));          // 총 상품구매금액 (주문 단위)
    const netAmount = parseNum(get(r,'netAmount'));            // 품목별 결제금액 (순매출)
    items.push({
      orderNo: String(get(r,'orderNo')).trim(),
      itemOrderNo: String(get(r,'itemOrderNo')).trim(),
      orderDateTime: dt, orderDate: date,
      buyerName: String(get(r,'buyerName')).trim(),
      productCode: String(get(r,'productCode')).trim() || '(코드없음)',
      optionCode: String(get(r,'optionCode')).trim() || '__NONE__',
      productName: String(get(r,'productName')).trim(),
      optionName: cleanOption(get(r,'optionName')),
      qty,
      listPrice: parseNum(get(r,'listPrice')),
      addDiscount: parseNum(get(r,'addDiscount')),
      unitSalePrice,
      orderGross,
      grossAmount: unitSalePrice > 0 ? unitSalePrice * qty : netAmount,  // 품목 매출(판매가×수량)
      orderTotal: parseNum(get(r,'orderTotal')),
      netAmount,
      usedPoints: parseNum(get(r,'usedPoints')),
      coupon: parseNum(get(r,'coupon')),
      shipping: parseNum(get(r,'shipping')),
      isCancelled: cancelFlag !== '' && cancelFlag !== '취소안함',
      cancelFlag,
    });
  }
  if (!items.length) throw new Error('데이터 행을 찾지 못했습니다');
  return items;
}

/* -------------------------------------------------- 집계 요약 */
function summarize(items) {
  const orderGrossMap = {};   // 매출 dedup: 주문번호 → 총 상품구매금액
  let net = 0, qty = 0, cancelNet = 0, cancelCnt = 0;
  let from = null, to = null;
  const orderSet = new Set(), cancelOrderSet = new Set();
  items.forEach(it => {
    if (it.orderDate) { if (!from || it.orderDate < from) from = it.orderDate; if (!to || it.orderDate > to) to = it.orderDate; }
    if (it.isCancelled) { cancelNet += it.netAmount; cancelCnt++; cancelOrderSet.add(it.orderNo); return; }
    orderSet.add(it.orderNo);
    if (orderGrossMap[it.orderNo] == null) orderGrossMap[it.orderNo] = it.orderGross;
    net += it.netAmount; qty += it.qty;
  });
  const gross = Object.values(orderGrossMap).reduce((a,b)=>a+b, 0);
  return { gross, net, qty, cancelNet, cancelCnt,
    orderCount: orderSet.size, itemCount: items.filter(i=>!i.isCancelled).length,
    from, to };
}

async function handleFiles(fileList) {
  const files = Array.from(fileList);
  $('#parseMsg').innerHTML = '<span class="text-slate-500">파일 읽는 중…</span>';
  try {
    let all = [];
    for (const f of files) {
      const rows = await readFileRows(f);
      const items = parseCafe24(rows);
      all = all.concat(items);
    }
    parsedUpload = { fileName: files.map(f=>f.name).join(', '), items: all, summary: summarize(all) };

    $('#previewBox').innerHTML = '';
  }
}

function commitUpload() {
  if (!parsedUpload) return;
  const ch = ensureCafe24();
  const brand = ensureBrand(ch.defaultBrandName || '몽프루이');
  const uploadId = genId('upl');
  const { items, summary, fileName } = parsedUpload;

  items.forEach(it => {
    const productId = hashId('p', CAFE24_CH_ID + '|' + it.productCode);
    const itemId    = hashId('i', CAFE24_CH_ID + '|' + it.productCode + '|' + it.optionCode);
    const matchKey  = CAFE24_CH_ID + '|' + it.productCode + '|' + it.optionCode;
    // 상품 마스터 자동 등록/갱신
    if (!DB.get('products', productId))
      DB.put('products', { id:productId, brandId:brand.id, name:it.productName || it.productCode, active:true, source:'cafe24', channelProductCode:it.productCode });
    if (!DB.get('productItems', itemId))
      DB.put('productItems', { id:itemId, productId, brandId:brand.id, spec:it.optionName, sku:'', unitType:'ea', unitValue:null, price:it.listPrice||null, active:true, source:'cafe24', channelOptionCode:it.optionCode });
    // 매칭(자기 자신) 등록
    if (!DB.get('channelMappings', matchKey))
      DB.put('channelMappings', { id:matchKey, matchKey, channelId:CAFE24_CH_ID, channelProductCode:it.productCode,
        channelOptionCode:it.optionCode, keyMode:'code', productItemId:itemId, status:'confirmed',
        snapProductName:it.productName, snapOptionName:it.optionName });
    // 매출 저장 (saleId = 품목별주문번호 해시 → 중복 자동 방지)
    const saleId = hashId('s', CAFE24_CH_ID + '|' + it.itemOrderNo);
    DB.put('sales', {
      id:saleId, uploadId, channelId:CAFE24_CH_ID,
      orderNo:it.orderNo, itemOrderNo:it.itemOrderNo, orderDate:it.orderDate, orderDateTime:it.orderDateTime,
      buyerName:it.buyerName,
      channelProductCode:it.productCode, channelOptionCode:it.optionCode, rawProductName:it.productName, rawOptionName:it.optionName,
      brandId:brand.id, productId, productItemId:itemId, matchKey, matchStatus:'matched',
      qty:it.qty, netAmount:it.netAmount, grossAmount:it.grossAmount, orderGross:it.orderGross,
      unitSalePrice:it.unitSalePrice, listPrice:it.listPrice, addDiscount:it.addDiscount,
      orderTotal:it.orderTotal, usedPoints:it.usedPoints, coupon:it.coupon, shipping:it.shipping,
      isCancelled:it.isCancelled,
    });
  });

  DB.put('uploads', { id:uploadId, channelId:CAFE24_CH_ID, channelName:ch.name, fileName, uploadedAt:Date.now(),
    itemCount:summary.itemCount, orderCount:summary.orderCount, net:summary.net, gross:summary.gross,
    qty:summary.qty, cancelCnt:summary.cancelCnt, from:summary.from, to:summary.to,
    saleIds: items.map(it => hashId('s', CAFE24_CH_ID + '|' + it.itemOrderNo)) });

  parsedUpload = null;
  toast(comma(summary.itemCount) + '품목 저장 완료 · ' + won(summary.net));
  refreshBadges();
  goTab('main');
}

function undoUpload(uploadId) {
  const u = DB.get('uploads', uploadId);
  if (!u) return;
  if (!confirm(`"${u.fileName}" 업로드(${comma(u.itemCount)}품목)를 되돌릴까요?\n이 업로드로 저장된 매출이 삭제됩니다.`)) return;
  DB.list('sales').filter(s => s.uploadId === uploadId).forEach(s => DB.del('sales', s.id));
  DB.del('uploads', uploadId);
  toast('되돌렸습니다');
  refreshBadges(); renderUpload();
}

/* ============================================================ 집계 (메인/매출 공용) */
function filteredSales(from, to, chSet, brSet) {
  return DB.list('sales').filter(s => {
    if (from && s.orderDate < from) return false;
    if (to && s.orderDate > to) return false;
    if (chSet && chSet.size && !chSet.has(s.channelId)) return false;
    if (brSet && brSet.size && !brSet.has(s.brandId)) return false;
    return true;
  });
}
function aggregate(sales) {
  const orderGrossMap = {};   // 채널|주문번호 → 총 상품구매금액 (dedup)
  let net = 0, qty = 0, cancelNet = 0, cancelCnt = 0;
  const brand = {}, product = {}, item = {}, channel = {};
  const orderSet = new Set();
  sales.forEach(s => {
    if (s.isCancelled) { cancelNet += s.netAmount||0; cancelCnt++; return; }
    const ok = s.channelId + '|' + s.orderNo;
    if (orderGrossMap[ok] == null) orderGrossMap[ok] = s.orderGross||0;
    orderSet.add(ok);
    net += s.netAmount||0; qty += s.qty||0;
    const add = (m, k) => { (m[k] = m[k] || { gross:0, net:0, qty:0 }); m[k].gross += s.grossAmount||0; m[k].net += s.netAmount||0; m[k].qty += s.qty||0; };
    add(brand, s.brandId); add(product, s.productId); add(item, s.productItemId); add(channel, s.channelId);
  });
  const gross = Object.values(orderGrossMap).reduce((a,b)=>a+b, 0);
  return { gross, net, qty, cancelNet, cancelCnt, orderCount:orderSet.size, brand, product, item, channel };
}
function statCard(label, value, sub, accent) {
  return `<div class="bg-white rounded-2xl border border-slate-200 p-4">
    <div class="text-xs text-slate-400 font-semibold">${label}</div>
    <div class="text-2xl font-bold num mt-1 ${accent||''}">${value}</div>
    ${sub?`<div class="text-xs text-slate-400 mt-0.5">${sub}</div>`:''}</div>`;
}
// 브랜드/상품 분해 표 (매출=총상품구매금액, 순매출=품목별결제금액)
function breakdownTables(agg, opts={}) {
  const brands = DB.list('brands'), products = DB.list('products'), items = DB.list('productItems');
  const total = agg.gross || 1;
  const brRows = Object.keys(agg.brand).map(bid => ({ id:bid, name:(brands.find(b=>b.id===bid)||{}).name||'(브랜드)', ...agg.brand[bid] })).sort((a,b)=>b.gross-a.gross);
  const prRows = Object.keys(agg.product).map(pid => {
    const p = products.find(x=>x.id===pid) || {};
    const kids = items.filter(it => it.productId === pid && agg.item[it.id]).map(it => ({ id:it.id, spec:it.spec, ...agg.item[it.id] })).sort((a,b)=>b.gross-a.gross);
    return { id:pid, name:p.name||'(상품)', ...agg.product[pid], kids };
  }).sort((a,b)=>b.gross-a.gross);
  const bar = (v) => `<div class="h-1.5 bg-slate-100 rounded"><i class="block h-full bg-brand rounded" style="width:${(v/total*100).toFixed(1)}%"></i></div>`;
  const thead = `<thead><tr class="text-[11px] text-slate-400 border-b border-slate-100">
    <th class="text-left font-semibold pb-1.5">$LABEL</th><th class="text-right font-semibold pb-1.5">매출</th>
    <th class="text-right font-semibold pb-1.5">순매출</th><th class="text-right font-semibold pb-1.5">수량</th>
    <th class="pb-1.5"></th><th class="text-right font-semibold pb-1.5">비중</th></tr></thead>`;

  const brandTable = `<div class="bg-white rounded-2xl border border-slate-200 p-4">
    <h3 class="font-bold text-sm mb-3">브랜드별</h3>
    <table class="w-full text-sm">${thead.replace('$LABEL','브랜드')}<tbody>
    ${brRows.length? brRows.map(r=>`<tr class="border-b border-slate-50">
      <td class="py-2 font-semibold">${esc(r.name)}</td>
      <td class="py-2 text-right num">${won(r.gross)}</td>
      <td class="py-2 text-right num text-slate-500">${won(r.net)}</td>
      <td class="py-2 text-right num text-slate-500">${comma(r.qty)}개</td>
      <td class="py-2 pl-3 w-24">${bar(r.gross)}</td>
      <td class="py-2 pl-2 text-right text-xs text-slate-400 num">${(r.gross/total*100).toFixed(1)}%</td></tr>`).join('')
    : '<tr><td colspan="6" class="py-6 text-center text-slate-400 text-sm">데이터 없음</td></tr>'}
    </tbody></table></div>`;

  const showSpec = opts.specMode;
  const prodTable = `<div class="bg-white rounded-2xl border border-slate-200 p-4">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-bold text-sm">상품별</h3>
      ${opts.toggle? `<div class="inline-flex rounded-lg border border-slate-200 overflow-hidden text-xs">
        <button onclick="setSpecMode(false)" class="px-3 py-1.5 ${!showSpec?'bg-brand text-white':'bg-white text-slate-500'}">상품 기준</button>
        <button onclick="setSpecMode(true)" class="px-3 py-1.5 ${showSpec?'bg-brand text-white':'bg-white text-slate-500'}">규격 기준</button></div>`:''}
    </div>
    <table class="w-full text-sm">${thead.replace('$LABEL','상품')}<tbody>
    ${prRows.length? prRows.map(r=>{
      let html = `<tr class="border-b border-slate-50">
        <td class="py-2 font-semibold">${esc(r.name)}${r.kids.length>1?`<span class="ml-1 text-[10px] text-slate-400">규격 ${r.kids.length}</span>`:''}</td>
        <td class="py-2 text-right num">${won(r.gross)}</td>
        <td class="py-2 text-right num text-slate-500">${won(r.net)}</td>
        <td class="py-2 text-right num text-slate-500">${comma(r.qty)}개</td>
        <td class="py-2 pl-3 w-24">${bar(r.gross)}</td>
        <td class="py-2 pl-2 text-right text-xs text-slate-400 num">${(r.gross/total*100).toFixed(1)}%</td></tr>`;
      if (showSpec) r.kids.forEach(k => { html += `<tr class="border-b border-slate-50 text-xs text-slate-500">
        <td class="py-1.5 pl-4">└ ${esc(k.spec)}</td>
        <td class="py-1.5 text-right num">${won(k.gross)}</td>
        <td class="py-1.5 text-right num">${won(k.net)}</td>
        <td class="py-1.5 text-right num">${comma(k.qty)}개</td><td></td><td></td></tr>`; });
      return html;
    }).join('') : '<tr><td colspan="6" class="py-6 text-center text-slate-400 text-sm">데이터 없음</td></tr>'}
    </tbody></table></div>`;

  return `<div class="grid gap-4 lg:grid-cols-2">${brandTable}${prodTable}</div>`;
}

      ${statCard('취소', agg.cancelCnt?comma(agg.cancelCnt)+'건':'0건', agg.cancelCnt?won(agg.cancelNet)+' 제외':'', agg.cancelCnt?'text-rose-500':'')}
    </div>
    <div class="flex justify-end mb-2"><button onclick="exportSalesCsv()" class="text-xs font-semibold text-brand px-2 py-1 rounded hover:bg-brand-soft">CSV 내보내기</button></div>
    ${breakdownTables(agg, { toggle:true, specMode:_specMode })}`;

  $('#sFrom').addEventListener('change', e => { salesState.from = e.target.value; renderSales(); });
  $('#sTo').addEventListener('change', e => { salesState.to = e.target.value; renderSales(); });
}
window.salesQuick = (a,b) => { salesState.from = shiftDate(todayStr(),a); salesState.to = shiftDate(todayStr(),b); renderSales(); };
window.salesQuickAll = () => { const d=[...new Set(DB.list('sales').map(s=>s.orderDate))].sort(); salesState.from=d[0]; salesState.to=d[d.length-1]; renderSales(); };
window.salesToggleCh = (id) => { if (!id) salesState.chSet.clear(); else { salesState.chSet.has(id)?salesState.chSet.delete(id):salesState.chSet.add(id); } renderSales(); };
window.salesToggleBr = (id) => { if (!id) salesState.brSet.clear(); else { salesState.brSet.has(id)?salesState.brSet.delete(id):salesState.brSet.add(id); } renderSales(); };

function exportSalesCsv() {
  const sales = filteredSales(salesState.from, salesState.to, salesState.chSet, salesState.brSet)
    .sort((a,b)=> a.orderDate<b.orderDate?-1:1);
  const q = s => { s = String(s==null?'':s); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const head = '주문일,채널,브랜드,상품,옵션,수량,매출,순매출,취소여부\n';
  const body = sales.map(s => [s.orderDate, (DB.get('channels',s.channelId)||{}).name||'',
    (DB.get('brands',s.brandId)||{}).name||'', q(s.rawProductName), q(s.rawOptionName),
    s.qty, s.grossAmount, s.netAmount, s.isCancelled?'취소':'정상'].join(',')).join('\n');
  const blob = new Blob(['﻿'+head+body], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = '매출_' + salesState.from + '_' + salesState.to + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('CSV 를 내보냈습니다');
}
window.exportSalesCsv = exportSalesCsv;

/* ============================================================ 초기화 */
function init() {
  // 탭 클릭
  $$('.tabbtn').forEach(b => b.addEventListener('click', () => goTab(b.dataset.tab)));
  $$('.subtab').forEach(b => b.addEventListener('click', () => renderSub(b.dataset.sub)));
  // 카페24(자사몰) 채널을 미리 보장
  ensureCafe24();
  // 모드 배지
  $('#mode-badge').textContent = DB.mode === 'local' ? '로컬 모드' : 'Firebase';
  refreshBadges();
  goTab('main');
  // 처음이면 셋팅으로 유도 + 샘플 버튼 노출
  if (!DB.list('channels').length && !DB.list('brands').length) {
    const main = $('[data-panel="main"] .rounded-2xl');
    if (main) main.insertAdjacentHTML('beforeend',
      '<div class="mt-4"><button onclick="seedSample();goTab(\'settings\')" class="text-sm font-semibold text-slate-500 underline">또는 샘플 데이터로 먼저 둘러보기</button></div>');
  }
}
init();

})();
</script>
</body>

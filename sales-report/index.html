<!-- ===== 토스트 ===== -->
<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl text-sm font-semibold shadow-lg"></div>

<script>
/* ============================================================================
 * 매출 통합 대시보드 — Phase 1~2 (개발 뼈대 + 셋팅 CRUD)
 *
 *  - 이 파일은 단일 HTML 로 동작합니다.
 *  - 데이터 계층(DB)은 Firestore 와 동일한 사고방식(컬렉션/문서ID)으로 설계했고,
 *    지금은 localStorage 로 동작하는 "로컬 모드" 어댑터를 씁니다.
 *    나중에 firebaseConfig 를 채우면 같은 인터페이스로 Firestore 로 교체됩니다.
 * ==========================================================================*/
(function () {
'use strict';

/* ---------------------------------------------------------------- 공통 유틸 */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (tag, attrs={}, html) => {
  const n = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') n.className = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  }
  if (html != null) n.innerHTML = html;
  return n;
};
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const comma = (n) => (Math.round(Number(n)||0)).toLocaleString('ko-KR');
const won   = (n) => comma(n) + '원';
// 짧은 랜덤 ID (Firestore auto-id 대용). prefix 로 컬렉션 구분.
let _seq = 0;
function genId(prefix) {
  _seq = (_seq + 1) % 100000;
  const rand = Math.floor(performance.now()*1000).toString(36) + _seq.toString(36);
  return (prefix ? prefix + '_' : '') + rand;
}

function toast(msg, type='ok') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl text-sm font-semibold shadow-lg ' +
    (type==='err' ? 'bg-rose-600 text-white' : type==='warn' ? 'bg-amber-500 text-white' : 'bg-slate-800 text-white');
  t.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hidden'), 2400);
}

/* ------------------------------------------------------- 문자열 정규화(6-2) */
const NOISE = ['정품','무료배송','당일발송','산지직송','특가','본사직영','best','신상','히트','1+1','사은품증정'];
function normalizeName(s) {
  let x = String(s||'').toLowerCase();
  x = x.replace(/\[[^\]]*\]/g, ' ').replace(/\([^)]*\)/g, ' ');   // 대괄호·소괄호 내용 제거
  NOISE.forEach(w => { x = x.split(w).join(' '); });
  x = x.replace(/킬로그램|킬로|kg/g, 'kg').replace(/그램/g, 'g');   // 단위 표기 통일
  x = x.replace(/[^\p{L}\p{N}]+/gu, '');                          // 공백·특수문자 제거
  return x;
}
/* ------------------------------------------------------- 옵션 숫자·단위(6-3) */
function extractSpec(s) {
  const m = String(s||'').match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|l|개입|개|입|과|봉|팩|미)/i);
  if (!m) return null;
  let unit = m[2].toLowerCase();
  if (unit === '개입' || unit === '개' || unit === '입' || unit === '과' || unit === '봉' || unit === '팩' || unit === '미') unit = 'ea';
  return { num: parseFloat(m[1]), unit };
}
function sameSpec(a, b) {
  if (!a && !b) return true;
  if (!a || !b) return false;
  return a.num === b.num && a.unit === b.unit;
}

/* ============================================================================
 * DB 어댑터 — localStorage 로컬 모드 (Firestore 호환 인터페이스)
 *   컬렉션: channels, brands, products, productItems, channelMappings,
 *           uploads, sales, dailyStats
 *   각 문서는 { id, ... } 형태. put 은 upsert, del 은 완전 삭제.
 *   ※ 상품/규격/채널은 삭제 대신 active:false 소프트 삭제를 권장(스펙 7).
 * ==========================================================================*/
const STORE_KEY = 'saleshub:v2';
const COLLECTIONS = ['channels','brands','products','productItems','channelMappings','uploads','sales','dailyStats'];

const LocalDB = (function () {
  let cache = null;
  function raw() {
    if (cache) return cache;
    try { cache = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch (e) { cache = {}; }
    COLLECTIONS.forEach(c => { if (!cache[c]) cache[c] = {}; });
    return cache;
  }
  function flush() { localStorage.setItem(STORE_KEY, JSON.stringify(cache)); }
  return {
    mode: 'local',
    list(coll)      { return Object.values(raw()[coll] || {}); },
    get(coll, id)   { return (raw()[coll] || {})[id] || null; },
    put(coll, doc)  {
      const db = raw();
      if (!doc.id) doc.id = genId(coll.slice(0,4));
      doc.updatedAt = Date.now();
      if (!db[coll][doc.id]) doc.createdAt = Date.now();
      db[coll][doc.id] = { ...db[coll][doc.id], ...doc };
      flush();
      return db[coll][doc.id];
    },
    del(coll, id)   { const db = raw(); delete db[coll][id]; flush(); },
    clearAll()      { cache = {}; COLLECTIONS.forEach(c => cache[c]={}); flush(); },
    exportAll()     { return JSON.stringify(raw(), null, 2); },
    importAll(json) {
      const obj = JSON.parse(json);
      cache = {};
      COLLECTIONS.forEach(c => { cache[c] = obj[c] || {}; });
      flush();
    }
  };
})();

// firebaseConfig 가 채워지면 여기서 FirestoreDB 로 교체 (Phase 후속).
let DB = LocalDB;
window.__DB = DB;   // 콘솔 디버깅용

/* ============================================================ 탭/서브탭 네비 */
let curTab = 'main', curSub = 'channel';

function goTab(name) {
  curTab = name;
  $$('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  $$('.tab-panel').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== name));
  if (name === 'settings') renderSub(curSub);
  else if (name === 'main') renderMain();
  else if (name === 'sales') renderSales();
  else if (name === 'upload') renderUpload();
}
window.goTab = goTab;

function renderSub(name) {
  curSub = name;
  $$('.subtab').forEach(b => b.classList.toggle('active', b.dataset.sub === name));
  $$('.sub-panel').forEach(p => p.classList.toggle('hidden', p.dataset.subPanel !== name));
  const map = { channel: renderChannels, brand: renderBrands, product: renderProducts, match: renderMatch, etc: renderEtc };
  (map[name] || (()=>{}))();
}

/* ============================================================ 모달 헬퍼 */
function openModal(html) {
  $('#modal-card').innerHTML = html;
  $('#modal').classList.remove('hidden');
}
function closeModal() { $('#modal').classList.add('hidden'); }
window.closeModal = closeModal;
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// 공통 폼 UI 조각
const F = {
  wrap: (title, bodyHtml, footHtml) => `
    <div class="p-5 border-b border-slate-100 flex items-center justify-between">
      <h3 class="font-bold">${esc(title)}</h3>
      <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
    </div>
    <div class="p-5 space-y-4 max-h-[65vh] overflow-y-auto">${bodyHtml}</div>
    <div class="p-4 border-t border-slate-100 flex justify-end gap-2">${footHtml}</div>`,
  text: (id, label, val='', ph='', extra='') => `
    <div><label class="block text-xs font-semibold text-slate-500 mb-1.5">${esc(label)}</label>
    <input id="${id}" ${extra} value="${esc(val)}" placeholder="${esc(ph)}"
      class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg"></div>`,
  num: (id, label, val='', ph='') => `
    <div><label class="block text-xs font-semibold text-slate-500 mb-1.5">${esc(label)}</label>
    <input id="${id}" type="number" value="${val===''?'':esc(val)}" placeholder="${esc(ph)}"
      class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg"></div>`,
  sel: (id, label, options, val='') => `
    <div><label class="block text-xs font-semibold text-slate-500 mb-1.5">${esc(label)}</label>
    <select id="${id}" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white">
      ${options.map(o => `<option value="${esc(o.v)}" ${o.v===val?'selected':''}>${esc(o.t)}</option>`).join('')}
    </select></div>`,
  toggle: (id, label, on=true) => `
    <label class="flex items-center justify-between cursor-pointer">
      <span class="text-xs font-semibold text-slate-500">${esc(label)}</span>
      <input id="${id}" type="checkbox" ${on?'checked':''} class="w-4 h-4 accent-brand"></label>`,
  btnPrimary: (label, onclick) => `<button onclick="${onclick}" class="px-4 py-2 text-sm font-semibold rounded-lg bg-brand text-white hover:bg-brand-dark">${esc(label)}</button>`,
  btnGhost: (label, onclick) => `<button onclick="${onclick}" class="px-4 py-2 text-sm font-semibold rounded-lg bg-white text-slate-500 border border-slate-200 hover:bg-slate-50">${esc(label)}</button>`,
};

// 공통: 빈 상태 카드
function emptyCard(icon, title, desc, btnLabel, btnOnclick) {
  return `<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center">
    <div class="text-3xl mb-2">${icon}</div>
    <h3 class="font-bold text-sm mb-1">${esc(title)}</h3>
    <p class="text-sm text-slate-500 mb-4">${desc}</p>
    ${btnLabel ? F.btnPrimary(btnLabel, btnOnclick) : ''}</div>`;
}
// 섹션 헤더(제목 + 추가버튼)
function sectionHead(title, sub, btnLabel, btnOnclick) {
  return `<div class="flex items-center justify-between mb-4 flex-wrap gap-2">
    <div><h2 class="font-bold">${esc(title)}</h2>${sub?`<p class="text-xs text-slate-400 mt-0.5">${esc(sub)}</p>`:''}</div>
    ${btnLabel ? `<button onclick="${btnOnclick}" class="px-3.5 py-2 text-sm font-semibold rounded-lg bg-brand text-white hover:bg-brand-dark">${esc(btnLabel)}</button>` : ''}
  </div>`;
}

/* ============================================================================
 * (a) 채널 관리 — 채널 유형(파일 양식) 기반
 * ==========================================================================*/
const CHANNEL_FORMATS = [
  { v:'cafe24',     t:'카페24 (자사몰)' },
  { v:'smartstore', t:'스마트스토어' },
  { v:'coupang',    t:'쿠팡' },
  { v:'11st',       t:'11번가' },
  { v:'ssg',        t:'SSG' },
  { v:'custom',     t:'기타' },
];
function formatLabel(f) { return (CHANNEL_FORMATS.find(x=>x.v===f)||{}).t || '기타'; }

function renderChannels() {
  const box = $('[data-sub-panel="channel"]');
  const list = DB.list('channels');
  let html = sectionHead('채널 관리', '판매 채널을 등록합니다. 스마트스토어처럼 계정이 브랜드별로 여러 개면 이름을 다르게 해서 각각 등록하세요.', '+ 채널 추가', 'openChannelForm()');
  if (!list.length) { html += emptyCard('🛒','등록된 채널이 없습니다','매출 엑셀을 내려받는 채널을 등록하세요.','+ 채널 추가','openChannelForm()'); box.innerHTML=html; return; }
  html += '<div class="grid gap-3 sm:grid-cols-2">';
  list.forEach(ch => {
    const cnt = DB.list('sales').filter(s=>s.channelId===ch.id).length;
    html += `<div class="bg-white rounded-2xl border border-slate-200 p-4">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="font-bold">${esc(ch.name)}</span>
        ${ch.brandId?`<span class="text-[10px] px-1.5 py-0.5 rounded bg-brand-soft text-brand-dark">${esc((DB.get('brands',ch.brandId)||{}).name||'')}</span>`:''}
        <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-500">${esc(formatLabel(ch.format))}</span>
        ${ch.active===false?'<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-400">사용안함</span>':''}
        <div class="ml-auto flex gap-1.5">
          <button onclick="openChannelForm('${ch.id}')" class="text-xs font-semibold text-brand px-2 py-1 rounded hover:bg-brand-soft">수정</button>
          <button onclick="delChannel('${ch.id}')" class="text-xs font-semibold text-rose-500 px-2 py-1 rounded hover:bg-rose-50">삭제</button>
        </div>
      </div>
      <div class="mt-1 text-xs text-slate-400">매출 ${comma(cnt)}품목 저장됨</div>
    </div>`;
  });
  html += '</div>'; box.innerHTML = html;
}
function openChannelForm(id) {
  const ch = id ? DB.get('channels',id) : { active:true, format:'smartstore' };
  const brands = DB.list('brands').filter(b=>b.active!==false);

function renderMatch() {
  const box = $('[data-sub-panel="match"]');
  const channels = DB.list('channels');
  const sales = DB.list('sales');
  const items = DB.list('productItems');
  let html = sectionHead('매칭 관리', '채널마다 상품코드가 다릅니다. 업로드된 채널 상품코드를 상품 관리에 등록한 규격에 연결하세요. 연결하면 과거 매출도 함께 갱신됩니다. 등록해둔 규격이 없으면 "+ 새로 만들기"로 바로 만들 수 있습니다.');

  if (!sales.length) {
    html += emptyCard('🔗','아직 매칭할 채널 상품이 없습니다','데이터 입력에서 파일을 올리면 채널 상품코드가 여기에 나타납니다.','데이터 입력하러 가기',"goTab('upload')");
    box.innerHTML = html; return;
  }
  let any = false;
  channels.forEach(ch => {
    const seen = {};
    sales.filter(s=>s.channelId===ch.id).forEach(s => {
      const key = (s.channelProductCode||'')+'|'+(s.channelOptionCode||'__NONE__');
      if (!seen[key]) seen[key] = { code:s.channelProductCode, opt:s.channelOptionCode||'__NONE__', name:s.rawProductName, optName:s.rawOptionName, brandId:s.brandId };
    });
    const rows = Object.values(seen);
    if (!rows.length) return;
    any = true;
    const unmatched = rows.filter(r => { const m = DB.get('channelMappings', ch.id+'|'+r.code+'|'+r.opt); return !m || !m.productItemId; }).length;
    html += `<div class="bg-white rounded-2xl border border-slate-200 p-4 mb-3">
      <h3 class="font-bold text-sm mb-2">${esc(ch.name)} · ${unmatched?`<span class="text-rose-500">미매칭 ${unmatched}건</span>`:'<span class="text-emerald-600">전부 매칭됨</span>'}</h3>
      <div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-[11px] text-slate-400 border-b border-slate-100">
        <th class="text-left font-semibold pb-1.5">채널 상품코드</th><th class="text-left font-semibold pb-1.5">채널 상품/옵션명</th><th class="text-left font-semibold pb-1.5">→ 내 규격</th></tr></thead><tbody>
      ${rows.map(r => {
        const mk = ch.id+'|'+r.code+'|'+r.opt;
        const m = DB.get('channelMappings', mk);
        const cur = m && m.productItemId ? m.productItemId : '';
        return `<tr class="border-b border-slate-50">
          <td class="py-2 text-xs text-slate-500 whitespace-nowrap">${esc(r.code)}${r.opt!=='__NONE__'?'<br>'+esc(r.opt):''}</td>
          <td class="py-2">${esc((r.name||'').slice(0,28))}${r.optName&&r.optName!=='기본'?`<span class="text-slate-400"> · ${esc(r.optName)}</span>`:''}</td>
          <td class="py-2"><div class="flex items-center gap-1.5">
            <select onchange="assignMatch('${ch.id}','${esc(r.code)}','${esc(r.opt)}',this.value)" class="px-2 py-1.5 text-sm border ${cur?'border-slate-200':'border-rose-300 bg-rose-50'} rounded-lg bg-white max-w-[220px]">
              <option value="">${cur?'(연결 해제)':'— 선택 —'}</option>${masterItemOptions(cur)}
            </select>
            ${cur?'':`<button onclick="quickCreateMaster('${ch.id}','${esc(r.code)}','${esc(r.opt)}')" class="text-[11px] font-semibold text-brand whitespace-nowrap px-1.5 py-1 rounded hover:bg-brand-soft">+ 새로 만들기</button>`}
          </div></td></tr>`;
      }).join('')}
      </tbody></table></div></div>`;
  });
  if (!any) html += `<p class="text-xs text-slate-400">아직 업로드된 채널 상품이 없습니다. 데이터 입력에서 파일을 올리면 여기에 채널 상품코드가 나타납니다.</p>`;
  box.innerHTML = html;
}
function applyMatchToSales(mk, itemId) {
  const it = itemId ? (DB.get('productItems', itemId)||{}) : {};
  DB.list('sales').filter(s => s.matchKey === mk).forEach(s => {
    DB.put('sales', { id:s.id, productItemId: itemId||null, productId: itemId?(it.productId||null):null, matchStatus: itemId?'matched':'unmatched' });
  });
}
function assignMatch(channelId, code, opt, itemId) {
  const mk = channelId+'|'+code+'|'+opt;
  if (!itemId) { if (DB.get('channelMappings',mk)) DB.del('channelMappings',mk); applyMatchToSales(mk, null); }
  else {
    DB.put('channelMappings', { id:mk, matchKey:mk, channelId, channelProductCode:code, channelOptionCode:opt, keyMode:'code', productItemId:itemId, status:'confirmed' });
    applyMatchToSales(mk, itemId);
  }
  toast('매칭을 저장했습니다'); refreshBadges(); renderMatch();
}
window.assignMatch = assignMatch;
// 미매칭 코드를 채널 상품명 그대로 새 상품/규격으로 만들어 바로 연결
function quickCreateMaster(channelId, code, opt) {
  const s = DB.list('sales').find(x => x.channelId===channelId && x.channelProductCode===code && (x.channelOptionCode||'__NONE__')===opt);
  if (!s) return;
  const brandId = s.brandId;
  if (!brandId) { toast('브랜드 정보가 없어 만들 수 없습니다','err'); return; }
  const pname = (s.rawProductName||code).slice(0,40);
  const spec = (s.rawOptionName && s.rawOptionName!=='기본') ? s.rawOptionName : '기본';
  if (!confirm(`"${pname}" (${spec}) 를 새 상품/규격으로 등록하고 연결할까요?\n(상품 관리에서 나중에 이름을 사과·감귤처럼 정리할 수 있습니다)`)) return;
  const product = DB.put('products', { brandId, name:pname, active:true });
  const item = DB.put('productItems', { productId:product.id, brandId, spec, sku:'', unitType:'ea', unitValue:null, price:s.listPrice||null, active:true });
  assignMatch(channelId, code, opt, item.id);
}
window.quickCreateMaster = quickCreateMaster;

function hashId(prefix, str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return prefix + '_' + (h >>> 0).toString(36);
}
function parseNum(v) {
  const s = String(v==null?'':v).replace(/[^0-9.\-]/g, '');
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
}
// 규격 표시 라벨 = 등급 + 규격 (예: "대과 3kg")
function itemLabel(it) { return (((it&&it.grade)?it.grade+' ':'')+((it&&it.spec)||'')).trim() || '기본'; }

  });

/* -------------------------------------------------- 파일 읽기 (CSV/XLSX) */
function decodeBuf(buf) {
  let s = new TextDecoder('utf-8').decode(buf);
  if (s.indexOf('�') >= 0) { try { s = new TextDecoder('euc-kr').decode(buf); } catch (e) {} }
  return s;
}
function parseCsvText(txt) {
  txt = txt.replace(/\r\n?/g, '\n');
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) { if (c === '"') { if (txt[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x !== ''));
}
function readFileRows(file) {
  return new Promise((res, rej) => {
    const name = (file.name || '').toLowerCase();
    const r = new FileReader();
    r.onerror = () => rej(new Error('파일을 읽지 못했습니다'));
    if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
      if (typeof XLSX === 'undefined') { rej(new Error('엑셀 파싱 모듈을 불러오지 못했습니다. 인터넷 연결 후 다시 시도하거나 CSV로 올려주세요.')); return; }
      r.onload = () => {
        const u8 = new Uint8Array(r.result);
        let wb;
        try { wb = XLSX.read(u8, { type:'array' }); }
        catch (err) {
          const cfb = u8[0]===0xD0 && u8[1]===0xCF && u8[2]===0x11 && u8[3]===0xE0;
          rej(new Error(cfb ? '비밀번호가 걸린 엑셀 파일입니다. 엑셀에서 파일을 연 뒤 "다른 이름으로 저장"에서 비밀번호를 지우고 다시 저장(또는 CSV로 저장)해서 올려주세요.' : ('엑셀을 읽지 못했습니다: '+err.message)));
          return;
        }
        const ws = wb.Sheets[wb.SheetNames[0]];
        res(XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' }));
      };
      r.readAsArrayBuffer(file);
    } else {
      r.onload = () => { try { res(parseCsvText(decodeBuf(r.result))); } catch (e) { rej(e); } };
      r.readAsArrayBuffer(file);
    }
  });
}
function cleanOption(raw) {
  let s = String(raw || '').trim();
  if (!s) return '기본';
  if (s.indexOf('=') >= 0) s = s.split('=').pop().trim();
  if (s.indexOf(':') >= 0 && s.length < 40) s = s.split(':').pop().trim();
  return s || '기본';
}
function normDateStr(v) {
  const s = String(v||'').trim();
  const m = s.match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if (m) return m[1] + '-' + ('0'+m[2]).slice(-2) + '-' + ('0'+m[3]).slice(-2);
  const m2 = s.match(/^(\d{4})(\d{2})(\d{2})/);
  if (m2) return m2[1]+'-'+m2[2]+'-'+m2[3];
  return s.slice(0,10);
}
function headerIndex(matrix, mustHave) {
  for (let i = 0; i < Math.min(matrix.length, 8); i++) {
    const norm = matrix[i].map(c => String(c).replace(/\s/g,''));
    if (mustHave.every(h => norm.some(x => x.indexOf(h) === 0 || x === h))) return i;
  }
  return -1;
}
function colFinder(headerRow) {
  const norm = headerRow.map(c => String(c).replace(/\s/g,''));
  return {
    eq: v => norm.indexOf(v),
    sw: v => norm.findIndex(x => x.indexOf(v) === 0),
  };
}

/* -------------------------------------------------- 파서: 카페24 */
function parseCafe24(matrix) {
  const hi = headerIndex(matrix, ['주문번호']);
  if (hi < 0) throw new Error('카페24 양식(주문번호 열)을 찾지 못했습니다');
  const f = colFinder(matrix[hi]);
  const col = {
    orderDateTime:f.eq('주문일시'), orderNo:f.eq('주문번호'), itemOrderNo:f.eq('품목별주문번호'),
    buyerName:f.eq('주문자명'), productCode:f.eq('상품코드'), optionCode:f.eq('상품품목코드'),
    productName:f.sw('상품명'), optionName:f.eq('상품옵션'), qty:f.eq('수량'), cancelFlag:f.eq('취소구분'),
    listPrice:f.eq('소비자가격'), unitSalePrice:f.eq('옵션+판매가'), netAmount:f.eq('품목별결제금액'),
  };
  const need = ['orderNo','itemOrderNo','productCode','qty','netAmount'];
  const miss = need.filter(k => col[k] < 0);
  if (miss.length) throw new Error('카페24 열을 찾지 못했습니다: '+miss.join(','));
  const g = (r,k) => col[k]>=0 ? (r[col[k]]||'') : '';
  const items = [];
  for (let i=hi+1;i<matrix.length;i++) {
    const r = matrix[i]; if (!r || !String(g(r,'itemOrderNo')).trim()) continue;
    const qty = parseNum(g(r,'qty'))||1;
    const unit = parseNum(g(r,'unitSalePrice'));
    const net = parseNum(g(r,'netAmount'));
    const cancel = String(g(r,'cancelFlag')).trim();
    items.push({
      orderNo:String(g(r,'orderNo')).trim(), itemOrderNo:String(g(r,'itemOrderNo')).trim(),
      orderDateTime:String(g(r,'orderDateTime')).trim(), orderDate:normDateStr(g(r,'orderDateTime')),
      buyerName:String(g(r,'buyerName')).trim(),
      productCode:String(g(r,'productCode')).trim()||'(코드없음)', optionCode:String(g(r,'optionCode')).trim()||'__NONE__',
      productName:String(g(r,'productName')).trim(), optionName:cleanOption(g(r,'optionName')),
      qty, listPrice:parseNum(g(r,'listPrice')),
      grossAmount: unit>0 ? unit*qty : net, netAmount:net,
      isCancelled: cancel!=='' && cancel!=='취소안함',
    });
  }
  if (!items.length) throw new Error('데이터 행을 찾지 못했습니다');
  return items;
}

/* -------------------------------------------------- 파서: 스마트스토어 */
const SS_CANCEL = ['취소','반품','환불','교환','미결제'];
function parseSmartstore(matrix) {
  const hi = headerIndex(matrix, ['상품주문번호']);
  if (hi < 0) throw new Error('스마트스토어 양식(상품주문번호 열)을 찾지 못했습니다');
  const f = colFinder(matrix[hi]);
  const col = {
    itemOrderNo:f.eq('상품주문번호'), orderNo:f.eq('주문번호'), buyerName:f.eq('구매자명'),
    payDate:f.eq('결제일'), orderDateTime:f.eq('주문일시'), status:f.eq('주문상태'), detail:f.eq('주문세부상태'),
    productCode:f.eq('상품번호'), productName:f.eq('상품명'), optionName:f.eq('옵션정보'), optionCode:f.eq('옵션관리코드'),
    qty:f.eq('수량'), listPrice:f.eq('상품가격'), total:f.sw('최종상품별총주문금액'),
  };
  const need = ['itemOrderNo','productCode','qty','total'];
  const miss = need.filter(k => col[k] < 0);
  if (miss.length) throw new Error('스마트스토어 열을 찾지 못했습니다: '+miss.join(','));
  const g = (r,k) => col[k]>=0 ? (r[col[k]]||'') : '';
  const items = [];
  for (let i=hi+1;i<matrix.length;i++) {
    const r = matrix[i]; if (!r || !String(g(r,'itemOrderNo')).trim()) continue;
    const qty = parseNum(g(r,'qty'))||1;
    const total = parseNum(g(r,'total'));   // 최종 상품별 총 주문금액 = 판매가×수량 (고객 구매가)
    const status = String(g(r,'status')).trim() + ' ' + String(g(r,'detail')).trim();
    items.push({
      orderNo:String(g(r,'orderNo')).trim(), itemOrderNo:String(g(r,'itemOrderNo')).trim(),
      orderDateTime:String(g(r,'payDate')||g(r,'orderDateTime')).trim(), orderDate:normDateStr(g(r,'payDate')||g(r,'orderDateTime')),
      buyerName:String(g(r,'buyerName')).trim(),
      productCode:String(g(r,'productCode')).trim()||'(코드없음)', optionCode:String(g(r,'optionCode')).trim()||'__NONE__',
      productName:String(g(r,'productName')).trim(), optionName:cleanOption(g(r,'optionName')),
      qty, listPrice:parseNum(g(r,'listPrice')),
      grossAmount: total, netAmount: total,
      isCancelled: SS_CANCEL.some(w => status.indexOf(w) >= 0),
    });
  }
  if (!items.length) throw new Error('데이터 행을 찾지 못했습니다');
  return items;
}
const PARSERS = { cafe24:parseCafe24, smartstore:parseSmartstore };
window.__PARSERS = PARSERS;

/* -------------------------------------------------- 요약 */
function summarize(items) {
  let gross=0, net=0, qty=0, cancelNet=0, cancelCnt=0, from=null, to=null;
  const orderSet=new Set();
  items.forEach(it=>{
    if (it.orderDate) { if(!from||it.orderDate<from)from=it.orderDate; if(!to||it.orderDate>to)to=it.orderDate; }
    if (it.isCancelled) { cancelNet+=it.grossAmount; cancelCnt++; return; }
    orderSet.add(it.orderNo); gross+=it.grossAmount; net+=it.netAmount; qty+=it.qty;
  });
  return { gross, net, qty, cancelNet, cancelCnt, orderCount:orderSet.size, itemCount:items.filter(i=>!i.isCancelled).length, from, to };
}

        <div class="flex items-center gap-3 text-sm border-b border-slate-50 pb-2 flex-wrap">

        </div>`).join('')}</div>` : '<p class="text-xs text-slate-400">아직 업로드한 내역이 없습니다.</p>'}

async function handleFiles(fileList) {
  const channelId = $('#selChannel').value;
  if (!channelId) { $('#parseMsg').innerHTML = '<span class="text-rose-600 font-semibold">이 브랜드에 지정된 채널이 없습니다. 셋팅 › 채널에서 채널에 이 브랜드를 지정하세요.</span>'; return; }
  const ch = DB.get('channels', channelId);
  const parser = PARSERS[ch && ch.format];
  if (!parser) { $('#parseMsg').innerHTML = `<span class="text-rose-600 font-semibold">이 채널 유형(${esc(formatLabel(ch&&ch.format))})은 아직 파일 파서가 없습니다. 카페24·스마트스토어만 지원합니다.</span>`; return; }
  $('#parseMsg').innerHTML = '<span class="text-slate-500">파일 읽는 중…</span>';
  try {
    let all = [];
    for (const file of Array.from(fileList)) { const rows = await readFileRows(file); all = all.concat(parser(rows)); }
    parsedUpload = { fileName: Array.from(fileList).map(f=>f.name).join(', '), channelId, brandId: $('#selBrand').value, items: all, summary: summarize(all), excluded: new Set() };
    $('#parseMsg').innerHTML = `<span class="text-emerald-600 font-semibold">${comma(all.length)}개 품목을 읽었습니다. 아래 미리보기를 확인하고 저장하세요.</span>`;
    renderPreview();
  } catch (e) {
    parsedUpload = null;
    $('#parseMsg').innerHTML = `<span class="text-rose-600 font-semibold">읽기 실패: ${esc(e.message)}</span>`;
    $('#previewBox').innerHTML = '';
  }
}

function includedPreviewItems() {
  const ex = parsedUpload.excluded || new Set();
  return parsedUpload.items.filter((it, i) => !ex.has(i));
}

  return `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-2">
      ${cell('매출 (판매가)', won(sm.gross), '주문 '+comma(sm.orderCount)+'건')}
      ${cell('순매출', won(sm.net), '품목 '+comma(sm.itemCount)+'건')}
      ${cell('수량', comma(sm.qty)+'개','')}
      ${cell('취소', sm.cancelCnt?comma(sm.cancelCnt)+'건':'0건', sm.cancelCnt?won(sm.cancelNet)+' 제외':'', sm.cancelCnt?'text-rose-500':'')}
    </div>
    ${excl?`<p class="text-xs text-slate-600 mb-1">체크 해제한 <b>${comma(excl)}건</b>은 저장에서 제외됩니다.</p>`:''}`;
}

    ${unmatched?`<p class="text-xs text-rose-500 mb-2">※ 미매칭 ${comma(unmatched)}건 — 저장 후 <b>매칭 관리</b>에서 상품에 연결하면 상품별 집계에 반영됩니다.</p>`:''}

    <div class="overflow-auto max-h-[420px] border border-slate-100 rounded-xl">

window.cancelUpload = () => { parsedUpload=null; renderUpload(); };

function commitUpload() {
  if (!parsedUpload) return;
  const { fileName, channelId, brandId } = parsedUpload;
  const ex = parsedUpload.excluded || new Set();
  const items = parsedUpload.items.filter((it,i)=>!ex.has(i));
  if (!items.length) { toast('저장할 항목이 없습니다 (모두 제외됨)','err'); return; }
  const summary = summarize(items);
  const uploadId = genId('upl');
  let unmatched = 0;
  items.forEach(it => {
    const opt = it.optionCode||'__NONE__';
    const mk = channelId+'|'+it.productCode+'|'+opt;
    const m = DB.get('channelMappings', mk);
    const pid = m&&m.productItemId ? m.productItemId : null;
    const prod = pid ? (DB.get('productItems',pid)||{}).productId : null;
    if (!pid) unmatched++;
    DB.put('sales', {
      id: hashId('s', channelId+'|'+it.itemOrderNo), uploadId, channelId, brandId,
      orderNo:it.orderNo, itemOrderNo:it.itemOrderNo, orderDate:it.orderDate, orderDateTime:it.orderDateTime, buyerName:it.buyerName,
      channelProductCode:it.productCode, channelOptionCode:opt, rawProductName:it.productName, rawOptionName:it.optionName,
      matchKey:mk, productItemId:pid, productId:prod, matchStatus: pid?'matched':'unmatched',
      qty:it.qty, grossAmount:it.grossAmount, netAmount:it.netAmount, listPrice:it.listPrice, isCancelled:it.isCancelled,
    });
  });
  DB.put('uploads', { id:uploadId, channelId, brandId, channelName:(DB.get('channels',channelId)||{}).name, fileName, uploadedAt:Date.now(),
    itemCount:summary.itemCount, gross:summary.gross, net:summary.net, qty:summary.qty, cancelCnt:summary.cancelCnt, from:summary.from, to:summary.to });
  parsedUpload = null;
  toast(`저장 완료 · 매출 ${won(summary.gross)}` + (unmatched?` · 미매칭 ${unmatched}건`:''));
  refreshBadges();
  if (unmatched) { goTab('settings'); renderSub('match'); } else goTab('main');
}
window.commitUpload = commitUpload;

function undoUpload(uploadId) {
  const u = DB.get('uploads', uploadId); if (!u) return;
  if (!confirm(`"${u.fileName}" 업로드(${comma(u.itemCount)}품목)를 되돌릴까요?`)) return;
  DB.list('sales').filter(s=>s.uploadId===uploadId).forEach(s=>DB.del('sales',s.id));
  DB.del('uploads', uploadId);
  toast('되돌렸습니다'); refreshBadges(); renderUpload();
}
window.undoUpload = undoUpload;

/* -------------------- 날짜·채널별 매출 (선택 삭제) -------------------- */
function dayChannelCardHtml() {
  const sales = DB.list('sales');
  const keys = [...new Set(sales.map(s => s.orderDate + '||' + s.channelId))];
  if (!keys.length) return '';
  const rows = keys.map(k => {
    const bar = k.indexOf('||'); const date=k.slice(0,bar), ch=k.slice(bar+2);
    const sub = sales.filter(s=>s.orderDate===date && s.channelId===ch);
    const t = totalsOf(sub);
    return { date, ch, chName:(DB.get('channels',ch)||{}).name||ch, items:sub.length, gross:t.gross, net:t.net, cancel:t.cancelCnt };
  }).sort((x,y)=> x.date<y.date?1:x.date>y.date?-1:(x.chName<y.chName?-1:1));
  return `<div class="bg-white rounded-2xl border border-slate-200 p-5 mt-4">
    <h3 class="font-bold text-sm mb-1">일자 · 채널별 매출</h3>
    <p class="text-xs text-slate-400 mb-3">특정 날짜의 특정 채널 매출만 골라서 삭제할 수 있습니다.</p>
    <div class="overflow-x-auto"><table class="w-full text-sm">
      <thead><tr class="text-[11px] text-slate-400 border-b border-slate-100">
        <th class="text-left font-semibold pb-1.5">날짜</th><th class="text-left font-semibold pb-1.5">채널</th>
        <th class="text-right font-semibold pb-1.5">품목</th><th class="text-right font-semibold pb-1.5">매출</th>
        <th class="text-right font-semibold pb-1.5">순매출</th><th class="pb-1.5"></th></tr></thead>
      <tbody>${rows.map(r=>`<tr class="border-b border-slate-50">
        <td class="py-2">${esc(r.date)}</td><td class="py-2">${esc(r.chName)}</td>
        <td class="py-2 text-right num text-slate-500">${comma(r.items)}${r.cancel?` <span class="text-rose-400">(취소 ${r.cancel})</span>`:''}</td>
        <td class="py-2 text-right num">${won(r.gross)}</td><td class="py-2 text-right num text-slate-500">${won(r.net)}</td>
        <td class="py-2 text-right"><button onclick="deleteDayChannel('${esc(r.date)}','${esc(r.ch)}')" class="text-xs font-semibold text-rose-500 px-2 py-1 rounded hover:bg-rose-50">삭제</button></td>
      </tr>`).join('')}</tbody></table></div></div>`;
}
function deleteDayChannel(date, ch) {
  const chName=(DB.get('channels',ch)||{}).name||ch;
  const del=DB.list('sales').filter(s=>s.orderDate===date&&s.channelId===ch);
  if(!del.length) return;
  if(!confirm(`${date} · ${chName} 매출 ${del.length}품목을 삭제할까요?\n이 날짜·채널만 지워지고 다른 데이터는 그대로입니다.`)) return;
  del.forEach(s=>DB.del('sales',s.id));
  DB.list('uploads').forEach(u=>{ if(!DB.list('sales').some(s=>s.uploadId===u.id)) DB.del('uploads',u.id); });
  toast(`${date} ${chName} ${del.length}품목 삭제`); refreshBadges(); renderUpload();
}
window.deleteDayChannel = deleteDayChannel;

/* ============================================================ 집계 */
function totalsOf(sales) {
  let gross=0, net=0, qty=0, cancelNet=0, cancelCnt=0; const orderSet=new Set();
  sales.forEach(s=>{ if(s.isCancelled){cancelNet+=s.grossAmount||0;cancelCnt++;return;} gross+=s.grossAmount||0; net+=s.netAmount||0; qty+=s.qty||0; orderSet.add(s.channelId+'|'+s.orderNo); });
  return { gross, net, qty, cancelNet, cancelCnt, orderCount:orderSet.size };
}
function groupSum(sales, keyFn, labelFn) {
  const m = {};
  sales.forEach(s=>{ if(s.isCancelled) return; const k=keyFn(s); if(!k) return;
    (m[k]=m[k]||{label:labelFn(s,k),gross:0,net:0,qty:0}); m[k].gross+=s.grossAmount||0; m[k].net+=s.netAmount||0; m[k].qty+=s.qty||0; });
  return Object.values(m).sort((a,b)=>b.gross-a.gross);
}
function simpleTable(title, rows, total) {

    <table class="w-full text-sm"><thead><tr class="text-[11px] text-slate-400 border-b border-slate-100">
      <th class="text-left font-semibold pb-1.5">이름</th><th class="text-right font-semibold pb-1.5">매출</th>
      <th class="text-right font-semibold pb-1.5">순매출</th><th class="text-right font-semibold pb-1.5">수량</th>
      <th class="pb-1.5"></th><th class="text-right font-semibold pb-1.5">비중</th></tr></thead><tbody>
    ${rows.length?rows.map(r=>`<tr class="border-b border-slate-50">
      <td class="py-2 font-semibold">${esc(r.label)}</td><td class="py-2 text-right num">${won(r.gross)}</td>
      <td class="py-2 text-right num text-slate-500">${won(r.net)}</td><td class="py-2 text-right num text-slate-500">${comma(r.qty)}개</td>
      <td class="py-2 pl-3 w-24">${bar(r.gross)}</td><td class="py-2 pl-2 text-right text-xs text-slate-400 num">${(r.gross/(total||1)*100).toFixed(1)}%</td></tr>`).join('')
      :'<tr><td colspan="6" class="py-6 text-center text-slate-400 text-sm">데이터 없음</td></tr>'}
    </tbody></table></div>`;
}
function productTable(sales, total) {
  const map = {};
  sales.forEach(s=>{ if(s.isCancelled) return;
    let pk,pl,kk,kl,matched;
    if(s.productItemId){ const it=DB.get('productItems',s.productItemId)||{}; const p=DB.get('products',it.productId)||{}; pk='p:'+it.productId; pl=p.name||'(상품)'; kk='i:'+s.productItemId; kl=itemLabel(it); matched=true; }
    else { pk='u:'+s.channelId+'|'+s.channelProductCode; pl='⚠ '+((s.rawProductName||'미매칭').slice(0,28)); kk='uo:'+(s.channelOptionCode||''); kl=s.rawOptionName||'기본'; matched=false; }
    const g=(map[pk]=map[pk]||{label:pl,matched,gross:0,net:0,qty:0,kids:{}});
    g.gross+=s.grossAmount||0; g.net+=s.netAmount||0; g.qty+=s.qty||0;
    const k=(g.kids[kk]=g.kids[kk]||{label:kl,gross:0,net:0,qty:0}); k.gross+=s.grossAmount||0; k.net+=s.netAmount||0; k.qty+=s.qty||0;
  });
  const rows = Object.values(map).sort((a,b)=>b.gross-a.gross);
  const bar=v=>`<div class="h-1.5 bg-slate-100 rounded"><i class="block h-full bg-brand rounded" style="width:${(v/(total||1)*100).toFixed(1)}%"></i></div>`;
  return `<div class="bg-white rounded-2xl border border-slate-200 p-4">
    <h3 class="font-bold text-sm mb-3">상품별 <span class="font-normal text-slate-400">상품 합계와 등급·규격별 매출</span></h3>
    <table class="w-full text-sm"><thead><tr class="text-[11px] text-slate-400 border-b border-slate-100">
      <th class="text-left font-semibold pb-1.5">상품 · 규격</th><th class="text-right font-semibold pb-1.5">매출</th>
      <th class="text-right font-semibold pb-1.5">순매출</th><th class="text-right font-semibold pb-1.5">수량</th>
      <th class="pb-1.5"></th><th class="text-right font-semibold pb-1.5">비중</th></tr></thead><tbody>
    ${rows.length?rows.map(r=>{
      const kids=Object.values(r.kids).sort((a,b)=>b.gross-a.gross);
      let h=`<tr class="bg-slate-50/60 border-b border-slate-100">
        <td class="py-2 font-bold ${r.matched?'':'text-rose-600'}">${esc(r.label)}</td>
        <td class="py-2 text-right num font-semibold">${won(r.gross)}</td><td class="py-2 text-right num text-slate-500">${won(r.net)}</td>
        <td class="py-2 text-right num text-slate-500">${comma(r.qty)}개</td><td class="py-2 pl-3 w-24">${bar(r.gross)}</td>
        <td class="py-2 pl-2 text-right text-xs text-slate-400 num">${(r.gross/(total||1)*100).toFixed(1)}%</td></tr>`;
      kids.forEach(k=>{ h+=`<tr class="border-b border-slate-50 text-slate-600">
        <td class="py-1.5 pl-5">└ ${esc(k.label)}</td><td class="py-1.5 text-right num">${won(k.gross)}</td>
        <td class="py-1.5 text-right num text-slate-400">${won(k.net)}</td><td class="py-1.5 text-right num text-slate-400">${comma(k.qty)}개</td><td></td><td></td></tr>`; });
      return h;
    }).join('') : '<tr><td colspan="6" class="py-6 text-center text-slate-400 text-sm">데이터 없음</td></tr>'}
    </tbody></table></div>`;
}

function breakdownHtml(sales, total) {
  const chRows = groupSum(sales, s=>s.channelId, s=>(DB.get('channels',s.channelId)||{}).name||'(채널)');
  const brRows = groupSum(sales, s=>s.brandId, s=>(DB.get('brands',s.brandId)||{}).name||'(브랜드)');
  return `<div class="grid gap-4 lg:grid-cols-2 mb-4">${simpleTable('채널별', chRows, total)}${simpleTable('브랜드별', brRows, total)}</div>
    ${productTable(sales, total)}`;
}

      ${statCard('순매출', won(t.net), '')}

      ${statCard('취소', t.cancelCnt?comma(t.cancelCnt)+'건':'0건', t.cancelCnt?won(t.cancelNet)+' 제외':'', t.cancelCnt?'text-rose-500':'')}

/* ============================================================ 매출 화면 */
const salesState = { from:null, to:null, chSet:new Set(), brSet:new Set() };
function todayStr(){ return new Date().toISOString().slice(0,10); }
function shiftDate(str,days){ const d=new Date(str+'T00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }

function renderSales() {
  const sec = $('[data-panel="sales"]');
  const all = DB.list('sales');
  if (!all.length) { sec.innerHTML = emptyCard('📈','매출 데이터가 없습니다','데이터 입력에서 주문내역을 먼저 올려주세요.','데이터 입력하러 가기',"goTab('upload')"); return; }
  const dates=[...new Set(all.map(s=>s.orderDate))].sort();
  if (!salesState.from) { salesState.from=dates[0]; salesState.to=dates[dates.length-1]; }
  const channels=DB.list('channels').filter(c=>all.some(s=>s.channelId===c.id));
  const brands=DB.list('brands').filter(b=>all.some(s=>s.brandId===b.id));
  const chip=(on,label,onclick)=>`<button onclick="${onclick}" class="px-3 py-1.5 rounded-full text-xs font-semibold border ${on?'bg-brand text-white border-brand':'bg-white text-slate-500 border-slate-200'}">${esc(label)}</button>`;
  const quick=[['오늘',0,0],['어제',-1,-1],['최근 7일',-6,0],['최근 30일',-29,0]];

  const sub = all.filter(s => s.orderDate>=salesState.from && s.orderDate<=salesState.to
    && (!salesState.chSet.size || salesState.chSet.has(s.channelId))
    && (!salesState.brSet.size || salesState.brSet.has(s.brandId)));
  const t = totalsOf(sub);
  const days = Math.max(1, Math.round((new Date(salesState.to)-new Date(salesState.from))/86400000)+1);

  sec.innerHTML = `
    <div class="bg-white rounded-2xl border border-slate-200 p-4 mb-4 space-y-3">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs font-bold text-slate-500 w-12">기간</span>
        <input type="date" id="sFrom" value="${salesState.from}" class="px-3 py-1.5 text-sm border border-slate-200 rounded-lg">
        <span class="text-slate-400">~</span>
        <input type="date" id="sTo" value="${salesState.to}" class="px-3 py-1.5 text-sm border border-slate-200 rounded-lg">
        <div class="flex gap-1.5 flex-wrap">${quick.map(q=>`<button onclick="salesQuick(${q[1]},${q[2]})" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-500 hover:bg-slate-200">${q[0]}</button>`).join('')}
          <button onclick="salesQuickAll()" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-500 hover:bg-slate-200">전체</button></div>
      </div>
      ${channels.length>1?`<div class="flex items-center gap-2 flex-wrap"><span class="text-xs font-bold text-slate-500 w-12">채널</span>
        ${chip(salesState.chSet.size===0,'전체','salesToggleCh(null)')}${channels.map(c=>chip(salesState.chSet.has(c.id),c.name,`salesToggleCh('${c.id}')`)).join('')}</div>`:''}
      ${brands.length>1?`<div class="flex items-center gap-2 flex-wrap"><span class="text-xs font-bold text-slate-500 w-12">브랜드</span>
        ${chip(salesState.brSet.size===0,'전체','salesToggleBr(null)')}${brands.map(b=>chip(salesState.brSet.has(b.id),b.name,`salesToggleBr('${b.id}')`)).join('')}</div>`:''}
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
      ${statCard('매출 <span class="font-normal text-slate-300">(판매가)</span>', won(t.gross), '주문 '+comma(t.orderCount)+'건 · '+days+'일')}
      ${statCard('순매출', won(t.net), '일평균 '+won(Math.round(t.net/days)))}
      ${statCard('수량', comma(t.qty)+'개','')}
      ${statCard('취소', t.cancelCnt?comma(t.cancelCnt)+'건':'0건', t.cancelCnt?won(t.cancelNet)+' 제외':'', t.cancelCnt?'text-rose-500':'')}
    </div>
    <div class="flex justify-end mb-2"><button onclick="exportSalesCsv()" class="text-xs font-semibold text-brand px-2 py-1 rounded hover:bg-brand-soft">CSV 내보내기</button></div>
    ${breakdownHtml(sub, t.gross)}`;
  $('#sFrom').addEventListener('change',e=>{ salesState.from=e.target.value; renderSales(); });
  $('#sTo').addEventListener('change',e=>{ salesState.to=e.target.value; renderSales(); });
}
window.salesQuick=(a,b)=>{ salesState.from=shiftDate(todayStr(),a); salesState.to=shiftDate(todayStr(),b); renderSales(); };
window.salesQuickAll=()=>{ const d=[...new Set(DB.list('sales').map(s=>s.orderDate))].sort(); salesState.from=d[0]; salesState.to=d[d.length-1]; renderSales(); };
window.salesToggleCh=id=>{ if(!id)salesState.chSet.clear(); else{ salesState.chSet.has(id)?salesState.chSet.delete(id):salesState.chSet.add(id);} renderSales(); };
window.salesToggleBr=id=>{ if(!id)salesState.brSet.clear(); else{ salesState.brSet.has(id)?salesState.brSet.delete(id):salesState.brSet.add(id);} renderSales(); };
function exportSalesCsv() {
  const sub = DB.list('sales').filter(s=>s.orderDate>=salesState.from&&s.orderDate<=salesState.to
    && (!salesState.chSet.size||salesState.chSet.has(s.channelId)) && (!salesState.brSet.size||salesState.brSet.has(s.brandId)))
    .sort((a,b)=>a.orderDate<b.orderDate?-1:1);
  const q=s=>{ s=String(s==null?'':s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const head='주문일,주문번호,주문자,채널,브랜드,상품,옵션,수량,매출,순매출,취소여부\n';
  const body=sub.map(s=>[s.orderDate,q(s.orderNo),q(s.buyerName),(DB.get('channels',s.channelId)||{}).name||'',(DB.get('brands',s.brandId)||{}).name||'',
    q(s.rawProductName),q(s.rawOptionName),s.qty,s.grossAmount,s.netAmount,s.isCancelled?'취소':'정상'].join(',')).join('\n');
  const blob=new Blob(['﻿'+head+body],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='매출_'+salesState.from+'_'+salesState.to+'.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('CSV 를 내보냈습니다');
}
window.exportSalesCsv = exportSalesCsv;

var firebaseConfig = {
  apiKey: "AIzaSyAQSp-HukEK-U5OElWr8jzoXzXqzI-MQNc",
  authDomain: "monfruit-sales.firebaseapp.com",
  projectId: "monfruit-sales",

  messagingSenderId: "120882085426",
  appId: "1:120882085426:web:2388fcac8bde3fb2ca862b"
};
var FIREBASE_ENABLED = (typeof firebase !== 'undefined') && !!firebaseConfig.apiKey;
var fs = null, fbAuth = null, _inited = false;

// Firestore 미러 캐시 어댑터 (LocalDB 와 동일 인터페이스, 읽기는 동기)
var CloudDB = {
  mode: 'cloud', cache: {},
  _c: function (coll) { return this.cache[coll] || (this.cache[coll] = {}); },
  list: function (coll) { return Object.values(this._c(coll)); },
  get: function (coll, id) { return this._c(coll)[id] || null; },
  put: function (coll, doc) {
    if (!doc.id) doc.id = genId(coll.slice(0, 4));
    var c = this._c(coll);
    if (!c[doc.id] && !doc.createdAt) doc.createdAt = Date.now();
    doc.updatedAt = Date.now();
    var merged = Object.assign({}, c[doc.id], doc);
    c[doc.id] = merged;
    try { fs.collection(coll).doc(String(doc.id)).set(merged, { merge: true })
      .catch(function (e) { console.warn('save fail', coll, e); toast('클라우드 저장 실패 — 네트워크 확인', 'err'); }); } catch (e) {}
    return merged;
  },
  del: function (coll, id) {
    delete this._c(coll)[id];
    try { fs.collection(coll).doc(String(id)).delete().catch(function () {}); } catch (e) {}
  },
  clearAll: function () {
    var self = this;
    COLLECTIONS.forEach(function (coll) {
      Object.keys(self._c(coll)).forEach(function (id) { try { fs.collection(coll).doc(String(id)).delete(); } catch (e) {} });
      self.cache[coll] = {};
    });
  },
  exportAll: function () { return JSON.stringify(this.cache, null, 2); },
  importAll: function (json) {
    var obj = JSON.parse(json), self = this;
    COLLECTIONS.forEach(function (coll) {
      var docs = obj[coll] || {}; self.cache[coll] = {};
      Object.keys(docs).forEach(function (id) { self.put(coll, docs[id]); });
    });
  }
};

async function cloudLoadAll() {
  for (var i = 0; i < COLLECTIONS.length; i++) {
    var coll = COLLECTIONS[i];
    var snap = await fs.collection(coll).get();
    var m = {}; snap.forEach(function (d) { m[d.id] = Object.assign({ id: d.id }, d.data()); });
    CloudDB.cache[coll] = m;
  }
}
function cloudSubscribe() {
  COLLECTIONS.forEach(function (coll) {
    try {
      fs.collection(coll).onSnapshot(function (snap) {
        var m = {}; snap.forEach(function (d) { m[d.id] = Object.assign({ id: d.id }, d.data()); });
        CloudDB.cache[coll] = m; scheduleRerender();
      }, function (e) { console.warn('snapshot', coll, e); });
    } catch (e) {}
  });
}
var _rerenderT = null;
function scheduleRerender() { clearTimeout(_rerenderT); _rerenderT = setTimeout(rerender, 250); }
function rerender() {
  refreshBadges();
  if (curTab === 'settings') renderSub(curSub);
  else if (curTab === 'sales') renderSales();
  else if (curTab === 'upload') renderUpload();
  else renderMain();
}

/* 로그인 */
function showLogin(msg) { $('#loginBox').classList.remove('hidden'); if (msg) $('#loginErr').textContent = msg; }
function hideLogin() { $('#loginBox').classList.add('hidden'); }
var LOGIN_EMAIL = 'owner@monfruit-sales.web';  // 화면엔 안 보이는 내부 고정 계정. 사용자는 비밀번호만 입력.
function doLogin() {
  var pin = ($('#loginPw').value || '').trim();
  if (!/^\d{4}$/.test(pin)) { $('#loginErr').textContent = '숫자 4자리를 입력하세요'; return; }
  var pw = 'mf' + pin;   // Firebase 최소 6자 규칙 충족용 내부 변환(화면엔 4자리만)
  $('#loginErr').textContent = '확인 중…';
  fbAuth.signInWithEmailAndPassword(LOGIN_EMAIL, pw).catch(function (e) {
    if (e.code === 'auth/operation-not-allowed') { $('#loginErr').textContent = '관리자 설정 필요: Firebase Authentication에서 "이메일/비밀번호"를 켜주세요'; return; }
    // 처음이면 이 비밀번호로 등록, 이미 있으면(=비밀번호 틀림) 오류
    fbAuth.createUserWithEmailAndPassword(LOGIN_EMAIL, pw).catch(function (e2) {
      if (e2.code === 'auth/email-already-in-use') $('#loginErr').textContent = '비밀번호가 틀렸습니다';
      else if (e2.code === 'auth/operation-not-allowed') $('#loginErr').textContent = '관리자 설정 필요: Authentication에서 "이메일/비밀번호"를 켜주세요';
      else if (e2.code === 'auth/weak-password') $('#loginErr').textContent = '비밀번호는 6자 이상이어야 합니다';
      else $('#loginErr').textContent = '오류: ' + e2.message;
    });
  });
}
window.cloudLogout = function () { if (fbAuth) fbAuth.signOut(); location.reload(); };
// 이 브라우저의 로컬(localStorage) 데이터를 클라우드로 업로드
window.uploadLocalToCloud = function () {
  var raw; try { raw = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  if (!raw) { toast('이 브라우저에 올릴 로컬 데이터가 없습니다', 'err'); return; }
  if (!confirm('이 브라우저(로컬)에 저장된 데이터를 클라우드로 올릴까요?\\n같은 항목은 덮어써집니다.')) return;
  var n = 0;
  COLLECTIONS.forEach(function (coll) { var docs = raw[coll] || {}; Object.keys(docs).forEach(function (id) { CloudDB.put(coll, docs[id]); n++; }); });
  toast(n + '건을 클라우드로 올렸습니다'); rerender();
};

function cloudBootstrap() {
  try { firebase.initializeApp(firebaseConfig); }
  catch (e) { console.error('firebase init', e); init(); return; }   // 실패 시 로컬 모드로
  fs = firebase.firestore(); fbAuth = firebase.auth();
  $('#loginBtn').addEventListener('click', doLogin);
  $('#loginPw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  fbAuth.onAuthStateChanged(async function (user) {
    if (user) {
      hideLogin();
      DB = CloudDB; window.__DB = CloudDB;
      try { await cloudLoadAll(); } catch (e) { toast('클라우드 로딩 실패: ' + e.message, 'err'); }
      if (!_inited) { init(); _inited = true; } else rerender();
      cloudSubscribe();
    } else {
      showLogin();
    }
  });
}

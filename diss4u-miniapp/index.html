<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      제스처 확대·축소 비활성 (체크리스트 항목). iOS 는 user-scalable=no 를 무시하므로
      base.css 의 touch-action 과 함께 걸어야 실제로 막힌다.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- OS 다크모드를 따라가지 않도록 못박는다. 미니앱은 라이트 모드 고정. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F5F6FA" />
    <title>친놀송</title>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header-left">
          <div class="header-orb" aria-hidden="true"></div>
          <div>
            <div class="brand">친놀송</div>
            <div class="brand-en">DISS4U</div>
          </div>
        </div>
        <div class="header-left">
          <button class="credit-chip" id="creditChip" type="button" hidden>
            <span aria-hidden="true">💎</span><span id="creditText">-</span>
          </button>
          <button class="icon-btn" id="settingsBtn" type="button" aria-label="설정" hidden>⚙️</button>
        </div>
      </header>

      <main id="screens"></main>

      <footer class="biz-footer">
        <div class="biz-brand">친놀송</div>
        <div class="biz-line">대표 김바니 · 사업자등록번호 228-70-00668</div>
        <div class="biz-line">상호 bodyhack · 통신판매업신고 제2024-경기김포-8528호</div>
        <div class="biz-line">주소 경기도 김포시 전원로 27, 102동 303호</div>
        <div class="biz-line">문의 diss4u.official@gmail.com · 070-8979-4886</div>
        <div class="biz-line" style="margin-top: 8px">
          <button class="btn-ghost" type="button" data-legal="terms" style="width:auto;padding:4px 6px;font-size:11px;">이용약관</button>
          <button class="btn-ghost" type="button" data-legal="privacy" style="width:auto;padding:4px 6px;font-size:11px;">개인정보처리방침</button>
          <button class="btn-ghost" type="button" data-legal="refund" style="width:auto;padding:4px 6px;font-size:11px;">환불정책</button>
        </div>
      </footer>
    </div>

    <div id="modals"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

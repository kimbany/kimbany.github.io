<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Veil LIVE — 실제 익명 매칭</title>
<style>
  :root{
    --bg:#FBF9F2; --surface:#FFFFFF; --surface2:#F3F0E7; --text:#2F2F2F;
    --dim:#9A9488; --border:#EAE5D8; --accent:#F28C28; --good:#6FAF5A; --warn:#D98B2B; --bad:#D64545;
    --me:#2F2F2F; --you:#FFFFFF; --grad:linear-gradient(135deg,#F5A24A,#F28C28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:#EFEBDF;color:var(--text);display:flex;align-items:center;justify-content:center}
  #app{position:relative;width:100%;max-width:440px;height:100dvh;max-height:920px;background:var(--bg);
    overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:none;cursor:default}
  input{font-family:inherit;font-size:16px;user-select:text;cursor:text}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  .screen{position:absolute;inset:0;flex-direction:column;background:var(--bg);display:none}
  .screen.active{display:flex}
  .pad{padding:20px}
  .grow{flex:1;overflow-y:auto}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1}
  h1{font-size:26px;margin:0 0 6px} h2{font-size:20px;margin:0 0 6px}
  .dim{color:var(--dim);font-size:14px;line-height:1.55}
  .btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--text);color:#fff;font-weight:700;font-size:16px;text-align:center;margin-top:10px;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--dim)}
  .btn:disabled{opacity:.4}
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border)}
  .ttl{font-weight:700;font-size:17px}
  .iconbtn{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
  .logo{width:76px;height:76px;border-radius:50%;background:var(--text);display:flex;align-items:center;justify-content:center;font-size:0;margin-bottom:18px}
  .field{width:100%;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);margin-top:8px}
  .label{font-size:13px;color:var(--dim);margin:16px 0 2px;font-weight:600}
  .chip{display:inline-flex;align-items:center;justify-content:center;padding:8px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-size:22px;margin:4px;cursor:pointer;width:44px;height:44px}
  .chip.on{outline:2px solid var(--accent)}
  .cdot{width:34px;height:34px;border-radius:50%;margin:4px;cursor:pointer;border:2px solid transparent}
  .cdot.on{border-color:#fff}
  .av{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}
  .pulse{width:150px;height:150px;border-radius:50%;background:var(--text);display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;box-shadow:0 0 0 0 rgba(47,47,47,.22);animation:pulse 1.1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,47,47,.22)}100%{box-shadow:0 0 0 34px rgba(47,47,47,0)}}
  .badge{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--dim)}
  .badge.live{background:var(--surface2);color:var(--text)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:12px}
  .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
  .b{max-width:78%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.4;word-break:break-word}
  .b.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:5px}
  .b.you{align-self:flex-start;background:var(--you);border:1px solid var(--border);border-bottom-left-radius:5px}
  .b.sys{align-self:center;background:transparent;color:var(--dim);font-size:12px;text-align:center;max-width:90%}
  .composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:var(--surface)}
  .composer input{flex:1;padding:12px;border-radius:22px;background:var(--bg);border:1px solid var(--border);color:var(--text)}
  .send{width:44px;height:44px;border-radius:50%;background:var(--text);font-size:18px;color:#fff;flex:0 0 auto;cursor:pointer}
  .demo-note{position:absolute;top:max(8px,env(safe-area-inset-top));right:10px;z-index:60;background:rgba(242,140,40,.18);color:var(--accent);font-size:10px;padding:4px 9px;border-radius:999px}
  .statusbar{padding:8px;text-align:center;font-size:12px;color:var(--dim);background:var(--surface)}
  #liveBanner{position:absolute;top:0;left:0;right:0;z-index:70;padding:8px 12px;font-size:12px;font-weight:700;text-align:center;display:none;white-space:pre-line}
  #liveBanner.show{display:block}
  #liveBanner.ok{background:#e6f4e6;color:#2f7d33}
  #liveBanner.bad{background:#fbe4df;color:var(--bad)}
</style>
</head>
<body>
<div id="app">
  <div class="demo-note">● LIVE v4</div>
  <div id="liveBanner"></div>

  <!-- 로딩 -->
  <section id="s-loading" class="screen active center pad">
    <div class="logo"></div>
    <p class="dim">연결 중…</p>
  </section>

  <!-- 시작: 프로필 -->
  <section id="s-start" class="screen">
    <div class="grow pad center">
      <div class="logo"></div>
      <h1>Veil <span style="color:var(--good);font-size:15px">LIVE</span></h1>
      <p class="dim" style="max-width:300px">실제 사람과 익명으로 매칭·대화하는 버전이에요.<br><b style="color:var(--text)">친구와 각자 열어서 동시에 매칭</b>하면 서로 연결됩니다.</p>
      <div style="width:100%;text-align:left">
        <div class="label">닉네임</div>
        <input id="liveNick" class="field" maxlength="12" placeholder="예: 달빛여우">
        <div class="label">아바타</div>
        <div id="liveAvatars"></div>
        <div class="label">배경 색상</div>
        <div id="liveColors"></div>
      </div>
    </div>
    <div class="pad"><button class="btn" onclick="enterLive()">입장하기</button></div>
  </section>

  <!-- 매칭 홈 -->
  <section id="s-match" class="screen">
    <div class="topbar"><span class="ttl">매칭</span><div style="margin-left:auto" class="badge live">🟢 대기 <span id="onlineN">0</span>명</div></div>
    <div class="grow center pad">
      <div id="myAv" class="av" style="width:80px;height:80px;border-radius:24px;font-size:40px;background:#F28C28">🦊</div>
      <h2 style="margin-top:12px" id="myNickView">달빛여우</h2>
      <p class="dim">매칭하기를 누르면 대기중인 상대와 연결돼요.</p>
      <div class="card dim" style="font-size:13px;text-align:center;width:100%">💡 테스트: 다른 폰(또는 시크릿창)에서도 이 페이지를 열고, 양쪽에서 <b style="color:var(--text)">매칭하기</b>를 누르세요.</div>
      <div style="width:100%"><button class="btn" onclick="startMatch()">매칭하기</button>
      <button class="btn ghost" onclick="go('s-start')">프로필 수정</button></div>
    </div>
  </section>

  <!-- 대기중 -->
  <section id="s-wait" class="screen center pad">
    <div class="pulse">🔍</div>
    <h2 style="margin-top:24px">상대를 찾는 중…</h2>
    <p class="dim">대기중인 다른 사용자와 매칭되면 바로 연결돼요.</p>
    <p class="dim">현재 대기 <b style="color:var(--good)"><span id="onlineN2">0</span></b>명</p>
    <p id="liveDebug" style="font-size:12px;white-space:pre-line;max-width:300px;margin-top:6px"></p>
    <button class="btn ghost" style="width:auto;padding:12px 28px;margin-top:20px" onclick="cancelWait()">취소</button>
  </section>

  <!-- 채팅 -->
  <section id="s-chat" class="screen">
    <div class="topbar">
      <button class="iconbtn" onclick="leaveLive()">‹</button>
      <div id="liveChatAv" class="av" style="width:34px;height:34px;border-radius:10px;font-size:18px;background:#3ba9ff">🐙</div>
      <div style="flex:1"><div class="ttl" id="liveChatName">상대</div></div>
      <div class="badge live">● 실시간</div>
    </div>
    <div class="statusbar" id="liveStatus">연결됨 · 익명 대화</div>
    <div id="liveMsgs" class="msgs"></div>
    <div class="composer">
      <input id="liveInput" placeholder="메시지 입력…" onkeydown="if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229)sendLive()">
      <button class="send" onclick="sendLive()">➤</button>
    </div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
  apiKey:"AIzaSyD8ZzWrBImCmuNGaJmSIAGbnOzKH9HkK5w",
  authDomain:"veil-chat-aad21.firebaseapp.com",
  databaseURL:"https://veil-chat-aad21-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"veil-chat-aad21",
  storageBucket:"veil-chat-aad21.firebasestorage.app",
  messagingSenderId:"761584144328",
  appId:"1:761584144328:web:0c7561589f812ad845bafd"
};
let auth=null, db=null, TS=null;
const ROOT='veil_live';
const AV=['🦊','🐰','🐼','🐯','🐸','🦉','🐙','🦄','🐧','🐨'];
const COLORS=['#F28C28','#b06cff','#ff6c9d','#ff9f6c','#36d399','#3ba9ff','#fbbd23','#8a8f9c'];
let myUid=null, me={nick:'',avatar:'🦊',bg:'#F28C28'}, matched=false, curSid=null, partner=null;

function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

// 프로필 선택 UI
function buildPickers(){
  const a=document.getElementById('liveAvatars');a.innerHTML='';
  AV.forEach(x=>{const b=document.createElement('button');b.className='chip'+(me.avatar===x?' on':'');b.textContent=x;
    b.onclick=()=>{me.avatar=x;a.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');};a.appendChild(b);});
  const c=document.getElementById('liveColors');c.innerHTML='';
  COLORS.forEach(x=>{const b=document.createElement('button');b.className='cdot'+(me.bg===x?' on':'');b.style.background=x;
    b.onclick=()=>{me.bg=x;c.querySelectorAll('.cdot').forEach(d=>d.classList.remove('on'));b.classList.add('on');};c.appendChild(b);});
}

(function initFB(){
  if(typeof firebase==='undefined'){ document.getElementById('s-loading').innerHTML='<div class="pad center" style="flex:1"><p class="dim">네트워크 오류로 연결하지 못했어요.<br>새로고침 해주세요.</p></div>'; return; }
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth(); db=firebase.database(); TS=firebase.database.ServerValue.TIMESTAMP;
  auth.signInAnonymously().catch(e=>{document.getElementById('s-loading').innerHTML='<div class="pad center" style="flex:1"><p class="dim">로그인 실패: '+e.code+'<br>Firebase 콘솔에서 <b>익명 로그인(Anonymous)</b>을 켜주세요.</p></div>';});
  auth.onAuthStateChanged(u=>{
    if(!u)return;
    myUid=u.uid;
    buildPickers();
    const savedNick=localStorage.getItem('veil_live_nick'); if(savedNick)document.getElementById('liveNick').value=savedNick;
    go('s-start');
    // 서버 연결·권한 자가진단 (읽기 테스트)
    db.ref(ROOT+'/queue').once('value')
      .then(()=>banner('서버 연결 정상 · 매칭 가능','ok'))
      .catch(e=>banner('서버 권한 오류('+e.code+')\nFirebase 콘솔에서 DB 규칙(veil_live)을 게시하세요.','bad'));
    db.ref(ROOT+'/queue').on('value',
      s=>{ const n=s.numChildren(); const e1=document.getElementById('onlineN'),e2=document.getElementById('onlineN2'); if(e1)e1.textContent=n; if(e2)e2.textContent=n; },
      err=>{ liveDbg('⚠ 대기열 읽기 거부: '+err.code); banner('서버 권한 오류('+err.code+')\nDB 규칙(veil_live)을 게시하세요.','bad'); });
  });
})();
function banner(t,kind){const e=document.getElementById('liveBanner');if(!e)return;e.textContent=(kind==='ok'?'✅ ':'❌ ')+t;e.className='show '+kind;}
function liveDbg(t){const e=document.getElementById('liveDebug');if(e)e.textContent=t;if(t)console.log('[veil-live]',t)}
// 뒤로가기/화면복원(bfcache)으로 멈춘 화면이 되살아나면 강제 새로고침
window.addEventListener('pageshow', e=>{ try{ const nav=(performance.getEntriesByType('navigation')||[])[0]; if(e.persisted || (nav&&nav.type==='back_forward')) location.reload(); }catch(_){ if(e.persisted) location.reload(); } });
// 페이지가 다시 보일 때(탭 복귀) 로그인 안 된 상태로 매칭/채팅 화면이 떠 있으면 초기화
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !myUid){ const s=document.querySelector('.screen.active'); if(s && s.id!=='s-loading' && s.id!=='s-start') location.reload(); } });
// 로그인이 6초 안에 안 되면 안내
setTimeout(()=>{ if(!myUid){ const l=document.getElementById('s-loading'); if(l&&l.classList.contains('active')) l.innerHTML='<div class="pad center" style="flex:1"><p class="dim">로그인이 지연되고 있어요.<br>Firebase 콘솔에서 <b>익명 로그인(Anonymous)</b>이 켜져 있는지 확인하고<br>새로고침 해주세요.</p></div>'; } }, 6000);

function enterLive(){
  me.nick=(document.getElementById('liveNick').value||'').trim()||'익명';
  localStorage.setItem('veil_live_nick',me.nick);
  document.getElementById('myNickView').textContent=me.nick;
  const av=document.getElementById('myAv'); av.textContent=me.avatar; av.style.background=me.bg;
  go('s-match');
}

function startMatch(){
  matched=false;
  go('s-wait');
  const q=db.ref(ROOT+'/queue/'+myUid);
  liveDbg('대기열 등록 중…');
  q.set({uid:myUid, nick:me.nick, avatar:me.avatar, bg:me.bg, ts:TS})
    .then(()=>liveDbg('대기열 등록 완료 · 상대를 기다리는 중'))
    .catch(e=>liveDbg('⚠ 대기열 등록 실패: '+(e.code||e.message)+'\nFirebase DB 규칙(veil_live)을 게시하세요.'));
  q.onDisconnect().remove();
  // 내가 다른 사람에게 claim 당하면 세션 시작
  db.ref(ROOT+'/queue/'+myUid+'/session').on('value', s=>{ const v=s.val(); if(v&&v.sid&&!matched) startSession(v.sid, v.by); });
  // 큐가 바뀔 때마다 매칭 시도
  db.ref(ROOT+'/queue').on('value', ()=>tryMatch());
  tryMatch();
}

function tryMatch(){
  if(matched)return;
  db.ref(ROOT+'/queue').once('value').then(snap=>{
    if(matched)return;
    const items=[];
    snap.forEach(c=>{ const v=c.val(); if(v&&v.uid&&v.uid!==myUid&&!v.session&&v.uid<myUid) items.push(v); }); // uid 작은 쪽만 claim → 중복 매칭 방지
    if(!items.length)return;
    items.sort((a,b)=>(a.ts||0)-(b.ts||0));
    const cand=items[0];
    const sid=db.ref(ROOT+'/sessions').push().key;
    db.ref(ROOT+'/queue/'+cand.uid+'/session').transaction(cur=> cur===null ? {sid:sid, by:myUid} : undefined)
      .then(res=>{
        if(matched)return;
        const val=res.snapshot.val();
        if(res.committed && val && val.sid===sid && val.by===myUid){
          // claim 성공 → 세션 생성 후 내 세션도 설정
          db.ref(ROOT+'/sessions/'+sid).set({
            members:{[myUid]:true,[cand.uid]:true},
            profiles:{[myUid]:{nick:me.nick,avatar:me.avatar,bg:me.bg},[cand.uid]:{nick:cand.nick,avatar:cand.avatar,bg:cand.bg}},
            createdAt:TS
          }).then(()=>{ db.ref(ROOT+'/queue/'+myUid+'/session').set({sid:sid, by:cand.uid}); startSession(sid, cand.uid); });
        }
      }).catch(()=>{});
  });
}

function detachQueue(){
  db.ref(ROOT+'/queue').off();
  if(myUid){ db.ref(ROOT+'/queue/'+myUid+'/session').off(); db.ref(ROOT+'/queue/'+myUid).onDisconnect().cancel(); db.ref(ROOT+'/queue/'+myUid).remove(); }
}

function startSession(sid, partnerUid){
  if(matched)return; matched=true; curSid=sid; partner=partnerUid;
  detachQueue();
  document.getElementById('liveMsgs').innerHTML='';
  document.getElementById('liveStatus').textContent='연결됨 · 익명 대화';
  // 상대 프로필
  db.ref(ROOT+'/sessions/'+sid+'/profiles/'+partnerUid).on('value', s=>{ const v=s.val(); if(v){ document.getElementById('liveChatName').textContent=v.nick||'상대'; const a=document.getElementById('liveChatAv'); a.textContent=v.avatar||'🙂'; a.style.background=v.bg||'#3ba9ff'; } });
  // 메시지 실시간
  db.ref(ROOT+'/sessions/'+sid+'/messages').on('child_added', s=>{ addMsg(s.val()); });
  // 상대 나감 감지
  db.ref(ROOT+'/sessions/'+sid+'/left').on('value', s=>{ const v=s.val()||{}; if(v[partnerUid]){ document.getElementById('liveStatus').textContent='상대가 대화를 나갔어요'; addSys('상대가 대화를 나갔어요.'); } });
  addSys('🎉 매칭됐어요! 실시간으로 대화해보세요.');
  go('s-chat');
}

function addMsg(m){ if(!m)return; const c=document.getElementById('liveMsgs'); const d=document.createElement('div'); d.className='b '+(m.from===myUid?'me':'you'); d.textContent=m.text; c.appendChild(d); c.scrollTop=c.scrollHeight; }
function addSys(x){ const c=document.getElementById('liveMsgs'); const d=document.createElement('div'); d.className='b sys'; d.textContent=x; c.appendChild(d); c.scrollTop=c.scrollHeight; }

function sendLive(){
  const i=document.getElementById('liveInput'); const t=(i.value||'').trim(); if(!t||!curSid)return;
  db.ref(ROOT+'/sessions/'+curSid+'/messages').push({from:myUid, text:t, ts:TS});
  i.value='';
}

function leaveLive(){
  if(curSid){ db.ref(ROOT+'/sessions/'+curSid+'/left/'+myUid).set(true); db.ref(ROOT+'/sessions/'+curSid).off(); }
  matched=false; curSid=null; partner=null;
  go('s-match');
}
function cancelWait(){ detachQueue(); matched=false; go('s-match'); }
window.addEventListener('pagehide', ()=>{ if(curSid&&myUid)db.ref(ROOT+'/sessions/'+curSid+'/left/'+myUid).set(true); });
</script>
</body>
</html>

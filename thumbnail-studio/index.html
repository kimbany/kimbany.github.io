<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>썸네일 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&family=Jua&family=Do+Hyeon&family=Gugi&family=Song+Myung&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel2: #1f232c;
    --line: #2a2f3a;
    --text: #e8eaf0;
    --sub: #8b93a5;
    --accent: #6c8cff;
    --accent2: #8f6cff;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 상단 바 ─────────────────────────── */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 900; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent); }
  .tabs { display: flex; gap: 6px; margin-left: 8px; }
  .tab {
    padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 700;
    color: var(--sub); cursor: pointer; border: 1px solid transparent;
    background: none; font-family: inherit;
  }
  .tab.active { color: var(--text); background: var(--panel2); border-color: var(--line); }
  .tab.soon { cursor: not-allowed; opacity: 0.55; }
  .tab .badge {
    font-size: 10px; color: var(--accent2); margin-left: 4px; font-weight: 700;
  }
  .top-right { margin-left: auto; display: flex; gap: 8px; }
  .btn {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: #fff;
  }

  /* ── 본문 레이아웃 ────────────────────── */
  main { flex: 1; display: flex; min-height: 0; }

  /* 캔버스 영역 */
  .stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; min-width: 0; position: relative;
    background:
      radial-gradient(circle at 30% 20%, rgba(108,140,255,.05), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(143,108,255,.05), transparent 50%);
  }
  .canvas-wrap { position: relative; box-shadow: 0 12px 48px rgba(0,0,0,.5); border-radius: 4px; }
  #canvas { display: block; border-radius: 4px; cursor: default; max-width: 100%; }
  #canvas.dragging { cursor: grabbing; }
  #canvas.hover-layer { cursor: grab; }
  .stage-hint {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--sub); white-space: nowrap;
  }

  /* 우측 패널 */
  aside {
    width: 340px; flex-shrink: 0; background: var(--panel);
    border-left: 1px solid var(--line); overflow-y: auto; padding: 16px;
  }
  aside::-webkit-scrollbar { width: 8px; }
  aside::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .section { margin-bottom: 22px; }
  .section > h2 {
    font-size: 12px; font-weight: 700; color: var(--sub);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .section > h2::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row label { font-size: 12px; color: var(--sub); width: 64px; flex-shrink: 0; }
  .row input[type="text"], .row input[type="number"], .row select, .row textarea {
    flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px;
    font-family: inherit; outline: none;
  }
  .row input:focus, .row select:focus, .row textarea:focus { border-color: var(--accent); }
  .row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .row input[type="color"] {
    width: 34px; height: 34px; padding: 2px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel2); cursor: pointer; flex-shrink: 0;
  }
  .row .val { font-size: 11px; color: var(--sub); width: 36px; text-align: right; flex-shrink: 0; }

  /* 프리셋 그리드 */
  .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .preset {
    padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel2); cursor: pointer; text-align: left;
    font-family: inherit; color: var(--text); transition: border-color .15s;
  }
  .preset:hover { border-color: var(--sub); }
  .preset.active { border-color: var(--accent); background: rgba(108,140,255,.1); }
  .preset .name { font-size: 12px; font-weight: 700; display: block; }
  .preset .dim { font-size: 11px; color: var(--sub); }

  /* 배경 타입 선택 */
  .seg { display: flex; background: var(--panel2); border-radius: 8px; padding: 3px; margin-bottom: 10px; border: 1px solid var(--line); }
  .seg button {
    flex: 1; padding: 7px 0; border: none; background: none; color: var(--sub);
    font-size: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; font-family: inherit;
  }
  .seg button.active { background: var(--accent); color: #fff; }

  .grad-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .grad-chip {
    aspect-ratio: 1; border-radius: 8px; cursor: pointer;
    border: 2px solid transparent;
  }
  .grad-chip.active { border-color: #fff; }

  .upload-box {
    border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px;
    text-align: center; color: var(--sub); font-size: 12px; cursor: pointer;
    transition: border-color .15s;
  }
  .upload-box:hover { border-color: var(--accent); color: var(--text); }

  /* 레이어 목록 */
  .layer-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    margin-bottom: 6px; cursor: pointer; font-size: 13px;
  }
  .layer-item.active { border-color: var(--accent); }
  .layer-item .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-item .del {
    background: none; border: none; color: var(--sub); cursor: pointer;
    font-size: 15px; padding: 2px 4px; flex-shrink: 0;
  }
  .layer-item .del:hover { color: #ff6b6b; }
  .add-layer {
    width: 100%; padding: 9px; border-radius: 8px; border: 1.5px dashed var(--line);
    background: none; color: var(--sub); font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .add-layer:hover { border-color: var(--accent); color: var(--text); }

  .empty-note { font-size: 12px; color: var(--sub); text-align: center; padding: 8px 0; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .checkbox-row input { accent-color: var(--accent); width: 15px; height: 15px; }

  @media (max-width: 800px) {
    main { flex-direction: column; overflow-y: auto; }
    .stage { padding: 14px; min-height: 45vh; flex: none; }
    aside { width: 100%; border-left: none; border-top: 1px solid var(--line); }
    body { overflow: auto; height: auto; min-height: 100vh; }
  }
</style>
</head>
<body>

<header>
  <h1>썸네일 <span>스튜디오</span></h1>
  <nav class="tabs">
    <button class="tab active">🎨 썸네일</button>
    <button class="tab soon" title="곧 추가될 기능입니다">📄 상세페이지 <span class="badge">준비중</span></button>
  </nav>
  <div class="top-right">
    <button class="btn" id="btnReset">초기화</button>
    <button class="btn primary" id="btnDownload">⬇ PNG 다운로드</button>
  </div>
</header>

<main>
  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <div class="stage-hint">텍스트를 클릭해 선택하고, 드래그해서 위치를 옮길 수 있어요</div>
  </div>

  <aside>
    <!-- 사이즈 -->
    <div class="section">
      <h2>사이즈</h2>
      <div class="preset-grid" id="presetGrid"></div>
      <div class="row" style="margin-top:8px">
        <label>커스텀</label>
        <input type="number" id="customW" min="100" max="4096" placeholder="너비">
        <span style="color:var(--sub)">×</span>
        <input type="number" id="customH" min="100" max="4096" placeholder="높이">
      </div>
    </div>

    <!-- 배경 -->
    <div class="section">
      <h2>배경</h2>
      <div class="seg" id="bgSeg">
        <button data-type="color" class="active">단색</button>
        <button data-type="gradient">그라디언트</button>
        <button data-type="image">이미지</button>
      </div>

      <div id="bgColorPanel">
        <div class="row">
          <label>색상</label>
          <input type="color" id="bgColor" value="#22283f">
          <input type="text" id="bgColorHex" value="#22283f" style="flex:1">
        </div>
      </div>

      <div id="bgGradPanel" style="display:none">
        <div class="grad-grid" id="gradGrid"></div>
      </div>

      <div id="bgImagePanel" style="display:none">
        <div class="upload-box" id="uploadBox">
          클릭해서 이미지 업로드<br><small>JPG / PNG / WebP</small>
        </div>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <div class="row" style="margin-top:10px">
          <label>어둡게</label>
          <input type="range" id="dimRange" min="0" max="80" value="30">
          <span class="val" id="dimVal">30%</span>
        </div>
      </div>
    </div>

    <!-- 텍스트 레이어 -->
    <div class="section">
      <h2>텍스트</h2>
      <div id="layerList"></div>
      <button class="add-layer" id="btnAddLayer">＋ 텍스트 추가</button>
    </div>

    <!-- 선택된 텍스트 편집 -->
    <div class="section" id="editSection" style="display:none">
      <h2>선택된 텍스트</h2>
      <div class="row">
        <label>내용</label>
        <textarea id="tText" rows="2"></textarea>
      </div>
      <div class="row">
        <label>폰트</label>
        <select id="tFont">
          <option value="'Noto Sans KR', sans-serif">노토 산스 (기본)</option>
          <option value="'Black Han Sans', sans-serif">블랙 한 산스 (임팩트)</option>
          <option value="'Jua', sans-serif">주아 (귀여움)</option>
          <option value="'Do Hyeon', sans-serif">도현 (또박또박)</option>
          <option value="'Gugi', sans-serif">구기 (개성)</option>
          <option value="'Song Myung', serif">송명 (명조)</option>
          <option value="'Nanum Pen Script', cursive">나눔 손글씨</option>
        </select>
      </div>
      <div class="row">
        <label>크기</label>
        <input type="range" id="tSize" min="16" max="300" value="72">
        <span class="val" id="tSizeVal">72</span>
      </div>
      <div class="row">
        <label>굵기</label>
        <select id="tWeight">
          <option value="400">보통</option>
          <option value="700" selected>굵게</option>
          <option value="900">아주 굵게</option>
        </select>
      </div>
      <div class="row">
        <label>색상</label>
        <input type="color" id="tColor" value="#ffffff">
        <input type="text" id="tColorHex" value="#ffffff" style="flex:1">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="tStroke">
        <label for="tStroke" style="width:auto;cursor:pointer">외곽선</label>
        <input type="color" id="tStrokeColor" value="#000000" style="width:30px;height:30px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="tShadow" checked>
        <label for="tShadow" style="width:auto;cursor:pointer">그림자</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="tLabel">
        <label for="tLabel" style="width:auto;cursor:pointer">배경 라벨</label>
        <input type="color" id="tLabelColor" value="#ff5252" style="width:30px;height:30px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer">
      </div>
      <div class="row">
        <label>정렬</label>
        <div class="seg" style="flex:1;margin:0" id="alignSeg">
          <button data-align="left">왼쪽</button>
          <button data-align="center" class="active">가운데</button>
          <button data-align="right">오른쪽</button>
        </div>
      </div>
    </div>
  </aside>
</main>

<script>
'use strict';

/* ───────────────────────── 상태 ───────────────────────── */
const PRESETS = [
  { name: '유튜브',   dim: '1280 × 720',  w: 1280, h: 720 },
  { name: '정방형',   dim: '1080 × 1080', w: 1080, h: 1080 },
  { name: '쇼핑몰',   dim: '1080 × 1350', w: 1080, h: 1350 },
  { name: '블로그',   dim: '900 × 600',   w: 900,  h: 600 },
];

const GRADIENTS = [
  ['#667eea', '#764ba2'], ['#f093fb', '#f5576c'], ['#4facfe', '#00f2fe'],
  ['#43e97b', '#38f9d7'], ['#fa709a', '#fee140'], ['#30cfd0', '#330867'],
  ['#ff9a9e', '#fecfef'], ['#a18cd1', '#fbc2eb'], ['#ffecd2', '#fcb69f'],
  ['#ff6e7f', '#bfe9ff'], ['#0ba360', '#3cba92'], ['#2b5876', '#4e4376'],
];

const state = {
  w: 1280, h: 720,
  presetIdx: 0,
  bg: { type: 'color', color: '#22283f', gradIdx: 0, image: null, dim: 0.3 },
  layers: [],
  selected: -1,
};

let layerSeq = 0;
function makeLayer(text, opts = {}) {
  return Object.assign({
    id: ++layerSeq,
    text,
    x: 0.5, y: 0.5,           // 캔버스 대비 비율 좌표 (중심점)
    size: 72,
    font: "'Black Han Sans', sans-serif",
    weight: '700',
    color: '#ffffff',
    stroke: false, strokeColor: '#000000',
    shadow: true,
    label: false, labelColor: '#ff5252',
    align: 'center',
  }, opts);
}

/* ───────────────────────── 캔버스 렌더링 ───────────────────────── */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function fitCanvasDisplay() {
  const stage = document.querySelector('.stage');
  const maxW = stage.clientWidth - 48;
  const maxH = stage.clientHeight - 60;
  const scale = Math.min(maxW / state.w, maxH / state.h, 1);
  canvas.style.width = Math.round(state.w * scale) + 'px';
  canvas.style.height = Math.round(state.h * scale) + 'px';
}

function drawBackground() {
  const { w, h } = state;
  const bg = state.bg;
  if (bg.type === 'color') {
    ctx.fillStyle = bg.color;
    ctx.fillRect(0, 0, w, h);
  } else if (bg.type === 'gradient') {
    const [c1, c2] = GRADIENTS[bg.gradIdx];
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, c1);
    g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  } else if (bg.type === 'image') {
    if (bg.image) {
      // cover 방식으로 채우기
      const img = bg.image;
      const scale = Math.max(w / img.width, h / img.height);
      const dw = img.width * scale, dh = img.height * scale;
      ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
      if (bg.dim > 0) {
        ctx.fillStyle = `rgba(0,0,0,${bg.dim})`;
        ctx.fillRect(0, 0, w, h);
      }
    } else {
      ctx.fillStyle = '#333a4d';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.font = `${Math.round(state.w / 40)}px 'Noto Sans KR'`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('이미지를 업로드하세요', w / 2, h / 2);
    }
  }
}

function layerFontString(layer) {
  return `${layer.weight} ${layer.size}px ${layer.font}`;
}

// 각 레이어의 화면상 바운딩 박스 (드래그 판정용)
function layerBounds(layer) {
  ctx.font = layerFontString(layer);
  const lines = layer.text.split('\n');
  const lineHeight = layer.size * 1.25;
  let maxW = 0;
  for (const line of lines) {
    maxW = Math.max(maxW, ctx.measureText(line).width);
  }
  const totalH = lineHeight * lines.length;
  const cx = layer.x * state.w, cy = layer.y * state.h;
  const pad = layer.label ? layer.size * 0.35 : 0;
  return {
    x: cx - maxW / 2 - pad,
    y: cy - totalH / 2 - pad,
    w: maxW + pad * 2,
    h: totalH + pad * 2,
  };
}

function drawLayer(layer, isSelected) {
  const lines = layer.text.split('\n');
  const lineHeight = layer.size * 1.25;
  const totalH = lineHeight * lines.length;
  const cx = layer.x * state.w, cy = layer.y * state.h;

  ctx.font = layerFontString(layer);
  ctx.textBaseline = 'middle';

  // 배경 라벨
  if (layer.label) {
    const b = layerBounds(layer);
    ctx.save();
    ctx.fillStyle = layer.labelColor;
    const r = Math.min(16, b.h * 0.2);
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, r);
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  if (layer.shadow) {
    ctx.shadowColor = 'rgba(0,0,0,.45)';
    ctx.shadowBlur = layer.size * 0.12;
    ctx.shadowOffsetY = layer.size * 0.05;
  }

  let maxW = 0;
  for (const line of lines) maxW = Math.max(maxW, ctx.measureText(line).width);

  lines.forEach((line, i) => {
    const ly = cy - totalH / 2 + lineHeight * (i + 0.5);
    let lx, align;
    if (layer.align === 'left')       { lx = cx - maxW / 2; align = 'left'; }
    else if (layer.align === 'right') { lx = cx + maxW / 2; align = 'right'; }
    else                              { lx = cx; align = 'center'; }
    ctx.textAlign = align;

    if (layer.stroke) {
      ctx.lineWidth = Math.max(2, layer.size * 0.08);
      ctx.strokeStyle = layer.strokeColor;
      ctx.lineJoin = 'round';
      ctx.strokeText(line, lx, ly);
    }
    ctx.fillStyle = layer.color;
    ctx.fillText(line, lx, ly);
  });
  ctx.restore();

  // 선택 표시 (내보내기 시에는 그리지 않음)
  if (isSelected && !exporting) {
    const b = layerBounds(layer);
    ctx.save();
    ctx.strokeStyle = '#6c8cff';
    ctx.lineWidth = Math.max(2, state.w / 640);
    ctx.setLineDash([8, 6]);
    ctx.strokeRect(b.x - 6, b.y - 6, b.w + 12, b.h + 12);
    ctx.restore();
  }
}

let exporting = false;
function render() {
  canvas.width = state.w;
  canvas.height = state.h;
  drawBackground();
  state.layers.forEach((layer, i) => drawLayer(layer, i === state.selected));
  fitCanvasDisplay();
}

/* ───────────────────────── 사이즈 프리셋 ───────────────────────── */
const presetGrid = document.getElementById('presetGrid');
PRESETS.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.className = 'preset' + (i === 0 ? ' active' : '');
  btn.innerHTML = `<span class="name">${p.name}</span><span class="dim">${p.dim}</span>`;
  btn.addEventListener('click', () => {
    state.presetIdx = i;
    state.w = p.w; state.h = p.h;
    document.getElementById('customW').value = '';
    document.getElementById('customH').value = '';
    presetGrid.querySelectorAll('.preset').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
  presetGrid.appendChild(btn);
});

function applyCustomSize() {
  const w = parseInt(document.getElementById('customW').value, 10);
  const h = parseInt(document.getElementById('customH').value, 10);
  if (w >= 100 && h >= 100 && w <= 4096 && h <= 4096) {
    state.w = w; state.h = h;
    presetGrid.querySelectorAll('.preset').forEach(b => b.classList.remove('active'));
    render();
  }
}
document.getElementById('customW').addEventListener('change', applyCustomSize);
document.getElementById('customH').addEventListener('change', applyCustomSize);

/* ───────────────────────── 배경 컨트롤 ───────────────────────── */
const bgSeg = document.getElementById('bgSeg');
bgSeg.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  bgSeg.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.bg.type = btn.dataset.type;
  document.getElementById('bgColorPanel').style.display = state.bg.type === 'color' ? '' : 'none';
  document.getElementById('bgGradPanel').style.display = state.bg.type === 'gradient' ? '' : 'none';
  document.getElementById('bgImagePanel').style.display = state.bg.type === 'image' ? '' : 'none';
  render();
});

// 단색
const bgColor = document.getElementById('bgColor');
const bgColorHex = document.getElementById('bgColorHex');
bgColor.addEventListener('input', () => {
  state.bg.color = bgColor.value;
  bgColorHex.value = bgColor.value;
  render();
});
bgColorHex.addEventListener('change', () => {
  if (/^#[0-9a-fA-F]{6}$/.test(bgColorHex.value.trim())) {
    state.bg.color = bgColorHex.value.trim();
    bgColor.value = state.bg.color;
    render();
  }
});

// 그라디언트
const gradGrid = document.getElementById('gradGrid');
GRADIENTS.forEach((g, i) => {
  const chip = document.createElement('div');
  chip.className = 'grad-chip' + (i === 0 ? ' active' : '');
  chip.style.background = `linear-gradient(135deg, ${g[0]}, ${g[1]})`;
  chip.addEventListener('click', () => {
    state.bg.gradIdx = i;
    gradGrid.querySelectorAll('.grad-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    render();
  });
  gradGrid.appendChild(chip);
});

// 이미지
const fileInput = document.getElementById('fileInput');
document.getElementById('uploadBox').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    state.bg.image = img;
    URL.revokeObjectURL(img.src);
    render();
  };
  img.src = URL.createObjectURL(file);
});
const dimRange = document.getElementById('dimRange');
dimRange.addEventListener('input', () => {
  state.bg.dim = dimRange.value / 100;
  document.getElementById('dimVal').textContent = dimRange.value + '%';
  render();
});

/* ───────────────────────── 레이어 목록 ───────────────────────── */
const layerList = document.getElementById('layerList');

function renderLayerList() {
  layerList.innerHTML = '';
  if (state.layers.length === 0) {
    layerList.innerHTML = '<div class="empty-note">텍스트를 추가해보세요</div>';
    return;
  }
  state.layers.forEach((layer, i) => {
    const item = document.createElement('div');
    item.className = 'layer-item' + (i === state.selected ? ' active' : '');
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = layer.text.replace(/\n/g, ' ') || '(빈 텍스트)';
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = '삭제';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      state.layers.splice(i, 1);
      if (state.selected >= state.layers.length) state.selected = state.layers.length - 1;
      renderLayerList(); syncEditPanel(); render();
    });
    item.addEventListener('click', () => selectLayer(i));
    item.append(txt, del);
    layerList.appendChild(item);
  });
}

function selectLayer(i) {
  state.selected = i;
  renderLayerList();
  syncEditPanel();
  render();
}

document.getElementById('btnAddLayer').addEventListener('click', () => {
  const n = state.layers.length;
  const layer = makeLayer('새 텍스트', {
    y: 0.35 + n * 0.15,
    size: n === 0 ? Math.round(state.w / 10) : Math.round(state.w / 18),
  });
  state.layers.push(layer);
  selectLayer(state.layers.length - 1);
});

/* ───────────────────────── 편집 패널 ↔ 상태 동기화 ───────────────────────── */
const editSection = document.getElementById('editSection');
const el = (id) => document.getElementById(id);

function syncEditPanel() {
  const layer = state.layers[state.selected];
  if (!layer) { editSection.style.display = 'none'; return; }
  editSection.style.display = '';
  el('tText').value = layer.text;
  el('tFont').value = layer.font;
  el('tSize').value = layer.size;
  el('tSizeVal').textContent = layer.size;
  el('tWeight').value = layer.weight;
  el('tColor').value = layer.color;
  el('tColorHex').value = layer.color;
  el('tStroke').checked = layer.stroke;
  el('tStrokeColor').value = layer.strokeColor;
  el('tShadow').checked = layer.shadow;
  el('tLabel').checked = layer.label;
  el('tLabelColor').value = layer.labelColor;
  document.querySelectorAll('#alignSeg button').forEach(b =>
    b.classList.toggle('active', b.dataset.align === layer.align));
}

function withLayer(fn) {
  const layer = state.layers[state.selected];
  if (!layer) return;
  fn(layer);
  render();
}

el('tText').addEventListener('input', () => withLayer(l => { l.text = el('tText').value; renderLayerList(); }));
el('tFont').addEventListener('change', () => withLayer(l => { l.font = el('tFont').value; }));
el('tSize').addEventListener('input', () => withLayer(l => {
  l.size = parseInt(el('tSize').value, 10);
  el('tSizeVal').textContent = l.size;
}));
el('tWeight').addEventListener('change', () => withLayer(l => { l.weight = el('tWeight').value; }));
el('tColor').addEventListener('input', () => withLayer(l => {
  l.color = el('tColor').value; el('tColorHex').value = l.color;
}));
el('tColorHex').addEventListener('change', () => withLayer(l => {
  const v = el('tColorHex').value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(v)) { l.color = v; el('tColor').value = v; }
}));
el('tStroke').addEventListener('change', () => withLayer(l => { l.stroke = el('tStroke').checked; }));
el('tStrokeColor').addEventListener('input', () => withLayer(l => { l.strokeColor = el('tStrokeColor').value; }));
el('tShadow').addEventListener('change', () => withLayer(l => { l.shadow = el('tShadow').checked; }));
el('tLabel').addEventListener('change', () => withLayer(l => { l.label = el('tLabel').checked; }));
el('tLabelColor').addEventListener('input', () => withLayer(l => { l.labelColor = el('tLabelColor').value; }));

document.getElementById('alignSeg').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  withLayer(l => { l.align = btn.dataset.align; });
  syncEditPanel();
});

/* ───────────────────────── 캔버스 드래그 ───────────────────────── */
let dragging = false;
let dragOffset = { x: 0, y: 0 };

function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / rect.width * state.w,
    y: (e.clientY - rect.top) / rect.height * state.h,
  };
}

function hitLayer(pos) {
  // 위쪽(나중에 그린) 레이어부터 판정
  for (let i = state.layers.length - 1; i >= 0; i--) {
    const b = layerBounds(state.layers[i]);
    if (pos.x >= b.x && pos.x <= b.x + b.w && pos.y >= b.y && pos.y <= b.y + b.h) return i;
  }
  return -1;
}

canvas.addEventListener('pointerdown', (e) => {
  const pos = canvasPos(e);
  const idx = hitLayer(pos);
  if (idx >= 0) {
    selectLayer(idx);
    const layer = state.layers[idx];
    dragging = true;
    dragOffset.x = pos.x - layer.x * state.w;
    dragOffset.y = pos.y - layer.y * state.h;
    canvas.classList.add('dragging');
    canvas.setPointerCapture(e.pointerId);
  } else {
    state.selected = -1;
    renderLayerList(); syncEditPanel(); render();
  }
});

canvas.addEventListener('pointermove', (e) => {
  const pos = canvasPos(e);
  if (dragging) {
    withLayer(l => {
      l.x = Math.min(1, Math.max(0, (pos.x - dragOffset.x) / state.w));
      l.y = Math.min(1, Math.max(0, (pos.y - dragOffset.y) / state.h));
    });
  } else {
    canvas.classList.toggle('hover-layer', hitLayer(pos) >= 0);
  }
});

canvas.addEventListener('pointerup', () => {
  dragging = false;
  canvas.classList.remove('dragging');
});

/* ───────────────────────── 다운로드 / 초기화 ───────────────────────── */
document.getElementById('btnDownload').addEventListener('click', () => {
  exporting = true;
  render();
  canvas.toBlob((blob) => {
    exporting = false;
    render();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `thumbnail_${state.w}x${state.h}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
  }, 'image/png');
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (!confirm('작업 내용을 모두 초기화할까요?')) return;
  state.bg = { type: 'color', color: '#22283f', gradIdx: 0, image: null, dim: 0.3 };
  state.layers = [];
  state.selected = -1;
  bgSeg.querySelector('[data-type="color"]').click();
  bgColor.value = bgColorHex.value = '#22283f';
  initDefault();
});

/* ───────────────────────── 초기화 ───────────────────────── */
function initDefault() {
  state.layers = [
    makeLayer('여기에 제목 입력', { y: 0.42, size: Math.round(state.w / 9) }),
    makeLayer('부제목을 입력하세요', {
      y: 0.62, size: Math.round(state.w / 24),
      font: "'Noto Sans KR', sans-serif", color: '#ffd76c', shadow: true,
    }),
  ];
  state.bg.type = 'gradient';
  bgSeg.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  bgSeg.querySelector('[data-type="gradient"]').classList.add('active');
  document.getElementById('bgColorPanel').style.display = 'none';
  document.getElementById('bgGradPanel').style.display = '';
  document.getElementById('bgImagePanel').style.display = 'none';
  selectLayer(0);
}

window.addEventListener('resize', fitCanvasDisplay);

// 웹폰트 로드 후 다시 그리기 (폰트가 늦게 로드되면 measureText가 어긋남)
document.fonts.ready.then(render);
['Black Han Sans', 'Jua', 'Do Hyeon', 'Gugi', 'Song Myung', 'Nanum Pen Script', 'Noto Sans KR']
  .forEach(f => document.fonts.load(`700 32px '${f}'`).then(render).catch(() => {}));

initDefault();
</script>
</body>
</html>

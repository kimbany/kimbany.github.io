<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>적립금 현황 · channel-sync</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f6f6f4;
    --surface-1: #fcfcfb;
    --border:    #e2e1dc;
    --border-strong: #cfcec8;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #85837c;
    --accent:  #2a78d6;
    --accent-soft: #2a78d61f;
    --good:    #008300;
    --warning: #eda100;
    --critical:#e34948;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --border:    #2e2e2c;
      --border-strong: #43423f;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8d8b82;
      --accent:  #3987e5;
      --accent-soft: #3987e52e;
      --good:    #3fa03f;
      --warning: #c98500;
      --critical:#e66767;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 64px;
    background: var(--surface-0); color: var(--text-primary);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
          "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }

  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-size: 19px; font-weight: 640; margin: 0; letter-spacing: -0.01em; }
  .meta { color: var(--text-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .meta b { color: var(--text-secondary); font-weight: 560; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; }
  .tile .k { color: var(--text-secondary); font-size: 12.5px; margin-bottom: 7px; }
  .tile .v { font-size: 25px; font-weight: 620; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 14px; font-weight: 500; color: var(--text-muted); margin-left: 3px; }
  .tile.neg .v { color: var(--critical); }

  section { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 22px; overflow: hidden; }
  .head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .head h2 { font-size: 14px; font-weight: 600; margin: 0; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=search], select {
    font: inherit; font-size: 13px; padding: 6px 9px; border-radius: 7px;
    border: 1px solid var(--border-strong); background: var(--surface-0); color: var(--text-primary);
  }
  input[type=search] { min-width: 190px; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; font-weight: 560; color: var(--text-secondary); background: var(--surface-0); position: sticky; top: 0; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--accent-soft); }
  td.num, th.num { text-align: right; }
  td.name { white-space: normal; min-width: 190px; }
  .sub { color: var(--text-muted); font-size: 12px; }

  /* 매출 크기는 한 계열이라 단일 색상 막대로만 표현한다 — 채널 구분은 이름이 한다. */
  /* 숫자와 같은 오른쪽 기준선에 붙여 왼쪽으로 자라게 한다 — 자라는 쪽만 둥글다. */
  .bar { display: block; height: 5px; border-radius: 3px 0 0 3px; background: var(--accent); min-width: 2px; margin: 5px 0 0 auto; }
  .barcell { min-width: 130px; }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-secondary); }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--good); }
  .pill.skip { color: var(--warning); }
  .pill.err { color: var(--critical); }

  .empty { padding: 40px 16px; text-align: center; color: var(--text-muted); }
  .note { font-size: 12.5px; color: var(--text-muted); }
  .note code { background: var(--surface-1); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-size: 12px; }
  button.link { font: inherit; font-size: 12.5px; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
  .tile.pos .v { color: var(--good); }
  td.pos { color: var(--good); }
  td.neg { color: var(--critical); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 22px; }
  .grid2 section { margin-bottom: 0; min-width: 0; }
  .grid2 + section { margin-top: 22px; }
  nav.top { font-size: 12.5px; margin-bottom: 8px; }
  nav.top a { color: var(--accent); }
  .bar-db { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--surface-1); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 12px 14px; margin-bottom: 18px; font-size: 13px; }
  .bar-db label { color: var(--text-secondary); display: inline-flex; gap: 6px; align-items: center; }
  .bar-db input[type=date], .bar-db input[type=password] {
    font: inherit; font-size: 13px; padding: 6px 9px; border-radius: 7px;
    border: 1px solid var(--border-strong); background: var(--surface-0); color: var(--text-primary);
  }
  .bar-db input[type=password] { width: 92px; letter-spacing: 0.2em; }
  .bar-db .spacer { flex: 1; }
  [hidden] { display: none !important; }
  .bar-db .msg { color: var(--text-muted); }
  .bar-db .msg.err { color: var(--critical); }
  button.btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 7px; cursor: pointer;
               border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  button.btn.ghost { background: none; color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top"><a href="./index.html">← 채널 일일 현황</a></nav>
  <header>
    <div>
      <h1>카페24 적립금 현황</h1>
      <div class="meta" id="meta">불러오는 중…</div>
    </div>
    <div class="controls">
      <input type="file" id="file" accept="application/json" hidden>
      <button class="link" id="pick">다른 날짜 파일 열기</button>
    </div>
  </header>

  <div class="bar-db" id="loginBar" hidden>
    <label for="pin">관리자 비밀번호</label>
    <input type="password" id="pin" inputmode="numeric" maxlength="4" placeholder="4자리" autocomplete="current-password">
    <button class="btn" id="loginBtn">DB 연결</button>
    <span class="msg" id="loginMsg">매출 리포트와 같은 비밀번호입니다. 연결 전에는 샘플 데이터가 보입니다.</span>
  </div>

  <div class="bar-db" id="rangeBar" hidden>
    <label for="from">기간</label>
    <input type="date" id="from"> <span class="sub">~</span> <input type="date" id="to">
    <button class="btn" id="queryBtn">조회</button>
    <span class="msg" id="dbMsg"></span>
    <span class="spacer"></span>
    <button class="btn ghost" id="logoutBtn">연결 해제</button>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="grid2">
    <section>
      <div class="head"><h2>일자별</h2></div>
      <div class="scroll"><table id="dateTable">
        <thead><tr><th>날짜</th><th class="num">건수</th><th class="num">지급</th><th class="num">차감</th><th class="num">순증</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>
    <section>
      <div class="head"><h2>사유별</h2></div>
      <div class="scroll"><table id="reasonTable">
        <thead><tr><th>사유</th><th class="num">건수</th><th class="num">지급</th><th class="num">차감</th><th class="num barcell">순증</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>
  </div>

  <section>
    <div class="head"><h2>회원별</h2><span class="note">잔액은 기간 내 마지막 내역 기준</span></div>
    <div class="scroll"><table id="memberTable">
      <thead><tr><th>회원</th><th class="num">건수</th><th class="num">지급</th><th class="num">차감</th><th class="num">순증</th><th class="num">가용 잔액</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <section>
    <div class="head">
      <h2>내역</h2>
      <div class="controls">
        <input type="search" id="q" placeholder="회원 · 주문번호 · 사유 검색">
        <select id="dir">
          <option value="">지급 + 차감</option>
          <option value="inc">지급만</option>
          <option value="dec">차감만</option>
        </select>
      </div>
    </div>
    <div class="scroll"><table id="lineTable">
      <thead><tr><th>일시</th><th>회원</th><th>사유</th><th>주문번호</th><th class="num">지급</th><th class="num">차감</th><th class="num">잔액</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <p class="note">
    DB 에 연결하면 수집기(<code>node src/points.js</code>)가 Firestore 에 쌓은 내역을 기간별로 읽어 집계합니다.
    연결 전에는 <code>data/points/latest.json</code> 이나 샘플 데이터를 보여줍니다.
  </p>
</div>

<script type="module">
import { summarize } from './src/core/points.js';

const won = (n) => `${Math.round(n).toLocaleString('ko-KR')}`;
const signed = (n) => (n > 0 ? `+${won(n)}` : n < 0 ? `−${won(-n)}` : '0');
const tone = (n) => (n > 0 ? 'pos' : n < 0 ? 'neg' : '');
const dash = (n) => (n ? won(n) : '–');
const el = (id) => document.getElementById(id);

/* ── DB 연결: sales-report 와 같은 Firebase 프로젝트 · 같은 관리자 계정 ─────────────── */
const firebaseConfig = {
  apiKey: 'AIzaSyAQSp-HukEK-U5OElWr8jzoXzXqzI-MQNc',
  authDomain: 'monfruit-sales.firebaseapp.com',
  projectId: 'monfruit-sales',
  storageBucket: 'monfruit-sales.firebasestorage.app',
  messagingSenderId: '120882085426',
  appId: '1:120882085426:web:2388fcac8bde3fb2ca862b',
};
const LOGIN_EMAIL = 'owner@monfruit-sales.web';   // sales-report 의 내부 고정 계정
const LINE_LIMIT = 5000;                          // 한 번에 읽는 내역 상한 — 넘으면 기간을 줄이라고 알린다

let snapshot = null;
let fs = null;
let auth = null;

async function loadSample() {
  for (const path of ['./data/points/latest.json', './data/points/sample.json']) {
    try {
      const res = await fetch(path, { cache: 'no-store' });
      if (!res.ok) continue;
      const data = await res.json();
      render(data, path.endsWith('sample.json') || data.mock ? '샘플 데이터' : '로컬 파일');
      return;
    } catch { /* file:// 로 열었거나 아직 수집 전 */ }
  }
  el('meta').textContent = 'DB 에 연결하거나 JSON 파일을 직접 열어 주세요.';
}

function setMsg(id, text, isErr = false) {
  el(id).textContent = text;
  el(id).classList.toggle('err', isErr);
}

async function login() {
  const pin = el('pin').value.trim();
  if (!/^\d{4}$/.test(pin)) return setMsg('loginMsg', '숫자 4자리를 입력하세요', true);
  setMsg('loginMsg', '확인 중…');
  try {
    await auth.signInWithEmailAndPassword(LOGIN_EMAIL, `mf${pin}`);  // sales-report 와 같은 변환
  } catch (e) {
    const wrong = ['auth/wrong-password', 'auth/invalid-credential', 'auth/invalid-login-credentials', 'auth/user-not-found'];
    setMsg('loginMsg', wrong.includes(e.code) ? '비밀번호가 틀렸습니다' : `로그인 오류: ${e.message}`, true);
  }
}

const docs = (snap) => snap.docs.map((d) => d.data());

/** 가장 최근에 수집한 기간을 기본값으로 연다. */
async function openLatest() {
  setMsg('dbMsg', '불러오는 중…');
  try {
    const latest = docs(await fs.collection('cafe24PointReports').orderBy('generatedAt', 'desc').limit(1).get())[0];
    if (!latest) {
      setMsg('dbMsg', 'DB 에 아직 적립금 데이터가 없습니다 — 수집기(node src/points.js)를 한 번 실행해 주세요.', true);
      return;
    }
    el('from').value = latest.range.from;
    el('to').value = latest.range.to;
    await query();
  } catch (e) {
    setMsg('dbMsg', dbError(e), true);
  }
}

/** 기간 내역을 DB 에서 읽어 브라우저에서 다시 집계한다. 수집한 기간과 정확히 같으면 카페24 합계를 쓴다. */
async function query() {
  const from = el('from').value;
  const to = el('to').value;
  if (!from || !to || from > to) return setMsg('dbMsg', '기간을 확인해 주세요', true);
  setMsg('dbMsg', '불러오는 중…');
  try {
    const [lineSnap, reportSnap] = await Promise.all([
      fs.collection('cafe24Points').where('date', '>=', from).where('date', '<=', to)
        .orderBy('date', 'desc').limit(LINE_LIMIT).get(),
      fs.collection('cafe24PointReports').doc(`${from}_${to}`).get(),
    ]);
    const lines = docs(lineSnap);
    const data = summarize(lines, { from, to });
    const saved = reportSnap.exists ? reportSnap.data() : null;
    if (saved) {
      data.report = saved.report;
      data.generatedAt = saved.syncedAt ?? saved.generatedAt;
    } else {
      const newest = lines.reduce((m, l) => (l.syncedAt > m ? l.syncedAt : m), '');
      if (newest) data.generatedAt = newest;
    }
    render(data, 'DB');
    setMsg('dbMsg', lines.length >= LINE_LIMIT
      ? `내역이 ${LINE_LIMIT.toLocaleString('ko-KR')}건을 넘어 일부만 집계했습니다 — 기간을 줄여 주세요`
      : `내역 ${lines.length.toLocaleString('ko-KR')}건`, lines.length >= LINE_LIMIT);
  } catch (e) {
    setMsg('dbMsg', dbError(e), true);
  }
}

function dbError(e) {
  if (e.code === 'permission-denied') return 'DB 읽기 권한이 없습니다 — Firestore 보안 규칙에 cafe24Points · cafe24PointReports 를 추가해 주세요.';
  return `DB 오류: ${e.message}`;
}

function bootDb() {
  if (typeof firebase === 'undefined') {
    loadSample();
    return;
  }
  firebase.initializeApp(firebaseConfig);
  fs = firebase.firestore();
  auth = firebase.auth();
  auth.onAuthStateChanged((user) => {
    el('loginBar').hidden = !!user;
    el('rangeBar').hidden = !user;
    if (user) { el('pin').value = ''; openLatest(); }
    else loadSample();
  });
}

function render(data, tag) {
  snapshot = data;
  const r = data.report;
  const collected = new Date(data.generatedAt).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });
  el('meta').innerHTML = `<b>${data.range.from} ~ ${data.range.to}</b> · 수집 ${collected}`
    + ` · 내역 ${data.lineCount.toLocaleString('ko-KR')}건${r.fromReport ? '' : ' · 합계는 내역 기준'}${tag ? ` · ${tag}` : ''}`;

  el('tiles').innerHTML = [
    ['지급', `${won(r.increase)}<small>원</small>`, ''],
    ['차감', `${won(r.decrease)}<small>원</small>`, r.decrease ? 'neg' : ''],
    ['순증', `${signed(r.total)}<small>원</small>`, tone(r.total)],
    ['미가용', `${won(r.unavailable)}<small>원</small>`, ''],
    ['대상 회원', `${data.memberCount.toLocaleString('ko-KR')}<small>명</small>`, ''],
  ].map(([k, v, cls]) => `<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  const row = (label, g, extra = '') => `<tr>
    <td>${label}</td><td class="num">${g.count}</td>
    <td class="num">${dash(g.increase)}</td><td class="num">${dash(g.decrease)}</td>
    <td class="num ${tone(g.delta)}">${signed(g.delta)}${extra}</td></tr>`;

  el('dateTable').tBodies[0].innerHTML = [...data.byDate].reverse().map((g) => row(esc(g.key), g)).join('')
    || '<tr><td colspan="5" class="empty">내역 없음</td></tr>';

  const maxReason = Math.max(1, ...data.byReason.map((g) => Math.abs(g.delta)));
  el('reasonTable').tBodies[0].innerHTML = data.byReason.map((g) => row(esc(g.key), g,
    `<span class="bar" style="width:${(Math.abs(g.delta) / maxReason * 100).toFixed(1)}%"></span>`)).join('')
    || '<tr><td colspan="5" class="empty">내역 없음</td></tr>';
  el('reasonTable').querySelectorAll('tbody td:last-child').forEach((td) => td.classList.add('barcell'));

  const members = data.byMember.slice(0, 100);
  el('memberTable').tBodies[0].innerHTML = members.map((m) => `<tr>
    <td>${esc(m.key)}</td><td class="num">${m.count}</td>
    <td class="num">${dash(m.increase)}</td><td class="num">${dash(m.decrease)}</td>
    <td class="num ${tone(m.delta)}">${signed(m.delta)}</td>
    <td class="num">${m.balance === null ? '–' : won(m.balance)}</td></tr>`).join('')
    + (data.byMember.length > 100 ? `<tr><td colspan="6" class="sub">…외 ${data.byMember.length - 100}명 (내역 검색으로 찾아 보세요)</td></tr>` : '')
    || '<tr><td colspan="6" class="empty">내역 없음</td></tr>';

  renderLines();
}

function renderLines() {
  if (!snapshot) return;
  const q = el('q').value.trim().toLowerCase();
  const dir = el('dir').value;
  const rows = snapshot.lines
    .filter((l) => !dir || (dir === 'inc' ? l.increase > 0 : l.decrease > 0))
    .filter((l) => !q || `${l.memberId} ${l.orderId} ${l.reason} ${l.kind}`.toLowerCase().includes(q));

  const body = el('lineTable').tBodies[0];
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty">해당하는 내역이 없습니다.</td></tr>';
    return;
  }
  const fmt = (iso) => (iso ? new Date(iso).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', dateStyle: 'short', timeStyle: 'short' }) : '–');
  body.innerHTML = rows.slice(0, 300).map((l) => `<tr>
    <td class="sub">${fmt(l.at)}</td>
    <td>${esc(l.memberId || '–')}<div class="sub">${esc(l.group)}</div></td>
    <td class="name">${esc(l.reason || l.kind || '–')}</td>
    <td class="sub">${esc(l.orderId || '–')}</td>
    <td class="num ${l.increase ? 'pos' : ''}">${dash(l.increase)}</td>
    <td class="num ${l.decrease ? 'neg' : ''}">${dash(l.decrease)}</td>
    <td class="num">${l.balance === null ? '–' : won(l.balance)}</td>
  </tr>`).join('')
  + (rows.length > 300 ? `<tr><td colspan="7" class="sub">…외 ${rows.length - 300}건 (검색으로 좁혀 보세요)</td></tr>` : '');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

el('loginBtn').addEventListener('click', login);
el('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
el('queryBtn').addEventListener('click', query);
el('logoutBtn').addEventListener('click', () => auth.signOut());
el('q').addEventListener('input', renderLines);
el('dir').addEventListener('change', renderLines);
el('pick').addEventListener('click', () => el('file').click());

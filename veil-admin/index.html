<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FAF8F2">
<title>Veil 관리자</title>
<style>
  :root{
    --bg:#FAF8F2; --ink:#26251F; --dim:#9C968A; --line:#E8E3D6;
    --danger:#BF4A31; --ok:#3B7A57; --warn:#B8860B; --card:#FFFFFF;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  #app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
  .screen{display:none;flex-direction:column;min-height:100vh}
  .screen.active{display:flex}
  .grow{flex:1}
  .pad{padding:0 var(--s5)}
  button{font-family:inherit;cursor:pointer;border:0;color:inherit}
  .dim{color:var(--dim)}
  .small{font-size:14px}
  .tiny{font-size:12px}
  .danger{color:var(--danger)}
  .ok{color:var(--ok)}
  b{font-weight:700}

  .top{position:sticky;top:0;z-index:5;background:var(--bg);padding:var(--s5) var(--s5) var(--s3);display:flex;align-items:center;gap:var(--s3);border-bottom:1px solid var(--line)}
  .top .back{background:none;font-size:26px;line-height:1;padding:0 4px 0 0;color:var(--ink)}
  .top .t{font-size:20px;font-weight:800}
  .top .sub{font-size:12px;color:var(--dim);font-weight:500}

  .tabs{display:flex;gap:var(--s5);padding:var(--s3) var(--s5) 0}
  .tab{background:none;font-size:16px;font-weight:700;color:var(--dim);padding:6px 0 12px;position:relative}
  .tab.on{color:var(--ink)}
  .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink)}
  .tab .cnt{font-size:12px;color:var(--danger);font-weight:800;margin-left:3px;vertical-align:top}

  .item{width:100%;text-align:left;background:none;padding:var(--s4) 0;border-bottom:1px solid var(--line);display:block}
  .item .r1{display:flex;align-items:center;gap:8px}
  .item .nm{font-size:17px;font-weight:800}
  .item .meta{font-size:13px;color:var(--dim);margin-top:3px}
  .arr{margin-left:auto;color:var(--dim);font-size:18px}

  .badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:20px;border:1.4px solid currentColor;line-height:1.5}
  .badge.red{color:var(--danger)}
  .badge.warn{color:var(--warn)}
  .badge.ok{color:var(--ok)}
  .badge.dim{color:var(--dim)}

  .sec{padding:var(--s4) 0;border-bottom:1px solid var(--line)}
  .mlabel{font-size:12px;color:var(--dim);font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}

  .rep{padding:10px 0;border-bottom:1px dashed var(--line)}
  .rep:last-child{border-bottom:0}
  .rep .h{display:flex;align-items:center;gap:8px;font-size:14px}
  .rep .reason{font-weight:700}
  .rep .note{font-size:13px;color:var(--dim);margin-top:3px}
  .rep .who{font-size:12px;color:var(--dim);margin-left:auto}

  .log{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:var(--s4);margin-top:8px}
  .logbar{font-size:11px;color:var(--dim);font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:12px}
  .logbar .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
  .msg{display:flex;flex-direction:column;margin-bottom:10px;max-width:82%}
  .msg .who{font-size:11px;color:var(--dim);margin-bottom:2px}
  .msg .bub{padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .msg.them{align-self:flex-start}
  .msg.them .bub{background:#F1ECE0}
  .msg.sub{align-self:flex-end;text-align:right}
  .msg.sub .who{align-self:flex-end}
  .msg.sub .bub{background:#26251F;color:#F7F3EA}
  .msg.flag .bub{outline:2px solid var(--danger);outline-offset:1px}
  .sys{text-align:center;font-size:11px;color:var(--dim);margin:8px 0}

  .actions{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(250,248,242,0),var(--bg) 22%);padding:var(--s4) var(--s5) var(--s5)}
  .btn{width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:800;background:var(--ink);color:var(--bg);margin-top:8px}
  .btn.red{background:var(--danger)}
  .btn.warn{background:var(--warn)}
  .btn.ok{background:var(--ok)}
  .btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink);font-weight:700}
  .btn.sm{padding:11px;font-size:15px}
  .row2{display:flex;gap:8px}
  .row2 .btn{margin-top:8px}

  .empty{padding:var(--s7) var(--s5);text-align:center;color:var(--dim)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:30px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;white-space:nowrap;max-width:90vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .pill{font-size:12px;font-weight:800;padding:3px 9px;border-radius:20px}
  .pill.y{background:#FBE7C6;color:#7a5b00}
  .pill.r{background:#F3D3CB;color:#7a1c0c}
  .note-box{background:#F1ECE0;border-radius:10px;padding:11px 13px;font-size:14px;margin-top:8px;white-space:pre-wrap}
  .kv{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
  .kv .dim{color:var(--dim)}
  .hint{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
  .resetbar{padding:var(--s5);text-align:center}
  .resetbar button{background:none;color:var(--dim);font-size:12px;text-decoration:underline}
</style>
</head>
<body>
<div id="app">

  <!-- 목록 -->
  <section id="s-list" class="screen active">
    <div class="top">
      <div>
        <div class="t">Veil 관리자</div>
        <div class="sub">신고·이의제기 심사 · 목업</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" id="tab-reports" onclick="setTab('reports')">신고 큐<span class="cnt" id="c-reports"></span></button>
      <button class="tab" id="tab-appeals" onclick="setTab('appeals')">이의제기<span class="cnt" id="c-appeals"></span></button>
      <button class="tab" id="tab-users" onclick="setTab('users')">유저</button>
    </div>
    <div class="grow pad" id="listBody" style="padding-top:0"></div>
    <div class="resetbar"><button onclick="resetDemo()">데모 데이터 초기화 ↺</button></div>
  </section>

  <!-- 신고 상세 -->
  <section id="s-report" class="screen">
    <div class="top"><button class="back" onclick="go('s-list')">‹</button><div class="t">신고 심사</div></div>
    <div class="grow pad" id="reportBody" style="padding-top:0"></div>
    <div class="actions" id="reportActions"></div>
  </section>

  <!-- 이의제기 상세 -->
  <section id="s-appeal" class="screen">
    <div class="top"><button class="back" onclick="go('s-list')">‹</button><div class="t">이의제기 심사</div></div>
    <div class="grow pad" id="appealBody" style="padding-top:0"></div>
    <div class="actions" id="appealActions"></div>
  </section>

  <!-- 유저 상세 -->
  <section id="s-user" class="screen">
    <div class="top"><button class="back" onclick="go('s-list')">‹</button><div class="t">유저 상세</div></div>
    <div class="grow pad" id="userBody" style="padding-top:0"></div>
  </section>

  <div id="toast" class="toast"></div>
</div>

<script>
const KEY='veil_admin_v1';
const CARD={1:{label:'🟡 옐로카드 1차',ban:'매칭 24시간 정지'},2:{label:'🟡 옐로카드 2차',ban:'매칭 48시간 정지'},3:{label:'🔴 레드카드',ban:'앱 이용 정지(영구)'}};
let db=null, curTab='reports', curId=null;

/* ---------- 데모 데이터 ---------- */
function seed(){
  return {
    // 대화 서버 원본 로그 (관리자만 열람 · 신고/이의제기 트리거 시에만)
    convos:{
      cv1:{a:'분주한 탁자',b:'조용한 창문',msgs:[
        {who:'a',t:'안녕하세요 :)',ts:'14:02'},
        {who:'b',t:'네 반가워요',ts:'14:03'},
        {who:'a',t:'사진 한 장만 보내줄 수 있어요? 궁금해서요',ts:'14:05'},
        {who:'b',t:'저희 앱은 사진 없이 글로만 대화하는 곳이에요',ts:'14:06'},
        {who:'a',t:'몸매 어때요? 야한 얘기 하면 안돼요?',ts:'14:07',flag:true},
        {who:'b',t:'그만하세요. 불편해요.',ts:'14:08'},
        {who:'a',t:'튕기지 말고… 어차피 익명인데 뭐 어때',ts:'14:09',flag:true},
      ]},
      cv2:{a:'활기찬 구름',b:'고요한 별',msgs:[
        {who:'a',t:'혹시 재테크 관심 있으세요?',ts:'21:10'},
        {who:'b',t:'조금은요',ts:'21:12'},
        {who:'a',t:'제가 하는 코인 리딩방 있는데 원금 보장에 하루 3%씩 나와요. 입금하면 두 배로…',ts:'21:13',flag:true},
        {who:'b',t:'그건 사기 아닌가요',ts:'21:14'},
        {who:'a',t:'계좌 알려드릴게요 지금만 특별히',ts:'21:15',flag:true},
      ]},
      cv3:{a:'따뜻한 편지',b:'차분한 시계',msgs:[
        {who:'a',t:'오늘 하루 어땠어요?',ts:'09:30'},
        {who:'b',t:'평범했어요 ㅎㅎ 책 좀 읽고',ts:'09:33'},
        {who:'a',t:'무슨 책이요? 저도 요즘 소설 읽는 중이에요',ts:'09:35'},
        {who:'b',t:'오 저도 소설 좋아해요! 추천해줄까요?',ts:'09:36'},
        {who:'a',t:'네 좋아요 :)',ts:'09:38'},
      ]},
    },
    // 신고 (같은 피신고자 여러 건 = 서로 다른 신고자 집계)
    reports:[
      {id:'r1',target:'분주한 탁자',reporter:'익명#4471',reason:'성희롱·성적 발언',note:'대화 중 성적인 발언을 반복했어요',convo:'cv1',ts:'오늘 14:10',status:'pending'},
      {id:'r2',target:'분주한 탁자',reporter:'익명#2093',reason:'성희롱·성적 발언',note:'몸매 물어보고 사진 요구',convo:'cv1',ts:'2일 전',status:'pending'},
      {id:'r3',target:'분주한 탁자',reporter:'익명#8810',reason:'개인정보 요구',note:'사진 계속 요구함',convo:'cv1',ts:'3일 전',status:'pending'},
      {id:'r4',target:'활기찬 구름',reporter:'익명#1520',reason:'사기·금전 요구',note:'코인 리딩방으로 입금 유도',convo:'cv2',ts:'오늘 21:16',status:'pending'},
    ],
    // 이의제기 (카드 받은 유저가 제기)
    appeals:[
      {id:'a1',user:'따뜻한 편지',card:1,reason:'협박·위협',note:'저는 협박한 적이 없어요. 그냥 책 얘기만 했는데 갑자기 신고를 당했어요. 대화 기록을 확인해주세요.',convo:'cv3',ts:'오늘 10:00',status:'pending'},
    ],
    // 유저 제재 현황
    users:{
      '분주한 탁자':{card:0,rx:0},
      '활기찬 구름':{card:0,rx:0},
      '따뜻한 편지':{card:1,rx:0,reason:'협박·위협'},
      '조용한 창문':{card:0,rx:0},
    },
  };
}
function loadDb(){ try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.reports)return v;}catch(e){} const s=seed();saveDb(s);return s; }
function saveDb(x){ try{localStorage.setItem(KEY,JSON.stringify(x||db))}catch(e){} }
function resetDemo(){ db=seed();saveDb(db);renderList();toast('데모 데이터를 초기화했어요'); }

/* ---------- 유틸 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
let toastT=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

function pendingReports(){return db.reports.filter(r=>r.status==='pending')}
function pendingAppeals(){return db.appeals.filter(a=>a.status==='pending')}
// 피신고자별 그룹 (서로 다른 신고자 수 = 카드 임계치)
function reportGroups(){
  const g={};
  pendingReports().forEach(r=>{ (g[r.target]=g[r.target]||[]).push(r); });
  return Object.entries(g).map(([target,list])=>{
    const reporters=new Set(list.map(r=>r.reporter));
    return {target,list,distinct:reporters.size};
  }).sort((a,b)=>b.distinct-a.distinct);
}

/* ---------- 목록 ---------- */
function setTab(t){curTab=t;['reports','appeals','users'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('on',x===t));renderList()}
function renderCounts(){
  const pr=reportGroups().length, pa=pendingAppeals().length;
  document.getElementById('c-reports').textContent=pr?pr:'';
  document.getElementById('c-appeals').textContent=pa?pa:'';
}
function renderList(){
  renderCounts();
  const el=document.getElementById('listBody');
  if(curTab==='reports'){
    const groups=reportGroups();
    if(!groups.length){el.innerHTML=`<div class="empty">대기 중인 신고가 없어요.</div>`;return}
    el.innerHTML=groups.map(g=>{
      const over=g.distinct>=3;
      const reasons=[...new Set(g.list.map(r=>r.reason))].join(' · ');
      return `<button class="item" onclick="openReport('${esc(g.target)}')">
        <div class="r1"><span class="nm">${esc(g.target)}</span>
          <span class="badge ${over?'red':'warn'}">신고자 ${g.distinct}명${over?' · 카드 대상':''}</span>
          <span class="arr">›</span></div>
        <div class="meta">${esc(reasons)} · 최근 ${esc(g.list[0].ts)}</div>
      </button>`;
    }).join('');
  }else if(curTab==='appeals'){
    const ap=pendingAppeals();
    if(!ap.length){el.innerHTML=`<div class="empty">대기 중인 이의제기가 없어요.</div>`;return}
    el.innerHTML=ap.map(a=>`<button class="item" onclick="openAppeal('${a.id}')">
      <div class="r1"><span class="nm">${esc(a.user)}</span>
        <span class="pill ${a.card>=3?'r':'y'}">${a.card>=3?'레드':'옐로'} 이의</span>
        <span class="arr">›</span></div>
      <div class="meta">사유: ${esc(a.reason)} · ${esc(a.ts)}</div>
    </button>`).join('');
  }else{
    const us=Object.entries(db.users);
    el.innerHTML=us.map(([nick,u])=>{
      const c=u.card>0?`<span class="pill ${u.card>=3?'r':'y'}">${CARD[u.card].label.replace(/^\S+\s/,'')}</span>`:`<span class="badge dim">정상</span>`;
      return `<button class="item" onclick="openUser('${esc(nick)}')">
        <div class="r1"><span class="nm">${esc(nick)}</span>${c}<span class="arr">›</span></div>
        <div class="meta">${u.card>0?esc(CARD[u.card].ban):'제재 없음'}${u.reason?' · 사유 '+esc(u.reason):''}</div>
      </button>`;
    }).join('');
  }
}

/* ---------- 대화 로그 렌더 ---------- */
function logHTML(convoId,subjectNick){
  const cv=db.convos[convoId]; if(!cv)return '';
  const rows=cv.msgs.map(m=>{
    const name=m.who==='a'?cv.a:cv.b;
    const isSubject=name===subjectNick;
    const side=isSubject?'sub':'them';
    return `<div class="msg ${side}${m.flag?' flag':''}">
      <div class="who">${esc(name)}${isSubject?' · 대상':''} · ${esc(m.ts)}</div>
      <div class="bub">${esc(m.t)}</div></div>`;
  }).join('');
  return `<div class="log">
    <div class="logbar"><span class="dot"></span> 서버 원본 기록 · 캡처 아님 · 조작 불가 · 심사 목적 열람</div>
    ${rows}
    <div class="sys">— 기록 끝 —</div>
  </div>`;
}

/* ---------- 신고 상세 ---------- */
function openReport(target){
  curId=target;
  const list=pendingReports().filter(r=>r.target===target);
  const distinct=new Set(list.map(r=>r.reporter)).size;
  const convo=list[0].convo;
  const over=distinct>=3;
  const reps=list.map(r=>`<div class="rep">
    <div class="h"><span class="reason">${esc(r.reason)}</span><span class="who">${esc(r.reporter)} · ${esc(r.ts)}</span></div>
    ${r.note?`<div class="note">“${esc(r.note)}”</div>`:''}
  </div>`).join('');
  document.getElementById('reportBody').innerHTML=`
    <div class="sec" style="border-bottom:0;padding-bottom:0">
      <div class="r1" style="display:flex;align-items:center;gap:8px">
        <span style="font-size:22px;font-weight:800">${esc(target)}</span>
        <span class="badge ${over?'red':'warn'}">서로 다른 신고자 ${distinct}명</span>
      </div>
      <div class="hint">${over
        ? '<b class="danger">카드 발급 임계치(3명) 충족.</b> 아래 서버 원본을 확인하고 판단하세요.'
        : '아직 임계치(서로 다른 3명) 미만입니다. 단건으로 제재하지 않는 게 원칙이에요.'}</div>
    </div>
    <div class="sec"><div class="mlabel">신고 내역 (${list.length}건)</div>${reps}</div>
    <div class="sec" style="border-bottom:0"><div class="mlabel">신고된 대화 · 서버 원본</div>${logHTML(convo,target)}</div>`;
  document.getElementById('reportActions').innerHTML=`
    <div class="row2">
      <button class="btn warn sm" onclick="issueCard('${esc(target)}',1)">🟡 옐로카드</button>
      <button class="btn red sm" onclick="issueCard('${esc(target)}',3)">🔴 레드카드</button>
    </div>
    <button class="btn ghost sm" onclick="dismissReports('${esc(target)}')">무혐의 · 신고 기각</button>
    <div class="hint" style="text-align:center">카드 부여 시 해당 대기 신고는 처리 완료로 이동해요.</div>`;
  go('s-report');
}
function issueCard(target,lv){
  const u=db.users[target]||(db.users[target]={card:0,rx:0});
  // 옐로 버튼은 다음 단계로 승급(1→2), 레드는 즉시 3
  let level=lv;
  if(lv===1) level=Math.min((u.card||0)+1,2);
  u.card=level; u.rx=0;
  const reason=(pendingReports().find(r=>r.target===target)||{}).reason||'';
  u.reason=reason;
  db.reports.forEach(r=>{if(r.target===target&&r.status==='pending')r.status='actioned'});
  saveDb();
  toast(CARD[level].label+' 부여 · '+CARD[level].ban);
  go('s-list');renderList();
}
function dismissReports(target){
  db.reports.forEach(r=>{if(r.target===target&&r.status==='pending')r.status='dismissed'});
  saveDb();toast('무혐의로 신고를 기각했어요');go('s-list');renderList();
}

/* ---------- 이의제기 상세 ---------- */
function openAppeal(id){
  curId=id;
  const a=db.appeals.find(x=>x.id===id); if(!a)return;
  document.getElementById('appealBody').innerHTML=`
    <div class="sec" style="border-bottom:0;padding-bottom:0">
      <div class="r1" style="display:flex;align-items:center;gap:8px">
        <span style="font-size:22px;font-weight:800">${esc(a.user)}</span>
        <span class="pill ${a.card>=3?'r':'y'}">${esc(CARD[a.card].label.replace(/^\S+\s/,''))}</span>
      </div>
      <div class="kv"><span class="dim">현재 제재</span><span>${esc(CARD[a.card].ban)}</span></div>
      <div class="kv"><span class="dim">카드 사유</span><span>${esc(a.reason)}</span></div>
      <div class="kv"><span class="dim">접수</span><span>${esc(a.ts)}</span></div>
    </div>
    <div class="sec"><div class="mlabel">유저 소명</div><div class="note-box">${esc(a.note||'(작성 없음)')}</div></div>
    <div class="sec" style="border-bottom:0"><div class="mlabel">해당 대화 · 서버 원본 재검토</div>${logHTML(a.convo,a.user)}
      <div class="hint">서버 원본에서 실제 위반이 확인되면 <b>기각(제재 유지)</b>, 위반 근거가 없으면 <b>인정(제재 취소)</b>하세요.</div></div>`;
  document.getElementById('appealActions').innerHTML=`
    <button class="btn ok sm" onclick="resolveAppeal('${id}',true)">인정 · 제재 취소</button>
    <button class="btn ghost sm" onclick="resolveAppeal('${id}',false)">기각 · 제재 유지</button>`;
  go('s-appeal');
}
function resolveAppeal(id,accept){
  const a=db.appeals.find(x=>x.id===id); if(!a)return;
  a.status=accept?'accepted':'rejected';
  const u=db.users[a.user];
  if(accept&&u){ u.card=Math.max((u.card||1)-1,0); if(!u.card)u.reason=''; }
  saveDb();
  toast(accept?'이의제기 인정 · 제재를 취소했어요':'이의제기 기각 · 제재를 유지해요');
  go('s-list');renderList();
}

/* ---------- 유저 상세 ---------- */
function openUser(nick){
  const u=db.users[nick]||{card:0,rx:0};
  const rel=db.reports.filter(r=>r.target===nick);
  const ap=db.appeals.filter(x=>x.user===nick);
  const repHTML=rel.length?rel.map(r=>`<div class="rep"><div class="h"><span class="reason">${esc(r.reason)}</span><span class="who">${esc(r.status)} · ${esc(r.ts)}</span></div>${r.note?`<div class="note">“${esc(r.note)}”</div>`:''}</div>`).join(''):'<div class="hint">신고 내역 없음</div>';
  const apHTML=ap.length?ap.map(x=>`<div class="rep"><div class="h"><span class="reason">이의제기</span><span class="who">${esc(x.status)} · ${esc(x.ts)}</span></div><div class="note">“${esc(x.note)}”</div></div>`).join(''):'<div class="hint">이의제기 내역 없음</div>';
  document.getElementById('userBody').innerHTML=`
    <div class="sec" style="border-bottom:0;padding-bottom:0">
      <div style="font-size:22px;font-weight:800">${esc(nick)}</div>
      <div class="kv"><span class="dim">현재 카드</span><span>${u.card>0?esc(CARD[u.card].label):'없음(정상)'}</span></div>
      <div class="kv"><span class="dim">제재</span><span>${u.card>0?esc(CARD[u.card].ban):'—'}</span></div>
      <div class="kv"><span class="dim">누적(다음 카드까지)</span><span>${u.rx||0} / 3</span></div>
    </div>
    <div class="sec"><div class="mlabel">신고 이력</div>${repHTML}</div>
    <div class="sec" style="border-bottom:0"><div class="mlabel">이의제기 이력</div>${apHTML}</div>`;
  go('s-user');
}

/* ---------- 부팅 ---------- */
db=loadDb();
setTab('reports');
</script>
</body>

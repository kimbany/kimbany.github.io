<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeskMemo</title>
  <!-- TODO(M4): Tailwind CDN is convenient but fails offline in a desktop app.
       Swap for a locally bundled stylesheet before release. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: #edecea; }
    /* Hide scrollbars but keep scrolling */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* The drag region must not capture text selection */
    [data-tauri-drag-region] { -webkit-user-select: none; user-select: none; }
    /* Note cards are individually resizable from the bottom-right grip */
    .note-card { resize: both; overflow: hidden; }
    .note-card.pinned { resize: none; }
    /* Subtle resize grip hint */
    .note-card::-webkit-resizer { background: rgba(0,0,0,0.15); }
    /* Checklist item drag handle + drop indicators */
    .drag-handle-item { cursor: grab; touch-action: none; }
    .drag-handle-item:active { cursor: grabbing; }
    .item-row.drop-before { box-shadow: inset 0 2px 0 0 #6366f1; }
    .item-row.drop-after  { box-shadow: inset 0 -2px 0 0 #6366f1; }
    .item-row.drop-child  { background: rgba(99,102,241,0.18); border-radius: 4px; }

    /* Card inner elements adapt to card color via CSS vars set in JS */
    .note-card .fld { background: var(--fld); }
    .note-card .item-row { border-bottom: 1px solid var(--line); }
    .note-card input::placeholder,
    .note-card textarea::placeholder { color: currentColor; opacity: 0.45; }

    /* Toggle switch (replaces checkbox) — uses currentColor of the card */
    .toggle {
      position: relative; width: 34px; height: 18px; flex: none;
      border-radius: 9999px; border: 1.5px solid currentColor;
      background: transparent; transition: background .15s; cursor: pointer;
    }
    .toggle .toggle-knob {
      position: absolute; top: 1.5px; left: 1.5px;
      width: 12px; height: 12px; border-radius: 9999px;
      background: currentColor; transition: left .15s;
    }
    .toggle.on { background: currentColor; }
    .toggle.on .toggle-knob { left: 18px; background: var(--card-bg, #2b3a5c); }
  </style>
</head>
<body class="overflow-hidden select-none">
  <!-- Board shell -->
  <div class="flex h-screen w-screen flex-col bg-[#edecea] text-neutral-700">
    <!-- Title bar (draggable) -->
    <header data-tauri-drag-region
            class="flex items-center justify-between border-b border-black/5 px-3 py-2 text-neutral-700">
      <div data-tauri-drag-region class="flex items-center gap-2 text-sm font-semibold">
        <span class="text-[#2b3a5c]">●</span> DeskMemo
      </div>
      <div class="flex items-center gap-1">
        <button id="btn-add"
                title="새 메모 / 체크리스트 (Ctrl+Alt+N)"
                class="rounded-md px-2 py-1 text-lg leading-none hover:bg-black/5">＋</button>
        <button id="btn-list"
                title="메모 목록 (숨김 포함)"
                class="rounded-md px-2 py-1 text-base leading-none hover:bg-black/5">📋</button>
        <button id="btn-cal"
                title="달력 열기/닫기"
                class="rounded-md px-2 py-1 text-base leading-none hover:bg-black/5">📅</button>
        <button id="btn-auth"
                title="로그인/로그아웃"
                class="hidden rounded-md px-2 py-1 text-xs leading-none hover:bg-black/5">로그인</button>
      </div>
    </header>

    <!-- Body: 메모 보드(좌) + 달력(우 1/3) -->
    <div class="flex flex-1 overflow-hidden">
      <main id="board" class="no-scrollbar relative flex-1 overflow-auto p-2">
        <div id="empty-hint"
             class="pointer-events-none absolute inset-0 flex items-center justify-center text-center text-sm text-neutral-400">
          <div>
            <p>메모가 없습니다.</p>
            <p class="mt-1 text-neutral-400">＋ 또는 <kbd class="rounded bg-black/10 px-1">Ctrl+Alt+N</kbd></p>
          </div>
        </div>
      </main>
      <aside id="calendar"
             class="no-scrollbar w-1/3 min-w-[190px] shrink-0 overflow-auto border-l border-white/20 bg-neutral-900/85 p-2 text-neutral-100"></aside>
    </div>

    <footer class="px-3 py-1 text-[11px] text-neutral-400" id="status">
      로컬 모드
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

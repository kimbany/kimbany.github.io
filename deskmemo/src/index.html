<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeskMemo</title>
  <!-- TODO(M4): Tailwind CDN is convenient but fails offline in a desktop app.
       Swap for a locally bundled stylesheet before release. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: transparent; }
    /* Hide scrollbars but keep scrolling */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* The drag region must not capture text selection */
    [data-tauri-drag-region] { -webkit-user-select: none; user-select: none; }
    /* Note cards are individually resizable from the bottom-right grip */
    .note-card { resize: both; overflow: hidden; }
    .note-card.pinned { resize: none; }
    /* Subtle resize grip hint */
    .note-card::-webkit-resizer { background: rgba(0,0,0,0.15); }
    /* Checklist item drag handle + drop indicators */
    .drag-handle-item { cursor: grab; touch-action: none; }
    .drag-handle-item:active { cursor: grabbing; }
    .item-row.drop-before { box-shadow: inset 0 2px 0 0 #6366f1; }
    .item-row.drop-after  { box-shadow: inset 0 -2px 0 0 #6366f1; }
    .item-row.drop-child  { background: rgba(99,102,241,0.18); border-radius: 4px; }
  </style>
</head>
<body class="overflow-hidden select-none">
  <!-- Board shell: frameless, semi-transparent backdrop -->
  <div class="flex h-screen w-screen flex-col rounded-xl border border-white/20 bg-neutral-900/40 backdrop-blur-sm">
    <!-- Title bar (draggable) -->
    <header data-tauri-drag-region
            class="flex items-center justify-between px-3 py-2 text-neutral-100">
      <div data-tauri-drag-region class="flex items-center gap-2 text-sm font-semibold">
        <span class="text-amber-300">●</span> DeskMemo
      </div>
      <div class="flex items-center gap-1">
        <button id="btn-list"
                title="메모 목록 (숨김 포함)"
                class="rounded-md px-2 py-1 text-base leading-none hover:bg-white/15">📋</button>
        <button id="btn-cal"
                title="달력 열기/닫기"
                class="rounded-md px-2 py-1 text-base leading-none hover:bg-white/15">📅</button>
        <button id="btn-auth"
                title="로그인/로그아웃"
                class="hidden rounded-md px-2 py-1 text-xs leading-none hover:bg-white/15">로그인</button>
        <button id="btn-new"
                title="새 일반 메모 (Ctrl+Alt+N)"
                class="rounded-md px-2 py-1 text-lg leading-none hover:bg-white/15">＋</button>
        <button id="btn-new-todo"
                title="새 체크리스트 메모"
                class="rounded-md px-2 py-1 text-base leading-none hover:bg-white/15">☑</button>
      </div>
    </header>

    <!-- Body: 메모 보드(좌) + 달력(우 1/3) -->
    <div class="flex flex-1 overflow-hidden">
      <main id="board" class="no-scrollbar relative flex-1 overflow-auto p-2">
        <div id="empty-hint"
             class="pointer-events-none absolute inset-0 flex items-center justify-center text-center text-sm text-neutral-300">
          <div>
            <p>메모가 없습니다.</p>
            <p class="mt-1 text-neutral-400">＋ 또는 <kbd class="rounded bg-white/20 px-1">Ctrl+Alt+N</kbd></p>
          </div>
        </div>
      </main>
      <aside id="calendar"
             class="no-scrollbar w-1/3 min-w-[170px] shrink-0 overflow-auto border-l border-white/20 p-2 text-neutral-100"></aside>
    </div>

    <footer class="px-3 py-1 text-[11px] text-neutral-400" id="status">
      로컬 모드
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

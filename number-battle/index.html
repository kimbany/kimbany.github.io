<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>파티 박스 — 번호 쟁탈전 · 가챠 뽑기</title>
  <meta name="description" content="번호 쟁탈전과 가챠 뽑기. 번호가 붙은 피규어·랜덤박스를 오프라인에서 재미있게 나누는 파티게임 웹앱." />
  <meta name="theme-color" content="#10061f" />
  <meta name="color-scheme" content="dark" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn btn-ghost btn-sm topbar-home" id="home-btn" type="button" hidden aria-label="홈으로">‹ 홈</button>
      <div class="brand" id="brand">파티 박스</div>
      <div class="spacer"></div>
      <span class="chip" id="phase-chip" hidden></span>
      <button class="btn btn-ghost btn-sm" id="host-btn" type="button" hidden>진행자</button>
    </header>
    <main class="screen" id="screen"></main>
  </div>

  <div id="overlay-root"></div>
  <canvas id="confetti"></canvas>

  <noscript>
    <p style="padding:20px;text-align:center">이 게임을 하려면 자바스크립트를 켜야 합니다.</p>
  </noscript>

  <script type="module" src="./js/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>비밀 번호 쟁탈전 — 피규어 배분 파티게임</title>
  <meta name="description" content="번호를 몰래 고르고, 겹친 번호는 미니게임으로 쟁탈! 오프라인 피규어 배분을 위한 파티게임 웹앱." />
  <meta name="theme-color" content="#10061f" />
  <meta name="color-scheme" content="dark" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">비밀 번호 <span>쟁탈전</span></div>
      <div class="spacer"></div>
      <span class="chip" id="phase-chip">게임 설정</span>
      <button class="btn btn-ghost btn-sm" id="host-btn" type="button">진행자</button>
    </header>
    <main class="screen" id="screen"></main>
  </div>

  <div id="overlay-root"></div>
  <canvas id="confetti"></canvas>

  <noscript>
    <p style="padding:20px;text-align:center">이 게임을 하려면 자바스크립트를 켜야 합니다.</p>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
